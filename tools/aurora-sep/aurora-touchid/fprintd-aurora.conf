[Unit]
# aurora-touchid-device.service waits for /dev/sep-bio before fprintd starts:
# a DeviceAllow= path is resolved to a device number when fprintd's cgroup is
# set up, before any ExecStartPre= runs, and is dropped if the node does not
# exist yet. aurora-sep-ready.service does the same where the aurora-sep
# package is installed.
Wants=aurora-touchid-device.service
After=apple-sep.service aurora-touchid-device.service aurora-sep-ready.service

[Service]
# Only the Touch ID node, not the whole misc class (uinput, fuse, kvm,
# device-mapper control, ...).
DeviceAllow=/dev/sep-bio rw
