# The Touch ID sensor is the power button. Touching it to authenticate goes to
# the enclave and is never a key press, but pressing it is, and logind cannot
# tell a press meant for the sensor from one meant for the button. Suspend
# rather than power off on a short press, so a press while authenticating
# costs nothing: the next press wakes the machine. Holding the button for
# 5 s still powers off, cleanly. GNOME sessions and the GDM login screen
# handle a short press themselves (power-button-action, suspend by default);
# this covers everything else.
[Login]
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
