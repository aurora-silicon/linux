%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/apple,smc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Mac System Management Controller

maintainers:
  - Sven Peter <sven@kernel.org>

description:
  Apple Mac System Management Controller implements various functions
  such as GPIO, RTC, power, reboot.

properties:
  compatible:
    oneOf:
      - description: T8152 SMC with read-only hardware monitoring.
        const: apple,t8152-smc
      - const: apple,t6050-smc
      - items:
          - enum:
              - apple,t6020-smc
              - apple,t6030-smc
              - apple,t6031-smc
              - apple,t6041-smc
              - apple,t8122-smc
              - apple,t8132-smc
              - apple,t8140-smc
              - apple,t8142-smc
          - const: apple,t8103-smc
      - items:
          - enum:
              # Do not add additional SoC to this list.
              - apple,t6000-smc
              - apple,t8103-smc
              - apple,t8112-smc
          - const: apple,smc

  reg:
    items:
      - description: SMC area
      - description: SRAM area

  reg-names:
    items:
      - const: smc
      - const: sram

  mboxes:
    maxItems: 1

  apple,sleep-wake-type:
    type: boolean
    description:
      The SMC firmware expects the wake type key (WKTP) set to its sleep value
      at the sleep commit, and cleared after a full wake. Left at the sleep
      value, the SMC treats the time awake as a power nap.

  apple,sleep-pmvc:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0x100
    maximum: 0x1ff
    description:
      The value written to the SMC's VDD_CIO rail key (pmVC) at the sleep
      commit, before the sleep notice. Bit 8 is set, and bit n keeps port n's
      CIO rail powered across the sleep. Which rails must stay up depends on
      what the SoC's sleep sequence powers on itself. Without the property
      pmVC is not written.

  apple,sleep-low-pins:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 4
    items:
      maximum: 0xff
    description:
      SMC GPIO numbers (the number in the GPIO's gPxx key) that are driven
      low before the SMC is told of a suspend-to-RAM and high again after the
      wake, for a supply that has to be off while the machine sleeps and that
      no driver switches at that point. On the J314s this is GPIO 26, the SD
      card reader's power enable.

  gpio:
    oneOf:
      - $ref: /schemas/gpio/apple,smc-gpio.yaml
      - $ref: /schemas/gpio/apple,smc-pcio-gpio.yaml

  gpio-low:
    $ref: /schemas/gpio/apple,smc-gpio.yaml

  reboot:
    $ref: /schemas/power/reset/apple,smc-reboot.yaml

  rtc:
    $ref: /schemas/rtc/apple,smc-rtc.yaml

  hwmon:
    $ref: /schemas/hwmon/apple,smc-hwmon.yaml

  apple,wake-reasons:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 64
    items:
      maximum: 63
    description: |
      The bits of the SMC's wake record that have a name on this board, as the
      ADT's smc-pmu node numbers them (event_name-bitN).

  apple,wake-reason-names:
    $ref: /schemas/types.yaml#/definitions/string-array
    minItems: 1
    maxItems: 64
    description: The names of the bits in apple,wake-reasons, in the same order.

additionalProperties: false

required:
  - compatible
  - reg
  - reg-names
  - mboxes

examples:
  - |
    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      smc@23e400000 {
        compatible = "apple,t8103-smc", "apple,smc";
        reg = <0x2 0x3e400000 0x0 0x4000>,
               <0x2 0x3fe00000 0x0 0x100000>;
        reg-names = "smc", "sram";
        mboxes = <&smc_mbox>;

        smc_gpio: gpio {
          compatible = "apple,smc-gpio";
          gpio-controller;
          #gpio-cells = <2>;
        };

        reboot {
          compatible = "apple,smc-reboot";
          nvmem-cells = <&shutdown_flag>, <&boot_stage>,
                        <&boot_error_count>, <&panic_count>;
          nvmem-cell-names = "shutdown_flag", "boot_stage",
                             "boot_error_count", "panic_count";
        };

        rtc {
          compatible = "apple,smc-rtc";
          nvmem-cells = <&rtc_offset>;
          nvmem-cell-names = "rtc_offset";
       };

        hwmon {
          compatible = "apple,smc-hwmon";

          current-ID0R {
            apple,key-id = "ID0R";
            label = "AC Input Current";
          };

          fan-F0Ac {
            apple,key-id = "F0Ac";
            apple,fan-minimum = "F0Mn";
            apple,fan-maximum = "F0Mx";
            apple,fan-target = "F0Tg";
            apple,fan-mode = "F0Md";
            label = "Fan 1";
          };

          power-PSTR {
            apple,key-id = "PSTR";
            label = "Total System Power";
          };

          temperature-TW0P {
            apple,key-id = "TW0P";
            label = "WiFi/BT Module Temperature";
          };

          voltage-VD0R {
            apple,key-id = "VD0R";
            label = "AC Input Voltage";
          };
        };
      };
    };
