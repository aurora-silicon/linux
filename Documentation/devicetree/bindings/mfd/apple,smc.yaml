%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/apple,smc.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Mac System Management Controller

maintainers:
  - Sven Peter <sven@kernel.org>

description:
  Apple Mac System Management Controller implements various functions
  such as GPIO, RTC, power, reboot.

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - apple,smc
              - apple,t6000-smc
              - apple,t6020-smc
              - apple,t6030-smc
              - apple,t6031-smc
              - apple,t6041-smc
              - apple,t8103-smc
              - apple,t8112-smc
              - apple,t8122-smc
              - apple,t8132-smc
              - apple,t8140-smc
              - apple,t8142-smc
              - apple,t8152-smc
      required:
        - compatible
    -
      properties:
        compatible:
          allOf:
            -
              contains:
                enum:
                  - apple,t8142-smc
            -
              contains:
                const: apple,smc
      required:
        - compatible
properties:
  compatible: true

  reg: true

  reg-names: true

  mboxes:
    maxItems: 1

  gpio:
    $ref: /schemas/gpio/apple,smc-gpio.yaml

  gpio-low:
    $ref: /schemas/gpio/apple,smc-gpio.yaml

  reboot:
    $ref: /schemas/power/reset/apple,smc-reboot.yaml

  rtc:
    $ref: /schemas/rtc/apple,smc-rtc.yaml

  hwmon:
    $ref: /schemas/hwmon/apple,smc-hwmon.yaml

# The root declares the union of property types for DTB decoding. The
# conditional variants below each retain their closed property contract.
additionalProperties: true

allOf:
  -
    if:
      anyOf:
        -
          properties:
            compatible:
              allOf:
                -
                  contains:
                    enum:
                      - apple,t8142-smc
                -
                  contains:
                    const: apple,smc
            status:
              const: disabled
          required:
            - compatible
            - status
          not:
            required:
              - mboxes
    then:
      oneOf:
        -
          type: object
          description: |
            Apple system management coprocessor. Initial resource description for an unsupported
            firmware/backend layout. Register, IRQ and DMA topology can be recorded before a driver
            exists. This form must stay disabled; it does not substitute for the enabled driver contract
            or supply firmware, calibration, programming sequences or unresolved providers.
          properties:
            compatible:
              items:
                -
                  enum:
                    - apple,t8142-smc
                -
                  const: apple,smc
            status:
              const: disabled
            reg:
              description: |
                Register apertures of the complete hardware complex, in hardware interface order.
              minItems: 3
              maxItems: 3
            interrupts:
              description: Interrupt lines wired to the system interrupt controller.
              minItems: 4
              maxItems: 4
          required:
            - compatible
            - reg
            - status
          additionalProperties: false
    else:
      $ref: "#/$defs/legacy-driver"

$defs:
  legacy-driver:
    type: object
    properties:
      compatible:
        oneOf:
          - description: T8152 SMC with read-only hardware monitoring.
            const: apple,t8152-smc
          - items:
              - enum:
                  - apple,t6020-smc
                  - apple,t6030-smc
                  - apple,t6031-smc
                  - apple,t6041-smc
                  - apple,t8122-smc
                  - apple,t8132-smc
                  - apple,t8140-smc
                  - apple,t8142-smc
              - const: apple,t8103-smc
          - items:
              - enum:
                  # Do not add additional SoC to this list.
                  - apple,t6000-smc
                  - apple,t8103-smc
                  - apple,t8112-smc
              - const: apple,smc

      reg:
        items:
          - description: SMC area
          - description: SRAM area

      reg-names:
        items:
          - const: smc
          - const: sram

      mboxes:
        maxItems: 1

      gpio:
        $ref: /schemas/gpio/apple,smc-gpio.yaml

      gpio-low:
        $ref: /schemas/gpio/apple,smc-gpio.yaml

      reboot:
        $ref: /schemas/power/reset/apple,smc-reboot.yaml

      rtc:
        $ref: /schemas/rtc/apple,smc-rtc.yaml

      hwmon:
        $ref: /schemas/hwmon/apple,smc-hwmon.yaml
    additionalProperties: false
    required:
      - compatible
      - reg
      - reg-names
      - mboxes

examples:
  - |
    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      smc@23e400000 {
        compatible = "apple,t8103-smc", "apple,smc";
        reg = <0x2 0x3e400000 0x0 0x4000>,
               <0x2 0x3fe00000 0x0 0x100000>;
        reg-names = "smc", "sram";
        mboxes = <&smc_mbox>;

        smc_gpio: gpio {
          compatible = "apple,smc-gpio";
          gpio-controller;
          #gpio-cells = <2>;
        };

        reboot {
          compatible = "apple,smc-reboot";
          nvmem-cells = <&shutdown_flag>, <&boot_stage>,
                        <&boot_error_count>, <&panic_count>;
          nvmem-cell-names = "shutdown_flag", "boot_stage",
                             "boot_error_count", "panic_count";
        };

        rtc {
          compatible = "apple,smc-rtc";
          nvmem-cells = <&rtc_offset>;
          nvmem-cell-names = "rtc_offset";
       };

        hwmon {
          compatible = "apple,smc-hwmon";

          current-ID0R {
            apple,key-id = "ID0R";
            label = "AC Input Current";
          };

          fan-F0Ac {
            apple,key-id = "F0Ac";
            apple,fan-minimum = "F0Mn";
            apple,fan-maximum = "F0Mx";
            apple,fan-target = "F0Tg";
            apple,fan-mode = "F0Md";
            label = "Fan 1";
          };

          power-PSTR {
            apple,key-id = "PSTR";
            label = "Total System Power";
          };

          temperature-TW0P {
            apple,key-id = "TW0P";
            label = "WiFi/BT Module Temperature";
          };

          voltage-VD0R {
            apple,key-id = "VD0R";
            label = "AC Input Voltage";
          };
        };
      };
    };
