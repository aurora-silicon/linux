%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/apple,xspmi-proxy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple external SPMI proxy follower

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  External SPMI proxy endpoint on the NUB SPMI bus. Firmware owns the
  proxy transport until a host driver establishes an access contract.

properties:
  compatible:
    items:
      - enum:
          - apple,t8140-xspmi-proxy
      - const: apple,xspmi-proxy

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false
