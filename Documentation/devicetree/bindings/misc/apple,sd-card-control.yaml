%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/apple,sd-card-control.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SD card sideband control

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Sideband control device on the SD reader control bus. The PCIe card
  reader is a separate device; this endpoint does not replace it.

properties:
  compatible:
    items:
      - enum:
          - apple,t6000-sd-card-control
          - apple,t6030-sd-card-control
          - apple,t6031-sd-card-control
          - apple,t6041-sd-card-control
      - const: apple,sd-card-control

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false
