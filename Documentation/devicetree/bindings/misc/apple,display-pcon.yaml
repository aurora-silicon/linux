%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/apple,display-pcon.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple display protocol converter control

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Display protocol converter control endpoint on the panel control bus.
  Firmware retains control of the display path at boot.

properties:
  compatible:
    items:
      - enum:
          - apple,t6041-display-pcon
          - apple,t8122-display-pcon
          - apple,t6030-display-pcon
          - apple,t6031-display-pcon
      - const: apple,display-pcon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false
