%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/apple,touchbar-driver.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Touch Bar I2C control interface

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  I2C control interface associated with the Touch Bar. Its register
  protocol and ownership handoff remain unqualified.

properties:
  compatible:
    items:
      - enum:
          - apple,t8103-touchbar-driver
      - const: apple,touchbar-driver

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false
