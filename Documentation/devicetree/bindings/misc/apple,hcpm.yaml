%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/apple,hcpm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple HCPM USB power control interface

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  I2C power control endpoint on the desktop port-management bus.
  Firmware personality, update data and power policy are runtime data.

properties:
  compatible:
    items:
      - enum:
          - apple,t8103-hcpm
      - const: apple,hcpm

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false
