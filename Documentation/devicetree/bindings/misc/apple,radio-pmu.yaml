%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/apple,radio-pmu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple radio power management follower

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  SPMI radio power-management follower. The firmware controls its power
  policy. With the apple,spmi-nvmem fallback the follower register space is
  also exported as a read-only NVMEM device for inspection.

select:
  properties:
    compatible:
      contains:
        const: apple,radio-pmu
  required:
    - compatible

properties:
  compatible:
    minItems: 2
    items:
      - enum:
          - apple,t6041-radio-pmu
          - apple,t6000-wifibt-pmu
          - apple,t6000-uwb-pmu
          - apple,t8112-wifibt-pmu
      - const: apple,radio-pmu
      - const: apple,spmi-nvmem

  reg:
    maxItems: 1

required:
  - compatible
  - reg

allOf:
  - $ref: /schemas/nvmem/nvmem.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: apple,spmi-nvmem
    then:
      required:
        - read-only

unevaluatedProperties: false
