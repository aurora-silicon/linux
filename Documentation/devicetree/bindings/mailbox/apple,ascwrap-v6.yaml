%YAML 1.2
---
$id: http://devicetree.org/schemas/mailbox/apple,ascwrap-v6.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8140 ASCWrap v6 mailbox

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description:
  Mailbox interface of the T8140 GPU coprocessors. The wrapper resource
  contains the coprocessor control registers and mailbox FIFOs. A separate
  resource provides the coprocessor vector-base register. The firmware role
  identifies which of the two GPU firmware instances uses the mailbox.

properties:
  compatible:
    const: apple,t8140-ascwrap-v6

  reg:
    items:
      - description: ASC wrapper registers
      - description: Coprocessor vector-base register

  reg-names:
    items:
      - const: wrapper
      - const: iop-vbar

  interrupts:
    items:
      - description: Send FIFO empty interrupt
      - description: Receive FIFO not-empty interrupt

  interrupt-names:
    items:
      - const: send-empty
      - const: recv-not-empty

  '#mbox-cells':
    const: 0

  power-domains:
    maxItems: 1

  apple,firmware-role:
    enum: [GFX, GFX1]

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - '#mbox-cells'
  - apple,firmware-role

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        mailbox@482600000 {
            compatible = "apple,t8140-ascwrap-v6";
            reg = <0x4 0x82600000 0x0 0x88000>,
                  <0x4 0x82050000 0x0 0x8>;
            reg-names = "wrapper", "iop-vbar";
            interrupts = <AIC_IRQ 993 IRQ_TYPE_LEVEL_HIGH>,
                         <AIC_IRQ 996 IRQ_TYPE_LEVEL_HIGH>;
            interrupt-names = "send-empty", "recv-not-empty";
            apple,firmware-role = "GFX";
            #mbox-cells = <0>;
        };
    };
