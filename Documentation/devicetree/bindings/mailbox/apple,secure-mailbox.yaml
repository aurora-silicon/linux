%YAML 1.2
---
$id: http://devicetree.org/schemas/mailbox/apple,secure-mailbox.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Apple secure processor mailbox proxy
maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>
select:
  properties:
    compatible:
      allOf:
        -
          contains:
            enum:
              - apple,t8142-secure-mailbox
              - apple,t8152-secure-mailbox
              - apple,t6050-secure-mailbox
        -
          contains:
            const: apple,secure-mailbox
  required:
    - compatible
description: |
  Apple secure processor mailbox proxy. Initial resource description for an unsupported firmware/backend
  layout. Register, IRQ and DMA topology can be recorded before a driver exists. This form must stay
  disabled; it does not substitute for the enabled driver contract or supply firmware, calibration,
  programming sequences or unresolved providers.
properties:
  compatible:
    items:
      -
        enum:
          - apple,t8142-secure-mailbox
          - apple,t8152-secure-mailbox
          - apple,t6050-secure-mailbox
      -
        const: apple,secure-mailbox
  status:
    const: disabled
  reg:
    description: Register apertures of the complete hardware complex, in hardware interface order.
    maxItems: 1
  interrupts:
    description: Interrupt lines wired to the system interrupt controller.
    minItems: 2
    maxItems: 3
  iommus:
    description: DMA translation streams emitted by this hardware.
    maxItems: 1
required:
  - compatible
  - reg
  - status
additionalProperties: false
