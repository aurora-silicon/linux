%YAML 1.2
---
$id: http://devicetree.org/schemas/chosen/apple,atc0-handoff.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple J714s ATC0 boot ownership handoff group

maintainers:
  - Dj <hey@djdev.me>

description: |
  The J714s left-back USB-C port is also the boot producer's debug port.
  Its devices start disabled. A producer may enable this complete group only
  after relinquishing USB/debug ownership, proving no DMA was retained, and
  supplying the current machine's PHY tunables. Shared providers are excluded.
  An older producer leaves the group disabled. Linux does not activate it.

select:
  properties:
    $nodename:
      const: chosen
  required:
    - $nodename
    - apple,atc0-handoff

properties:
  $nodename:
    const: chosen

  apple,atc0-handoff:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    minItems: 1
    maxItems: 32
    items:
      maxItems: 1
    description: |
      ATC0-only power domains, PHY and mailbox, USB DARTs and DRD, port
      controller, router and mailbox/NHI/DART, PCIe tunnel parent/DART/root
      controller, and display crossbar. Every member must be disabled until
      handoff. Do not include the shared AOP GPIO, AUSS or CIO reset providers.

additionalProperties: true
