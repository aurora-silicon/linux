%YAML 1.2
---
$id: http://devicetree.org/schemas/chosen/linux-enablement-mac,disk-boot.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8132 disk-boot /chosen flag

maintainers:
  - Diljit Singh <hey@djdev.me>

description:
  Boolean flag in /chosen carried by Apple T8132 board device trees to
  indicate that the board tree targets normal disk-boot hand-off from
  the bootloader.

select:
  properties:
    $nodename:
      const: chosen
  required:
    - $nodename

properties:
  $nodename:
    const: chosen

  linux-enablement-mac,disk-boot:
    type: boolean
    description:
      Indicates that the board device tree targets disk-boot hand-off
      on Apple T8132 systems.

additionalProperties: true
...
