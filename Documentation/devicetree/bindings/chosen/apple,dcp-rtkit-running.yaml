%YAML 1.2
---
$id: http://devicetree.org/schemas/chosen/apple,dcp-rtkit-running.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple DCP RTKit state at the loader hand-off

maintainers:
  - Thomas Glanzmann <thomas@glanzmann.de>

description:
  The loader records whether the internal display coprocessor's RTKit was
  running when it handed over to the kernel, or whether the loader quiesced
  it after a failed display setup. The loader omits this property when it
  never started the coprocessor.

select:
  properties:
    $nodename:
      const: chosen
  required:
    - $nodename

properties:
  $nodename:
    const: chosen

  apple,dcp-rtkit-running:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    description:
      One if the internal DCP's RTKit was running at the hand-off, zero if
      the loader quiesced it.

additionalProperties: true
...
