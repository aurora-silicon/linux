%YAML 1.2
---
$id: http://devicetree.org/schemas/chosen/apple,dcp-rtkit-quiesced.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple DCP RTKit loader hand-off

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description:
  The loader records whether it handed a running display coprocessor to
  the kernel. It omits this property on a chainload.

select:
  properties:
    $nodename:
      const: chosen
  required:
    - $nodename

properties:
  $nodename:
    const: chosen

  apple,dcp-rtkit-quiesced:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    description:
      One if the DCP core was running at hand-off, zero if it was not.
      The name reflects the loader's RTKit hand-off state, not a request
      for Linux to quiesce the coprocessor.

additionalProperties: true
...
