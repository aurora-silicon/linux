%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/apple,wdt.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SoC Watchdog

maintainers:
  - Sven Peter <sven@svenpeter.dev>

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - apple,s5l8960x-wdt
              - apple,s8000-wdt
              - apple,t6000-wdt
              - apple,t6020-wdt
              - apple,t6030-wdt
              - apple,t6031-wdt
              - apple,t6041-wdt
              - apple,t6050-wdt
              - apple,t7000-wdt
              - apple,t8010-wdt
              - apple,t8015-wdt
              - apple,t8103-wdt
              - apple,t8112-wdt
              - apple,t8122-wdt
              - apple,t8132-wdt
              - apple,t8140-wdt
              - apple,wdt
      required:
        - compatible
    -
      properties:
        compatible:
          allOf:
            -
              contains:
                enum:
                  - apple,t8142-wdt
                  - apple,t8152-wdt
            -
              contains:
                const: apple,wdt
      required:
        - compatible
properties:
  compatible: true

  reg: true

  clocks: true

  interrupts: true

# The root declares the union of property types for DTB decoding. The
# conditional variants below each retain their closed property contract.
additionalProperties: true

allOf:
  -
    if:
      anyOf:
        -
          properties:
            compatible:
              allOf:
                -
                  contains:
                    enum:
                      - apple,t8142-wdt
                      - apple,t8152-wdt
                -
                  contains:
                    const: apple,wdt
            status:
              const: disabled
          required:
            - compatible
            - status
          not:
            required:
              - mboxes
    then:
      oneOf:
        -
          type: object
          description: |
            Apple watchdog and reset register complex. Initial resource description for an unsupported
            firmware/backend layout. Register, IRQ and DMA topology can be recorded before a driver
            exists. This form must stay disabled; it does not substitute for the enabled driver contract
            or supply firmware, calibration, programming sequences or unresolved providers.
          properties:
            compatible:
              items:
                -
                  enum:
                    - apple,t8142-wdt
                    - apple,t8152-wdt
                -
                  const: apple,wdt
            status:
              const: disabled
            reg:
              description: |
                Register apertures of the complete hardware complex, in hardware interface order.
              minItems: 5
              maxItems: 5
            interrupts:
              description: Interrupt lines wired to the system interrupt controller.
              minItems: 2
              maxItems: 2
            power-domains:
              description: Physical power and combined clock-gate dependencies.
              minItems: 1
              maxItems: 8
          required:
            - compatible
            - reg
            - status
          additionalProperties: false
    else:
      $ref: "#/$defs/legacy-driver"

$defs:
  legacy-driver:
    type: object
    allOf:
      - $ref: watchdog.yaml#
    properties:
      compatible:
        oneOf:
          - items:
              - enum:
                  - apple,t6020-wdt
                  - apple,t6030-wdt
                  - apple,t6031-wdt
                  - apple,t6041-wdt
                  - apple,t6050-wdt
                  - apple,t8122-wdt
                  - apple,t8132-wdt
                  - apple,t8140-wdt
              - const: apple,t8103-wdt
          - items:
              - enum:
                  # Do not add additional SoC to this list.
                  - apple,s5l8960x-wdt
                  - apple,t7000-wdt
                  - apple,s8000-wdt
                  - apple,t8010-wdt
                  - apple,t8015-wdt
                  - apple,t8103-wdt
                  - apple,t8112-wdt
                  - apple,t6000-wdt
              - const: apple,wdt

      reg:
        maxItems: 1

      clocks:
        maxItems: 1

      interrupts:
        maxItems: 1
    required:
      - compatible
      - reg
      - clocks
      - interrupts
    unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    wdt: watchdog@50000000 {
        compatible = "apple,t8103-wdt", "apple,wdt";
        reg = <0x50000000 0x4000>;
        clocks = <&clk>;
        interrupts = <AIC_IRQ 123 IRQ_TYPE_LEVEL_HIGH>;
    };

...
