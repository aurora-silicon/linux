%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/apple,wdt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SoC Watchdog

maintainers:
  - Sven Peter <sven@svenpeter.dev>

allOf:
  - $ref: watchdog.yaml#
  - if:
      properties:
        reg:
          minItems: 2
      required:
        - reg
    then:
      required:
        - reg-names

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - apple,t6020-wdt
              - apple,t6030-wdt
              - apple,t6031-wdt
              - apple,t6041-wdt
              - apple,t6050-wdt
              - apple,t8122-wdt
              - apple,t8132-wdt
              - apple,t8140-wdt
              - apple,t8142-wdt
              - apple,t8152-wdt
          - const: apple,t8103-wdt
      - items:
          - enum:
              # Do not add additional SoC to this list.
              - apple,s5l8960x-wdt
              - apple,t7000-wdt
              - apple,s8000-wdt
              - apple,t8010-wdt
              - apple,t8015-wdt
              - apple,t8103-wdt
              - apple,t8112-wdt
              - apple,t6000-wdt
          - const: apple,wdt

  reg:
    minItems: 1
    items:
      - description: Watchdog timer registers
      - description: Simple-reconfig routing register

  reg-names:
    minItems: 1
    items:
      - const: wdt
      - const: reconfig

  clocks:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks
  - interrupts

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    wdt: watchdog@50000000 {
        compatible = "apple,t8103-wdt", "apple,wdt";
        reg = <0x50000000 0x4000>;
        clocks = <&clk>;
        interrupts = <AIC_IRQ 123 IRQ_TYPE_LEVEL_HIGH>;
    };
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    watchdog@8836c000 {
        compatible = "apple,t6050-wdt", "apple,t8103-wdt";
        reg = <0x8836c000 0x4000>,
              <0x8833002c 0x4>;
        reg-names = "wdt", "reconfig";
        clocks = <&clk>;
        interrupts = <AIC_IRQ 0 721 IRQ_TYPE_LEVEL_HIGH>;
    };

...
