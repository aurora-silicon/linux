%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/apple,secure-watchdog.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple secure hibernation watchdog aperture

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Secure hibernation watchdog register aperture, owned by firmware at boot.

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,t8142-secure-watchdog
          - const: apple,secure-watchdog
      - items:
          - const: apple,t8140-secure-watchdog
          - const: apple,secure-watchdog

  reg:
    maxItems: 1
    description: Register apertures in hardware-description order.

required:
  - compatible
  - reg

additionalProperties: false
