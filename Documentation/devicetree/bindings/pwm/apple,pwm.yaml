%YAML 1.2
---
$id: http://devicetree.org/schemas/pwm/apple,pwm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple timer PWM controller

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  The timer PWM controller is distinct from the FPWM keyboard-backlight
  controller. It has one register aperture, one interrupt and a PMGR gate.
  On T6000 the plain-PWM view shares its register bank with FPWM0,
  but has a distinct gate and interrupt. Ownership must be coordinated
  before either interface is used alongside the other.

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - apple,t8103-pwm
          - const: apple,pwm
      - items:
          - const: apple,t6000-pwm
          - const: apple,pwm

  reg:
    minItems: 1
    maxItems: 1

  interrupts:
    minItems: 1
    maxItems: 1

  power-domains:
    minItems: 1
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - power-domains

additionalProperties: false
