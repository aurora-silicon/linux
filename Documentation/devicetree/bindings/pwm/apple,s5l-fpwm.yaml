%YAML 1.2
---
$id: http://devicetree.org/schemas/pwm/apple,s5l-fpwm.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple FPWM controller

maintainers:
  - asahi@lists.linux.dev
  - Sasha Finkelstein <k@chaosmail.tech>

description: PWM controller used for keyboard backlight on ARM Macs

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - "apple,s5l-fpwm"
              - "apple,t6000-fpwm"
              - "apple,t6020-fpwm"
              - "apple,t6030-fpwm"
              - "apple,t6031-fpwm"
              - "apple,t6041-fpwm"
              - "apple,t8103-fpwm"
              - "apple,t8112-fpwm"
              - "apple,t8122-fpwm"
              - "apple,t8132-fpwm"
              - "apple,t8140-fpwm"
              - "apple,t8142-fpwm"
      required:
        - "compatible"
    -
      properties:
        compatible:
          items:
            -
              const: "apple,t6050-fpwm"
            -
              const: "apple,s5l-fpwm"
      required:
        - "compatible"

properties:
  compatible: true
  reg: true
  clocks: true
  power-domains: true
  "#pwm-cells": true
  interrupts: true
  iommus: true
  resets: true
  status: true

additionalProperties: true

allOf:
  - if:
      anyOf:
        -
          properties:
            compatible:
              items:
                -
                  const: "apple,t6050-fpwm"
                -
                  const: "apple,s5l-fpwm"
            status:
              const: "disabled"
          required:
            - "compatible"
            - "status"
    then:
      oneOf:
        -
          description: "T6050 native resource description. Firmware ownership, backend support and enables require separate qualification. This variant remains disabled and contains no programming sequences or firmware data."
          properties:
            compatible:
              items:
                -
                  const: "apple,t6050-fpwm"
                -
                  const: "apple,s5l-fpwm"
            status:
              const: "disabled"
            reg:
              maxItems: 1
              description: "Native register apertures in hardware-interface order, including shared auxiliary views."
            interrupts:
              maxItems: 1
            power-domains:
              maxItems: 1
            "#pwm-cells":
              const: 2
          required:
            - "compatible"
            - "reg"
            - "status"
            - "interrupts"
            - "power-domains"
            - "#pwm-cells"
          additionalProperties: false
    else:
      properties:
        compatible:
          items:
            - enum:
                - apple,t8103-fpwm
                - apple,t8112-fpwm
                - apple,t8122-fpwm
                - apple,t8142-fpwm
                - apple,t8132-fpwm
                - apple,t8140-fpwm
                - apple,t6000-fpwm
                - apple,t6020-fpwm
                - apple,t6030-fpwm
                - apple,t6031-fpwm
                - apple,t6041-fpwm
            - const: apple,s5l-fpwm

        reg:
          maxItems: 1

        clocks:
          maxItems: 1

        power-domains:
          maxItems: 1

        "#pwm-cells":
          const: 2
      required:
        - compatible
        - reg
        - clocks
      additionalProperties: false

examples:
  - |
    pwm@235044000 {
      compatible = "apple,t8103-fpwm", "apple,s5l-fpwm";
      reg = <0x35044000 0x4000>;
      power-domains = <&ps_fpwm1>;
      clocks = <&clkref>;
      #pwm-cells = <2>;
    };
