# SPDX-License-Identifier: GPL-2.0-only OR BSD-2-Clause
%YAML 1.2
---
$id: http://devicetree.org/schemas/pwm/apple,s5l-fpwm.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple FPWM controller

maintainers:
  - asahi@lists.linux.dev
  - Sasha Finkelstein <k@chaosmail.tech>

description: PWM controller used for keyboard backlight on ARM Macs

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - apple,s5l-fpwm
              - apple,t6000-fpwm
              - apple,t6020-fpwm
              - apple,t6030-fpwm
              - apple,t6031-fpwm
              - apple,t6041-fpwm
              - apple,t6050-fpwm
              - apple,t8103-fpwm
              - apple,t8112-fpwm
              - apple,t8122-fpwm
              - apple,t8132-fpwm
              - apple,t8142-fpwm
      required:
        - compatible
    -
      properties:
        compatible:
          allOf:
            -
              contains:
                enum:
                  - apple,t8142-fpwm
                  - apple,t8152-fpwm
            -
              contains:
                const: apple,s5l-fpwm
      required:
        - compatible
properties:
  compatible: true

  reg: true

  clocks: true

  power-domains: true

  "#pwm-cells":
    const: 2

# The root declares the union of property types for DTB decoding. The
# conditional variants below each retain their closed property contract.
additionalProperties: true

allOf:
  -
    if:
      anyOf:
        -
          properties:
            compatible:
              allOf:
                -
                  contains:
                    enum:
                      - apple,t8142-fpwm
                      - apple,t8152-fpwm
                -
                  contains:
                    const: apple,s5l-fpwm
            status:
              const: disabled
          required:
            - compatible
            - status
          not:
            required:
              - mboxes
    then:
      oneOf:
        -
          type: object
          description: |
            Apple fixed-frequency pwm controller. Initial resource description for an unsupported
            firmware/backend layout. Register, IRQ and DMA topology can be recorded before a driver
            exists. This form must stay disabled; it does not substitute for the enabled driver contract
            or supply firmware, calibration, programming sequences or unresolved providers.
          properties:
            compatible:
              items:
                -
                  enum:
                    - apple,t8142-fpwm
                    - apple,t8152-fpwm
                -
                  const: apple,s5l-fpwm
            status:
              const: disabled
            reg:
              description: |
                Register apertures of the complete hardware complex, in hardware interface order.
              maxItems: 1
            interrupts:
              description: Interrupt lines wired to the system interrupt controller.
              maxItems: 1
            power-domains:
              description: Physical power and combined clock-gate dependencies.
              minItems: 1
              maxItems: 8
            "#pwm-cells":
              const: 2
            clocks:
              maxItems: 1
          required:
            - compatible
            - reg
            - status
            - "#pwm-cells"
          additionalProperties: false
    else:
      $ref: "#/$defs/legacy-driver"

$defs:
  legacy-driver:
    type: object
    properties:
      compatible:
        items:
          - enum:
              - apple,t8103-fpwm
              - apple,t8112-fpwm
              - apple,t8122-fpwm
              - apple,t8142-fpwm
              - apple,t8132-fpwm
              - apple,t6000-fpwm
              - apple,t6020-fpwm
              - apple,t6030-fpwm
              - apple,t6031-fpwm
              - apple,t6041-fpwm
              - apple,t6050-fpwm
          - const: apple,s5l-fpwm

      reg:
        maxItems: 1

      clocks:
        maxItems: 1

      power-domains:
        maxItems: 1

      "#pwm-cells":
        const: 2
    required:
      - compatible
      - reg
      - clocks
    additionalProperties: false

examples:
  - |
    pwm@235044000 {
      compatible = "apple,t8103-fpwm", "apple,s5l-fpwm";
      reg = <0x35044000 0x4000>;
      power-domains = <&ps_fpwm1>;
      clocks = <&clkref>;
      #pwm-cells = <2>;
    };
