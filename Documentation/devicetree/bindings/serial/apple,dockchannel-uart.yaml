%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/apple,dockchannel-uart.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple DockChannel UART

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  Apple SoCs provide UART-compatible byte streams over DockChannel. Each
  channel uses separate data and FIFO-configuration windows and shares an
  interrupt-controller window with the other DockChannel functions.

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - "apple,channel"
              - "apple,dockchannel-uart"
              - "apple,sw-drain"
              - "apple,t6020-dockchannel-uart"
              - "apple,t6021-dockchannel-uart"
              - "apple,t6022-dockchannel-uart"
              - "apple,t8112-dockchannel-uart"
      required:
        - "compatible"
    -
      properties:
        compatible:
          items:
            -
              const: "apple,t6050-dockchannel-uart"
            -
              const: "apple,dockchannel-uart"
      required:
        - "compatible"

properties:
  compatible: true
  reg: true
  reg-names: true
  interrupts: true
  apple,channel:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 15
    default: 0
    description:
      Index of this channel within its DockChannel block. Channel n owns
      bits 2n (TX) and 2n + 1 (RX) of the shared interrupt mask and flag
      registers.
  apple,sw-drain:
    type: boolean
    description:
      The channel does not raise an interrupt when data arrives, and its RX
      FIFO is drained in software instead. This mirrors the enable-sw-drain
      property of the channel's Apple device tree node. The interrupt, if
      described, is not used.
  iommus: true
  power-domains: true
  clocks: true
  resets: true
  status: true

additionalProperties: true

allOf:
  - if:
      anyOf:
        -
          properties:
            compatible:
              items:
                -
                  const: "apple,t6050-dockchannel-uart"
                -
                  const: "apple,dockchannel-uart"
            status:
              const: "disabled"
          required:
            - "compatible"
            - "status"
    then:
      oneOf:
        -
          description: "T6050 native resource description. Firmware ownership, backend support and enables require separate qualification. This variant remains disabled and contains no programming sequences or firmware data."
          properties:
            compatible:
              items:
                -
                  const: "apple,t6050-dockchannel-uart"
                -
                  const: "apple,dockchannel-uart"
            status:
              const: "disabled"
            reg:
              minItems: 2
              maxItems: 2
              description: "Native register apertures in hardware-interface order, including shared auxiliary views."
            interrupts:
              maxItems: 1
          required:
            - "compatible"
            - "reg"
            - "status"
            - "interrupts"
          additionalProperties: false
    else:
      allOf:
        - $ref: serial.yaml#
      properties:
        compatible:
          oneOf:
            - const: apple,dockchannel-uart
            - items:
                - enum:
                    - apple,t8112-dockchannel-uart
                    - apple,t6020-dockchannel-uart
                    - apple,t6021-dockchannel-uart
                    - apple,t6022-dockchannel-uart
                - const: apple,dockchannel-uart

        reg:
          items:
            - description: Channel data registers
            - description: Channel FIFO configuration registers
            - description: DockChannel interrupt registers

        reg-names:
          items:
            - const: data
            - const: config
            - const: irq

        interrupts:
          maxItems: 1

        apple,channel:
          $ref: /schemas/types.yaml#/definitions/uint32
          minimum: 0
          maximum: 15
          default: 0
          description:
            Index of this channel within its DockChannel block. Channel n owns
            bits 2n (TX) and 2n + 1 (RX) of the shared interrupt mask and flag
            registers.

        apple,sw-drain:
          type: boolean
          description:
            The channel does not raise an interrupt when data arrives, and its RX
            FIFO is drained in software instead. This mirrors the enable-sw-drain
            property of the channel's Apple device tree node. The interrupt, if
            described, is not used.
      required:
        - compatible
        - reg
        - reg-names
      if:
        not:
          required:
            - apple,sw-drain
      then:
        required:
          - interrupts
      unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        serial@30812c000 {
            compatible = "apple,dockchannel-uart";
            reg = <0x3 0x0812c000 0x0 0x4000>,
                  <0x3 0x08128000 0x0 0x4000>,
                  <0x3 0x0810c000 0x0 0x4000>;
            reg-names = "data", "config", "irq";
            interrupts = <AIC_IRQ 470 IRQ_TYPE_LEVEL_HIGH>;
        };
    };

...
