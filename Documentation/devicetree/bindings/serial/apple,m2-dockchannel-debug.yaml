%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/apple,m2-dockchannel-debug.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M2 generation debug DockChannel

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Debug DockChannel resources on M2 generation SoCs. The register apertures
  follow hardware resource order. Firmware configuration and tuning are
  supplied by the bootloader and are not part of this binding. Unqualified
  instances must remain disabled.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6020-dockchannel-debug
          - apple,t6021-dockchannel-debug
          - apple,t6022-dockchannel-debug
          - apple,t8112-dockchannel-debug
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t6020-dockchannel-debug
          - apple,t6021-dockchannel-debug
          - apple,t6022-dockchannel-debug
          - apple,t8112-dockchannel-debug
      - const: apple,dockchannel-debug

  reg:
    maxItems: 2

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false
