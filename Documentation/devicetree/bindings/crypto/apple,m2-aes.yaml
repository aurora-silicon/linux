%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/apple,m2-aes.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M2 generation AES engine

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  AES engine resources on M2 generation SoCs. The register apertures
  follow hardware resource order. Firmware configuration and tuning are
  supplied by the bootloader and are not part of this binding. Unqualified
  instances must remain disabled.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6020-aes
          - apple,t6021-aes
          - apple,t6022-aes
          - apple,t8112-aes
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t6020-aes
          - apple,t6021-aes
          - apple,t6022-aes
          - apple,t8112-aes
      - const: apple,aes

  reg:
    maxItems: 2

  interrupts:
    maxItems: 1

  iommus:
    maxItems: 1

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - iommus
  - power-domains

additionalProperties: false
