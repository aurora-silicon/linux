%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/apple,aes-s8000.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple S8000-family SIO AES engine

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  An AP-programmed AES engine behind the SIO DART, independent of the SIO
  coprocessor firmware. T6000 and T8112 have revision 3 hardware with two
  register apertures. T6041 and T8140 have revision 5 hardware with an
  additional DKEY-distribution aperture. Key-disable register layouts differ
  between SoCs and are selected by the SoC-specific compatible, including
  between the two revision 5 implementations.

  The key-disable aperture contains hardware-key lifecycle state, not key
  material. Diagnostic software must never write it. The DKEY aperture is
  described for completeness and is not needed for read-only diagnostics.

properties:
  compatible:
    items:
      - enum:
          - apple,t6000-aes
          - apple,t8112-aes
          - apple,t6041-aes
          - apple,t8140-aes
      - const: apple,aes-s8000

  reg:
    minItems: 2
    maxItems: 3

  reg-names:
    minItems: 2
    items:
      - const: engine
      - const: key-disable
      - const: dkey

  interrupts:
    maxItems: 1

  power-domains:
    maxItems: 1

  iommus:
    minItems: 1
    maxItems: 2
    description: SIO DART stream 1; T6000 uses both SIO DART instances.

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - apple,t6000-aes
              - apple,t8112-aes
    then:
      properties:
        reg:
          maxItems: 2
        reg-names:
          maxItems: 2
    else:
      properties:
        reg:
          minItems: 3
        reg-names:
          minItems: 3
  - if:
      properties:
        compatible:
          contains:
            const: apple,t6000-aes
    then:
      properties:
        iommus:
          minItems: 2
    else:
      properties:
        iommus:
          maxItems: 1

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - power-domains
  - iommus

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        crypto@23500c000 {
            compatible = "apple,t8112-aes", "apple,aes-s8000";
            reg = <0x2 0x3500c000 0x0 0x4000>,
                  <0x2 0x3d2dc000 0x0 0x8000>;
            reg-names = "engine", "key-disable";
            interrupt-parent = <&aic>;
            interrupts = <AIC_IRQ 759 IRQ_TYPE_LEVEL_HIGH>;
            power-domains = <&ps_aes>;
            iommus = <&sio_dart 1>;
            status = "disabled";
        };
    };
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        crypto@38500c000 {
            compatible = "apple,t8140-aes", "apple,aes-s8000";
            reg = <0x3 0x8500c000 0x0 0x4000>,
                  <0x3 0x082dc000 0x0 0x8000>,
                  <0x3 0x08078000 0x0 0x4000>;
            reg-names = "engine", "key-disable", "dkey";
            interrupt-parent = <&aic>;
            interrupts = <AIC_IRQ 1107 IRQ_TYPE_LEVEL_HIGH>;
            power-domains = <&ps_aes>;
            iommus = <&sio_dart 1>;
            status = "disabled";
        };
    };
