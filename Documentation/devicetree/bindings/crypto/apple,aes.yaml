%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/apple,aes.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple AES engine

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  AES hardware attached to the SIO DART. The register banks are the
  engine and shared control windows, with a third auxiliary window on
  newer variants. T6000 uses both SIO translation banks for the same stream.

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,t6041-aes
          - const: apple,aes
      - items:
          - const: apple,t8140-aes
          - const: apple,aes
      - items:
          - const: apple,t8103-aes
          - const: apple,aes
      - items:
          - const: apple,t6000-aes
          - const: apple,aes

  reg:
    minItems: 2
    maxItems: 3

  interrupts:
    maxItems: 1

  power-domains:
    maxItems: 1

  iommus:
    minItems: 1
    maxItems: 2

required:
  - compatible
  - reg
  - interrupts
  - power-domains
  - iommus

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum: ["apple,t8103-aes", "apple,t6000-aes"]
    then:
      properties:
        reg:
          maxItems: 2
    else:
      properties:
        reg:
          minItems: 3
  - if:
      properties:
        compatible:
          contains:
            const: apple,t6000-aes
    then:
      properties:
        iommus:
          minItems: 2
    else:
      properties:
        iommus:
          maxItems: 1

additionalProperties: false
