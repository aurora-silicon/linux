%YAML 1.2
---
$id: "http://devicetree.org/schemas/crypto/apple,aes.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"
title: "Apple aes cryptographic accelerator"
maintainers:
  - "Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>"
select:
  properties:
    compatible:
      allOf:
        -
          contains:
            enum:
              - "apple,t8142-aes"
              - "apple,t8152-aes"
              - "apple,t6050-aes"
        -
          contains:
            const: "apple,aes"
  required:
    - "compatible"
description: "Apple aes cryptographic accelerator. Initial resource description for an unsupported firmware/backend layout. Register, IRQ and DMA topology can be recorded before a driver exists. This form must stay disabled; it does not substitute for the enabled driver contract or supply firmware, calibration, programming sequences or unresolved providers."
properties:
  compatible:
    items:
      -
        enum:
          - "apple,t8142-aes"
          - "apple,t8152-aes"
          - "apple,t6050-aes"
      -
        const: "apple,aes"
  status:
    const: "disabled"
  reg:
    description: "Register apertures of the complete hardware complex, in hardware interface order."
    minItems: 3
    maxItems: 3
  interrupts:
    description: "Interrupt lines wired to the system interrupt controller."
    maxItems: 1
  iommus:
    description: "DMA translation streams emitted by this hardware."
    maxItems: 1
  power-domains:
    description: "Power and combined clock gates required by this hardware."
    maxItems: 1
required:
  - "compatible"
  - "reg"
  - "status"
additionalProperties: false
