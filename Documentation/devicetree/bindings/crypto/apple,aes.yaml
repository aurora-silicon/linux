%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/apple,aes.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple AES engine

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  AES hardware attached to the SIO DART. The register banks are the
  engine, shared control and auxiliary control windows, in that order.

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,t6041-aes
          - const: apple,aes
      - items:
          - const: apple,t8140-aes
          - const: apple,aes
      - items:
          - enum:
              - apple,t6020-aes
              - apple,t6021-aes
              - apple,t6022-aes
              - apple,t6030-aes
              - apple,t6031-aes
              - apple,t8112-aes
              - apple,t8122-aes
          - const: apple,aes

  reg:
    minItems: 2
    maxItems: 3
    description: Engine and control banks, with an auxiliary bank on later variants.

  interrupts:
    maxItems: 1

  power-domains:
    maxItems: 1

  iommus:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - power-domains
  - iommus

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - apple,t6020-aes
              - apple,t6021-aes
              - apple,t6022-aes
              - apple,t6030-aes
              - apple,t6031-aes
              - apple,t8112-aes
              - apple,t8122-aes
    then:
      properties:
        reg:
          minItems: 2
          maxItems: 2
    else:
      properties:
        reg:
          minItems: 3
          maxItems: 3

additionalProperties: false
