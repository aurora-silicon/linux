%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/apple,m3-aes.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M3 family AES accelerator

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the M3 family AES accelerator.
  The interface is described for discovery and must remain disabled until
  its ownership, initialization and shutdown are supported. Register windows
  are listed in hardware resource order; firmware configuration and tuning
  data are supplied by the boot firmware rather than this binding.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t8122-aes
          - apple,t6030-aes
          - apple,t6031-aes
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t8122-aes
          - apple,t6030-aes
          - apple,t6031-aes
      - const: apple,aes

  reg:
    minItems: 2
    maxItems: 2

  interrupts:
    minItems: 1
    maxItems: 1

  power-domains:
    minItems: 1
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - power-domains

additionalProperties: false
