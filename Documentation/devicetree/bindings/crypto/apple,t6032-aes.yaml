%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/apple,t6032-aes.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T6032 AES accelerator

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the T6032 AES accelerator. The package contains two
  peripheral dies. Register banks follow hardware resource order. The block
  remains disabled until its ownership and lifecycle are supported; firmware
  data and tuning are supplied separately by the boot firmware.

select:
  properties:
    compatible:
      contains:
        const: apple,t6032-aes
  required:
    - compatible

properties:
  compatible:
    items:
      - const: apple,t6032-aes
      - const: apple,aes

  reg:
    minItems: 2
    maxItems: 2

  interrupts:
    minItems: 1
    maxItems: 1

  power-domains:
    minItems: 1
    maxItems: 1

  iommus:
    minItems: 1
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - power-domains
  - iommus

additionalProperties: false
