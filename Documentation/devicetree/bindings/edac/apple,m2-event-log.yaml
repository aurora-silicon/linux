%YAML 1.2
---
$id: http://devicetree.org/schemas/edac/apple,m2-event-log.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M2 generation platform event interrupt collector

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Platform event interrupt collector resources on M2 generation SoCs. The register apertures
  follow hardware resource order. Firmware configuration and tuning are
  supplied by the bootloader and are not part of this binding. Unqualified
  instances must remain disabled.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6020-event-log
          - apple,t6021-event-log
          - apple,t6022-event-log
          - apple,t8112-event-log
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t6020-event-log
          - apple,t6021-event-log
          - apple,t6022-event-log
          - apple,t8112-event-log
      - const: apple,event-log

  reg:
    minItems: 16
    maxItems: 86

  interrupts:
    minItems: 16
    maxItems: 56

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false
