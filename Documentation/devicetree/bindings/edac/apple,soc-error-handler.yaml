%YAML 1.2
---
$id: http://devicetree.org/schemas/edac/apple,soc-error-handler.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SoC platform error and event log interrupt handlers

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Apple SoCs route memory-controller, SRAM, power-management and fabric
  errors to dedicated platform interrupt groups. A second group reports
  fatal events latched by peripheral event logs.

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - apple,t8103-error-handler
              - apple,t6000-error-handler
              - apple,t6001-error-handler
              - apple,t6002-error-handler
          - const: apple,soc-error-handler
      - items:
          - enum:
              - apple,t8103-event-log
              - apple,t6000-event-log
              - apple,t6001-event-log
              - apple,t6002-event-log
          - const: apple,soc-event-log
      - items:
          - const: apple,t6041-error-handler
          - const: apple,soc-error-handler
      - items:
          - const: apple,t8140-error-handler
          - const: apple,soc-error-handler
      - items:
          - const: apple,t6041-event-log
          - const: apple,soc-event-log
      - items:
          - const: apple,t8140-event-log
          - const: apple,soc-event-log

  interrupts:
    minItems: 9
    maxItems: 268

  reg:
    minItems: 10
    maxItems: 205
    description: |
      Per-source status and event-log register apertures. These views may
      overlap controller resources; their description does not establish
      safe AP ownership. Instances remain disabled until qualified.

required:
  - compatible
  - interrupts

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: apple,t6041-error-handler
    then:
      properties:
        interrupts:
          minItems: 89
          maxItems: 89
        reg:
          minItems: 25
          maxItems: 25
      required:
        - reg
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8140-error-handler
    then:
      properties:
        interrupts:
          minItems: 26
          maxItems: 26
        reg:
          minItems: 17
          maxItems: 17
  - if:
      properties:
        compatible:
          contains:
            const: apple,t6041-event-log
    then:
      properties:
        interrupts:
          minItems: 21
          maxItems: 21
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8140-event-log
    then:
      properties:
        interrupts:
          minItems: 9
          maxItems: 9
        reg:
          minItems: 10
          maxItems: 10

  - if:
      properties:
        compatible:
          contains:
            const: apple,t8103-error-handler
    then:
      properties:
        interrupts:
          minItems: 11
          maxItems: 11
        reg:
          minItems: 18
          maxItems: 18
      required:
        - reg

  - if:
      properties:
        compatible:
          contains:
            const: apple,t8103-event-log
    then:
      properties:
        interrupts:
          minItems: 16
          maxItems: 16
        reg:
          minItems: 16
          maxItems: 16
      required:
        - reg

  - if:
      properties:
        compatible:
          contains:
            const: apple,t6000-error-handler
    then:
      properties:
        interrupts:
          minItems: 76
          maxItems: 76
        reg:
          minItems: 55
          maxItems: 55
      required:
        - reg

  - if:
      properties:
        compatible:
          contains:
            const: apple,t6000-event-log
    then:
      properties:
        interrupts:
          minItems: 28
          maxItems: 28
        reg:
          minItems: 28
          maxItems: 28
      required:
        - reg

  - if:
      properties:
        compatible:
          contains:
            const: apple,t6001-error-handler
    then:
      properties:
        interrupts:
          minItems: 127
          maxItems: 127
        reg:
          minItems: 90
          maxItems: 90
      required:
        - reg

  - if:
      properties:
        compatible:
          contains:
            const: apple,t6001-event-log
    then:
      properties:
        interrupts:
          minItems: 28
          maxItems: 28
        reg:
          minItems: 28
          maxItems: 28
      required:
        - reg

  - if:
      properties:
        compatible:
          contains:
            const: apple,t6002-error-handler
    then:
      oneOf:
        - properties:
            interrupts:
              minItems: 138
              maxItems: 138
            reg:
              minItems: 104
              maxItems: 104
        - properties:
            interrupts:
              minItems: 130
              maxItems: 130
            reg:
              minItems: 101
              maxItems: 101
      required:
        - reg

  - if:
      properties:
        compatible:
          contains:
            const: apple,t6002-event-log
    then:
      oneOf:
        - properties:
            interrupts:
              minItems: 28
              maxItems: 28
            reg:
              minItems: 28
              maxItems: 28
        - properties:
            interrupts:
              minItems: 26
              maxItems: 26
            reg:
              minItems: 26
              maxItems: 26
      required:
        - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    error-handler {
        compatible = "apple,t8140-error-handler",
                     "apple,soc-error-handler";
        interrupts = <AIC_IRQ 282 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 284 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 286 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 288 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 892 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 352 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 361 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 351 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 358 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 354 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 355 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 356 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 359 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 357 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 290 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 293 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 296 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 299 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 177 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 178 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 179 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 180 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 185 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 184 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 181 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 182 IRQ_TYPE_LEVEL_HIGH>;
    };
