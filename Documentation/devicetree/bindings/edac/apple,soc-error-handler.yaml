%YAML 1.2
---
$id: http://devicetree.org/schemas/edac/apple,soc-error-handler.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SoC platform error and event log interrupt handlers

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Apple SoCs route memory-controller, SRAM, power-management and fabric
  errors to dedicated platform interrupt groups. A second group reports
  fatal events latched by peripheral event logs.

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,t6041-error-handler
          - const: apple,soc-error-handler
      - items:
          - const: apple,t8140-error-handler
          - const: apple,soc-error-handler
      - items:
          - const: apple,t6041-event-log
          - const: apple,soc-event-log
      - items:
          - const: apple,t8140-event-log
          - const: apple,soc-event-log
      - items:
          - enum:
              - apple,t8112-error-handler
              - apple,t6020-error-handler
              - apple,t6021-error-handler
              - apple,t6022-error-handler
          - const: apple,soc-error-handler
      - items:
          - enum:
              - apple,t8112-event-log
              - apple,t6020-event-log
              - apple,t6021-event-log
              - apple,t6022-event-log
          - const: apple,soc-event-log

  power-domains:
    maxItems: 1
    description: Power domain needed for the associated error-source registers.

  interrupts:
    minItems: 9
    maxItems: 322

  reg:
    minItems: 16
    maxItems: 255
    description: Error or event source register apertures in hardware order.

required:
  - compatible
  - interrupts

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: apple,t6041-error-handler
    then:
      properties:
        interrupts:
          minItems: 89
          maxItems: 89
      required:
        - reg
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8140-error-handler
    then:
      properties:
        interrupts:
          minItems: 26
          maxItems: 26
  - if:
      properties:
        compatible:
          contains:
            const: apple,t6041-event-log
    then:
      properties:
        interrupts:
          minItems: 21
          maxItems: 21
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8140-event-log
    then:
      properties:
        interrupts:
          minItems: 9
          maxItems: 9

  - if:
      properties:
        compatible:
          contains:
            const: apple,t6041-error-handler
    then:
      properties:
        reg:
          minItems: 25
          maxItems: 25

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    error-handler {
        compatible = "apple,t8140-error-handler",
                     "apple,soc-error-handler";
        interrupts = <AIC_IRQ 282 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 284 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 286 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 288 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 892 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 352 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 361 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 351 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 358 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 354 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 355 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 356 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 359 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 357 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 290 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 293 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 296 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 299 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 177 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 178 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 179 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 180 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 185 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 184 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 181 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 182 IRQ_TYPE_LEVEL_HIGH>;
    };
