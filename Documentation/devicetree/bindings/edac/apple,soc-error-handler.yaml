%YAML 1.2
---
$id: http://devicetree.org/schemas/edac/apple,soc-error-handler.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SoC platform error and event log interrupt handlers

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Apple SoCs route memory-controller, SRAM, power-management and fabric
  errors to dedicated platform interrupt groups. A second group reports
  fatal events latched by peripheral event logs.

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,t8142-error-handler
          - const: apple,soc-error-handler
      - items:
          - const: apple,t8142-event-log
          - const: apple,soc-event-log
      - items:
          - const: apple,t8152-error-handler
          - const: apple,soc-error-handler
      - items:
          - const: apple,t8152-event-log
          - const: apple,soc-event-log
      - items:
          - const: apple,t6041-error-handler
          - const: apple,soc-error-handler
      - items:
          - const: apple,t8140-error-handler
          - const: apple,soc-error-handler
      - items:
          - const: apple,t6041-event-log
          - const: apple,soc-event-log
      - items:
          - const: apple,t8140-event-log
          - const: apple,soc-event-log
      - items:
          - enum:
              - apple,t8122-error-handler
              - apple,t6030-error-handler
              - apple,t6031-error-handler
          - const: apple,soc-error-handler
      - items:
          - enum:
              - apple,t8122-event-log
              - apple,t6030-event-log
              - apple,t6031-event-log
          - const: apple,soc-event-log

  interrupts:
    minItems: 9
    maxItems: 159

  reg:
    minItems: 10
    maxItems: 123
    description: |
      Status apertures in hardware-description order; native access requires
      qualification. T6041 retains its qualified per-source NI interface.
      T8142 and T8152 retain complete native status-window lists; T8152 board
      descriptions publish 112 or 120 error-handler apertures.

  power-domains:
    maxItems: 1

required:
  - compatible
  - interrupts

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8142-error-handler
    then:
      properties:
        reg:
          minItems: 33
          maxItems: 33
        interrupts:
          minItems: 31
          maxItems: 31
      required:
        - reg
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8142-event-log
    then:
      properties:
        reg:
          minItems: 51
          maxItems: 51
        interrupts:
          minItems: 13
          maxItems: 13
      required:
        - reg
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8152-error-handler
    then:
      properties:
        reg:
          minItems: 112
          maxItems: 120
        interrupts:
          minItems: 96
          maxItems: 96
      required:
        - reg
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8152-event-log
    then:
      properties:
        reg:
          minItems: 57
          maxItems: 57
        interrupts:
          minItems: 9
          maxItems: 9
      required:
        - reg
  - if:
      properties:
        compatible:
          contains:
            const: apple,t6041-error-handler
    then:
      properties:
        interrupts:
          minItems: 89
          maxItems: 89
        reg:
          minItems: 25
          maxItems: 25
      required:
        - reg
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8140-error-handler
    then:
      properties:
        interrupts:
          minItems: 26
          maxItems: 26
        reg:
          minItems: 17
          maxItems: 17
  - if:
      properties:
        compatible:
          contains:
            const: apple,t6041-event-log
    then:
      properties:
        reg:
          maxItems: 25
        interrupts:
          minItems: 21
          maxItems: 21
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8140-event-log
    then:
      properties:
        interrupts:
          minItems: 9
          maxItems: 9
        reg:
          minItems: 10
          maxItems: 10
  - if:
      properties:
        compatible:
          contains:
            enum:
              - apple,t8122-error-handler
    then:
      properties:
        reg:
          minItems: 19
          maxItems: 19
        interrupts:
          minItems: 39
          maxItems: 39
      required:
        - reg
  - if:
      properties:
        compatible:
          contains:
            enum:
              - apple,t6030-error-handler
    then:
      properties:
        reg:
          minItems: 26
          maxItems: 26
        interrupts:
          minItems: 54
          maxItems: 54
      required:
        - reg
  - if:
      properties:
        compatible:
          contains:
            enum:
              - apple,t8122-event-log
    then:
      properties:
        reg:
          minItems: 13
          maxItems: 13
        interrupts:
          minItems: 13
          maxItems: 13
      required:
        - reg
  - if:
      properties:
        compatible:
          contains:
            enum:
              - apple,t6030-event-log
    then:
      properties:
        reg:
          minItems: 26
          maxItems: 26
        interrupts:
          minItems: 26
          maxItems: 26
      required:
        - reg
  - if:
      properties:
        compatible:
          contains:
            enum:
              - apple,t6031-event-log
    then:
      properties:
        reg:
          minItems: 25
          maxItems: 25
        interrupts:
          minItems: 26
          maxItems: 26
      required:
        - reg
  - if:
      properties:
        compatible:
          contains:
            enum:
              - apple,t6031-error-handler
    then:
      oneOf:
        - properties:
            reg:
              minItems: 123
              maxItems: 123
            interrupts:
              minItems: 159
              maxItems: 159
        - properties:
            reg:
              minItems: 113
              maxItems: 113
            interrupts:
              minItems: 141
              maxItems: 141
      required:
        - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    error-handler {
        compatible = "apple,t8140-error-handler",
                     "apple,soc-error-handler";
        interrupts = <AIC_IRQ 282 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 284 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 286 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 288 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 892 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 352 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 361 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 351 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 358 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 354 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 355 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 356 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 359 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 357 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 290 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 293 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 296 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 299 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 177 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 178 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 179 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 180 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 185 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 184 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 181 IRQ_TYPE_LEVEL_HIGH>,
                     <AIC_IRQ 182 IRQ_TYPE_LEVEL_HIGH>;
    };
