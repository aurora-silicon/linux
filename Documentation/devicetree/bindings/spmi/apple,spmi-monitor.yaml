%YAML 1.2
---
$id: http://devicetree.org/schemas/spmi/apple,spmi-monitor.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple first-generation SPMI secondary and event resources

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  The primary PMIC bus is serviced by the polled SPMI driver. Its secondary
  controller and interrupt-status apertures, and its external AIC interrupt,
  remain firmware-owned. Describing them separately preserves the active
  polled register window without enabling an unqualified interrupt path.

properties:
  compatible:
    items:
      - enum:
          - apple,t8103-spmi-monitor
          - apple,t6000-spmi-monitor
      - const: apple,spmi-monitor

  reg:
    items:
      - description: Secondary controller registers
      - description: Interrupt-status registers

  interrupts:
    maxItems: 1

  interrupt-controller: true

  "#interrupt-cells":
    const: 2

  "#address-cells":
    const: 0

  apple,controller:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Primary polled SPMI controller sharing these resources.

required:
  - compatible
  - reg
  - interrupts
  - apple,controller

additionalProperties: false
