%YAML 1.2
---
$id: http://devicetree.org/schemas/spmi/apple,spmi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SPMI controller

maintainers:
  - Sasha Finkelstein <k@chaosmail.tech>

description: A SPMI controller present on most Apple SoCs

allOf:
  - $ref: spmi.yaml#

properties:
  compatible:
    oneOf:
      - const: apple,t8142-spmi
      - items:
          - enum:
              - apple,t6000-spmi
              - apple,t8103-spmi
              - apple,t8112-spmi
          - const: apple,spmi
      - items:
          - const: apple,t6050-spmi
          - const: apple,t8142-spmi
      - items:
          - enum:
              - apple,t6000-spmi
              - apple,t6020-spmi
              - apple,t6030-spmi
              - apple,t6031-spmi
              - apple,t6041-spmi
              - apple,t8012-spmi
              - apple,t8015-spmi
              - apple,t8112-spmi
              - apple,t8122-spmi
              - apple,t8132-spmi
              - apple,t8140-spmi
          - const: apple,t8103-spmi
      - description:
          The gen-4 controller of T8152, with its FIFO registers at 0x200.
        items:
          - const: apple,t8152-spmi
          - const: apple,t8142-spmi

  reg:
    minItems: 1
    items:
      - description: SPMI command interface
      - description: SPMI interrupt interface
      - description: SPMI auxiliary interface

  interrupts:
    maxItems: 1
    description: Optional, operates in polled mode if not present

  interrupt-controller:
    description:
      The controller demultiplexes follower interrupts. Some instances (the
      T8112 AOP controllers) have no interrupt line to the AP. Follower
      interrupts are then described but cannot be delivered, and drivers
      fall back to polling or stay idle.

  "#interrupt-cells":
    const: 2

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg

dependentRequired:
  interrupt-controller:
    - "#interrupt-cells"

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/spmi/spmi.h>

    spmi@920a1300 {
        compatible = "apple,t6000-spmi", "apple,spmi";
        reg = <0x920a1300 0x100>;
        #address-cells = <2>;
        #size-cells = <0>;

        pmic@f {
            reg = <0xf SPMI_USID>;
            /* PMIC-specific properties */
        };
    };
