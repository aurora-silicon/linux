%YAML 1.2
---
$id: http://devicetree.org/schemas/spmi/apple,spmi.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SPMI controller

maintainers:
  - Sasha Finkelstein <k@chaosmail.tech>

description: A SPMI controller present on most Apple SoCs

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - "apple,spmi"
              - "apple,t6000-spmi"
              - "apple,t6020-spmi"
              - "apple,t6030-spmi"
              - "apple,t6031-spmi"
              - "apple,t6041-spmi"
              - "apple,t6050-spmi"
              - "apple,t8012-spmi"
              - "apple,t8015-spmi"
              - "apple,t8103-spmi"
              - "apple,t8112-spmi"
              - "apple,t8122-spmi"
              - "apple,t8132-spmi"
              - "apple,t8140-spmi"
              - "apple,t8142-spmi"
      required:
        - "compatible"
    -
      properties:
        compatible:
          items:
            -
              const: "apple,t6050-spmi"
            -
              const: "apple,spmi"
      required:
        - "compatible"

properties:
  compatible: true
  reg: true
  interrupts: true
  interrupt-controller: true
  "#interrupt-cells": true
  power-domains: true
  iommus: true
  clocks: true
  resets: true
  status: true

additionalProperties: true

allOf:
  - if:
      anyOf:
        -
          properties:
            compatible:
              items:
                -
                  const: "apple,t6050-spmi"
                -
                  const: "apple,spmi"
            status:
              const: "disabled"
          required:
            - "compatible"
            - "status"
    then:
      oneOf:
        -
          description: "T6050 native resource description. Firmware ownership, backend support and enables require separate qualification. This variant remains disabled and contains no programming sequences or firmware data."
          properties:
            compatible:
              items:
                -
                  const: "apple,t6050-spmi"
                -
                  const: "apple,spmi"
            status:
              const: "disabled"
            reg:
              minItems: 3
              maxItems: 3
              description: "Native register apertures in hardware-interface order, including shared auxiliary views."
            interrupts:
              maxItems: 1
            "#address-cells":
              const: 2
            "#size-cells":
              const: 0
          required:
            - "compatible"
            - "reg"
            - "status"
            - "interrupts"
            - "#address-cells"
            - "#size-cells"
          additionalProperties: false
    else:
      allOf:
        - $ref: spmi.yaml#
      properties:
        compatible:
          oneOf:
            - items:
                - const: apple,t6050-spmi
                - const: apple,t8142-spmi
            - const: apple,t8142-spmi
            - items:
                - enum:
                    - apple,t6000-spmi
                    - apple,t8103-spmi
                    - apple,t8112-spmi
                - const: apple,spmi
            - items:
                - enum:
                    - apple,t6000-spmi
                    - apple,t6020-spmi
                    - apple,t6030-spmi
                    - apple,t6031-spmi
                    - apple,t6041-spmi
                    - apple,t8012-spmi
                    - apple,t8015-spmi
                    - apple,t8112-spmi
                    - apple,t8122-spmi
                    - apple,t8132-spmi
                    - apple,t8140-spmi
                - const: apple,t8103-spmi
            - const: apple,t6050-spmi

        reg:
          minItems: 1
          items:
            - description: SPMI command interface
            - description: SPMI interrupt interface
            - description: SPMI auxiliary interface

        interrupts:
          maxItems: 1
          description: Optional, operates in polled mode if not present

        interrupt-controller: true

        "#interrupt-cells":
          const: 2

        power-domains:
          maxItems: 1
      required:
        - compatible
        - reg
      dependentRequired:
        interrupt-controller:
          - "#interrupt-cells"
          - interrupts
      unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/spmi/spmi.h>

    spmi@920a1300 {
        compatible = "apple,t6000-spmi", "apple,spmi";
        reg = <0x920a1300 0x100>;
        #address-cells = <2>;
        #size-cells = <0>;

        pmic@f {
            reg = <0xf SPMI_USID>;
            /* PMIC-specific properties */
        };
    };
