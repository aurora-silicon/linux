%YAML 1.2
---
$id: http://devicetree.org/schemas/spmi/apple,spmi-sideband.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SPMI sideband

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  SPMI sideband resources on M2 generation SoCs. The register apertures
  follow hardware resource order. Firmware configuration and tuning are
  supplied by the bootloader and are not part of this binding. Unqualified
  instances must remain disabled.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6020-spmi-sideband
          - apple,t6021-spmi-sideband
          - apple,t6022-spmi-sideband
          - apple,t8112-spmi-sideband
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t6020-spmi-sideband
          - apple,t6021-spmi-sideband
          - apple,t6022-spmi-sideband
          - apple,t8112-spmi-sideband
      - const: apple,spmi-sideband

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false
