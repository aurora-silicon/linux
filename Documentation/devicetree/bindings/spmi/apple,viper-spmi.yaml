%YAML 1.2
---
$id: http://devicetree.org/schemas/spmi/apple,viper-spmi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Viper SPMI endpoint

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  A Viper endpoint on an auxiliary SPMI bus. Its register protocol and
  firmware ownership are separate from those of the primary PMIC. With the
  apple,spmi-nvmem fallback its register space is also exported as a
  read-only NVMEM device for inspection.

select:
  properties:
    compatible:
      contains:
        const: apple,viper-spmi
  required:
    - compatible

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,t6000-viper-spmi
          - const: apple,viper-spmi
      - items:
          - const: apple,t6000-viper-spmi
          - const: apple,viper-spmi
          - const: apple,spmi-nvmem

  reg:
    maxItems: 1

required:
  - compatible
  - reg

allOf:
  - $ref: /schemas/nvmem/nvmem.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: apple,spmi-nvmem
    then:
      required:
        - read-only

unevaluatedProperties: false
