%YAML 1.2
---
$id: http://devicetree.org/schemas/bus/apple,m2-dwi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M2 generation two-wire interface

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Two-wire interface resources on M2 generation SoCs. The register apertures
  follow hardware resource order. Firmware configuration and tuning are
  supplied by the bootloader and are not part of this binding. Unqualified
  instances must remain disabled.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6020-dwi
          - apple,t6021-dwi
          - apple,t6022-dwi
          - apple,t8112-dwi
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t6020-dwi
          - apple,t6021-dwi
          - apple,t6022-dwi
          - apple,t8112-dwi
      - const: apple,dwi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - power-domains

additionalProperties: false
