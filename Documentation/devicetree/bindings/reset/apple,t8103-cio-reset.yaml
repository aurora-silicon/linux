%YAML 1.2
---
$id: http://devicetree.org/schemas/reset/apple,t8103-cio-reset.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SoC CIO (USB4/Thunderbolt) block reset controller

maintainers:
  - Sven Peter <sven@kernel.org>

description: |
  The CIO (Converged I/O) blocks on Apple Silicon SoCs have a reset
  inside the power manager (PMGR) that has to be deasserted before
  their co-processor can be booted. On t8103 each port comes with a
  dedicated register page, represented as a standalone node. On t600x a
  single register shared by all ports of a die with one request bit per
  port is used instead. Since this register is located in the middle of
  the PMGR MMIO region it is represented as a sub-node of the PMGR
  syscon with reg used as an offset into it.

  On t8142, a standalone register page contains a shared request register
  with alternating request and busy bits for four ports.

  On t6050 the same request register sits at offset 0x60 of a page in the
  die's PMGR block.

  On t6041, a PMGR child register contains one request bit per CIO port and
  the corresponding busy bit at 16 plus the port index. The controller waits
  up to 192 ms for that busy bit to clear both before and after its
  read-modify-write request.

  In all cases the reset id is the CIO port index on the die.

properties:
  compatible:
    oneOf:
      - enum:
          - apple,t8103-cio-reset
          - apple,t8142-cio-reset
          - apple,t6050-cio-reset
          - apple,t6000-cio-reset
          - apple,t6041-cio-reset
      - items:
          - const: apple,t8112-cio-reset
          - const: apple,t8103-cio-reset
      - items:
          - enum:
              - apple,t6020-cio-reset
              - apple,t6030-cio-reset
              - apple,t6031-cio-reset
              - apple,t8122-cio-reset
              - apple,t8132-cio-reset
          - const: apple,t6000-cio-reset

  reg:
    maxItems: 1

  '#reset-cells':
    const: 1

required:
  - compatible
  - reg
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        reset-controller@23b784000 {
            compatible = "apple,t8103-cio-reset";
            reg = <0x2 0x3b784000 0x0 0x8000>;
            #reset-cells = <1>;
        };
    };
