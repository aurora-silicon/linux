%YAML 1.2
---
$id: http://devicetree.org/schemas/mux/apple,display-crossbar.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple display crossbar

maintainers:
  - Sven Peter <sven@svenpeter.dev>

description:
  Routes display pipelines to the DisplayPort transmitters and inputs
  of an Apple Type-C PHY. Older layouts expose three mux controls; the T8142/T6050 layout
  exposes five. The consumer selects an output using the mux specifier.

allOf:
  - $ref: mux-controller.yaml#

properties:
  compatible:
    enum:
      - apple,t8103-display-crossbar
      - apple,t8112-display-crossbar
      - apple,t6000-display-crossbar
      - apple,t6020-display-crossbar
      - apple,t8142-display-crossbar
      - apple,t6050-display-crossbar

  reg:
    maxItems: 1

  power-domains:
    minItems: 2
    maxItems: 2

  power-domain-names:
    items:
      - const: usb-aon
      - const: common

  '#mux-control-cells':
    const: 1

required:
  - compatible
  - reg
  - '#mux-control-cells'

unevaluatedProperties: false

examples:
  - |
    mux-controller@b04c000 {
        compatible = "apple,t6020-display-crossbar";
        reg = <0xb04c000 0x4000>;
        #mux-control-cells = <1>;
    };
