%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,t8140-ave.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple video encoder

maintainers:
  - Miguel Cruz <7362641+Acelogic@users.noreply.github.com>

description: |
  The T6000, T6041, T8112 and T8140 AVE coprocessors encode video using firmware
  preloaded by the bootloader. Its two DART instances translate the same stream. The
  bootloader supplies two reserved firmware regions and their IOVA mappings.

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - apple,t6000-ave
              - apple,t6041-ave
              - apple,t8112-ave
              - apple,t8140-ave
      required:
        - compatible
    -
      properties:
        compatible:
          allOf:
            -
              contains:
                enum:
                  - apple,t8142-ave
                  - apple,t8152-ave
                  - apple,t6050-ave
            -
              contains:
                const: apple,ave
      required:
        - compatible
properties:
  compatible: true

  reg: true

  reg-names: true

  interrupts: true

  power-domains: true

  power-domain-names: true

  iommus: true

  memory-region: true

# The root declares the union of property types for DTB decoding. The
# conditional variants below each retain their closed property contract.
additionalProperties: true

allOf:
  -
    if:
      anyOf:
        -
          properties:
            compatible:
              allOf:
                -
                  contains:
                    enum:
                      - apple,t8142-ave
                      - apple,t8152-ave
                      - apple,t6050-ave
                -
                  contains:
                    const: apple,ave
            status:
              const: disabled
          required:
            - compatible
            - status
          not:
            required:
              - mboxes
    then:
      oneOf:
        -
          type: object
          description: |
            Apple video encoding accelerator complex. Initial resource description for an unsupported
            firmware/backend layout. Register, IRQ and DMA topology can be recorded before a driver
            exists. This form must stay disabled; it does not substitute for the enabled driver contract
            or supply firmware, calibration, programming sequences or unresolved providers.
          properties:
            compatible:
              items:
                -
                  enum:
                    - apple,t8142-ave
                    - apple,t8152-ave
                    - apple,t6050-ave
                -
                  const: apple,ave
            status:
              const: disabled
            reg:
              description: |
                Register apertures of the complete hardware complex, in hardware interface order.
              minItems: 5
              maxItems: 5
            interrupts:
              description: Interrupt lines wired to the system interrupt controller.
              minItems: 3
              maxItems: 5
            iommus:
              description: DMA translation streams emitted by this hardware.
              maxItems: 1
          required:
            - compatible
            - reg
            - status
          additionalProperties: false
    else:
      $ref: "#/$defs/legacy-driver"

$defs:
  legacy-driver:
    type: object
    properties:
      compatible:
        enum:
          - apple,t6000-ave
          - apple,t6041-ave
          - apple,t8112-ave
          - apple,t8140-ave

      reg:
        items:
          - description: Codec registers
          - description: Mailbox registers
          - description: Coprocessor registers

      reg-names:
        items:
          - const: codec
          - const: mailbox
          - const: coproc

      interrupts:
        items:
          - description: Mailbox, raised when the firmware posts to a host ring
          - description: Codec interrupt handled by the firmware
          - description: Codec interrupt handled by the firmware
          - description: Codec interrupt handled by the firmware
          - description: Codec interrupt handled by the firmware

      power-domains:
        minItems: 5
        maxItems: 6

      power-domain-names:
        minItems: 5
        items:
          - const: dma
          - const: pipe4
          - const: pipe5
          - const: me0
          - const: me1
          - const: perf
            description: |
              A performance floor the encoder needs to run at full speed, held
              while the encoder is powered (for example the SoC rail floor of a
              PMC).

      iommus:
        maxItems: 2

      memory-region:
        items:
          - description: Preloaded firmware text
          - description: Preloaded firmware data
    required:
      - compatible
      - reg
      - reg-names
      - interrupts
      - power-domains
      - power-domain-names
      - iommus
    additionalProperties: false
