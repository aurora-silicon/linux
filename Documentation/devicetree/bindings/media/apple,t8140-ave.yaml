%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,t8140-ave.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8140 video encoder

maintainers:
  - Miguel Cruz <7362641+Acelogic@users.noreply.github.com>

description: |
  The T8140 AVE coprocessor encodes video using firmware preloaded by the
  bootloader. Its two DART instances translate the same stream. The
  bootloader supplies two reserved firmware regions and their IOVA mappings.

properties:
  compatible:
    const: apple,t8140-ave

  reg:
    items:
      - description: Codec registers
      - description: Mailbox registers
      - description: Coprocessor registers

  reg-names:
    items:
      - const: codec
      - const: mailbox
      - const: coproc

  interrupts:
    maxItems: 5

  power-domains:
    maxItems: 5

  power-domain-names:
    items:
      - const: dma
      - const: pipe4
      - const: pipe5
      - const: me0
      - const: me1

  iommus:
    maxItems: 2

  memory-region:
    items:
      - description: Preloaded firmware text
      - description: Preloaded firmware data

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - power-domains
  - power-domain-names
  - iommus

additionalProperties: false
