%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,t8140-ave.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple video encoder

maintainers:
  - Miguel Cruz <7362641+Acelogic@users.noreply.github.com>

description: |
  The T6000, T6041, T8112 and T8140 AVE coprocessors encode video using firmware
  preloaded by the bootloader. Its two DART instances translate the same stream. The
  bootloader supplies two reserved firmware regions and their IOVA mappings.

properties:
  compatible:
    enum:
      - apple,t6000-ave
      - apple,t6041-ave
      - apple,t8112-ave
      - apple,t8140-ave

  reg:
    items:
      - description: Codec registers
      - description: Mailbox registers
      - description: Coprocessor registers

  reg-names:
    items:
      - const: codec
      - const: mailbox
      - const: coproc

  interrupts:
    maxItems: 5

  power-domains:
    minItems: 5
    maxItems: 6

  power-domain-names:
    minItems: 5
    items:
      - const: dma
      - const: pipe4
      - const: pipe5
      - const: me0
      - const: me1
      - const: perf
        description: |
          A performance floor the encoder needs to run at full speed, held
          while the encoder is powered (for example the SoC rail floor of a
          PMC).

  iommus:
    maxItems: 2

  memory-region:
    items:
      - description: Preloaded firmware text
      - description: Preloaded firmware data

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - power-domains
  - power-domain-names
  - iommus

additionalProperties: false
