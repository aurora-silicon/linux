%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,t8140-ave.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple video encoder

maintainers:
  - Miguel Cruz <7362641+Acelogic@users.noreply.github.com>

description: |
  The AVE coprocessor encodes video using firmware preloaded by the bootloader.
  DART instances translate its DMA streams. The bootloader supplies the firmware
  memory handoff and IOVA mappings.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6000-ave
          - apple,t6020-ave
          - apple,t6021-ave
          - apple,t6022-ave
          - apple,t6030-ave
          - apple,t6031-ave
          - apple,t6032-ave
          - apple,t6041-ave
          - apple,t8103-ave
          - apple,t8112-ave
          - apple,t8122-ave
          - apple,t8132-ave
          - apple,t6050-ave
          - apple,t8140-ave
          - apple,t8142-ave
  required:
    - compatible

properties:
  compatible: true

allOf:
  - properties:
      compatible:
        oneOf:
          - enum:
              - apple,t6000-ave
              - apple,t6041-ave
              - apple,t6050-ave
              - apple,t8112-ave
              - apple,t8140-ave
              - apple,t8142-ave
          - items:
              - enum:
                  - apple,t6020-ave
                  - apple,t6021-ave
                  - apple,t6022-ave
                  - apple,t6030-ave
                  - apple,t6031-ave
                  - apple,t6032-ave
                  - apple,t8103-ave
                  - apple,t8122-ave
                  - apple,t8132-ave
              - const: apple,ave

      reg:
        minItems: 3
        maxItems: 5
        description: Codec, mailbox, coprocessor and generation-specific auxiliary banks.

      reg-names:
        minItems: 3
        items:
          - const: codec
          - const: mailbox
          - const: coproc
          - enum: [pmgr, power-control]
          - enum: [fabric, pio]

      clocks:
        maxItems: 1

      interrupts:
        items:
          - description: Mailbox, raised when the firmware posts to a host ring
          - description: Codec interrupt handled by the firmware
          - description: Codec interrupt handled by the firmware
          - description: Codec interrupt handled by the firmware
          - description: Codec interrupt handled by the firmware

      power-domains:
        minItems: 1
        maxItems: 6

      power-domain-names:
        minItems: 5
        items:
          - const: dma
          - const: pipe4
          - const: pipe5
          - const: me0
          - const: me1
          - const: perf
            description: |
              A performance floor the encoder needs to run at full speed, held
              while the encoder is powered (for example the SoC rail floor of a
              PMC).

      iommus:
        minItems: 2
        maxItems: 4
        description:
          The encoder's stream on each of its DARTs. Where the motion-compensated
          temporal filter has its own stream (stream 12 on T8140), that stream is
          listed after the encoder's on each DART.

      memory-region:
        items:
          - description: Preloaded firmware text
          - description: Preloaded firmware data

      aurora,ave-text-crc32:
        $ref: /schemas/types.yaml#/definitions/string
        pattern: '^[0-9a-fA-F]{1,8}$'
        description: |
          Hexadecimal CRC32 of this encoder's preloaded firmware text region,
          injected by the bootloader at boot. When absent, the driver falls
          back to /chosen/aurora,ave-text-crc32 for compatibility with older
          bootloaders; if present, it takes precedence and must be valid.

      aurora,ave-data-crc32:
        $ref: /schemas/types.yaml#/definitions/string
        pattern: '^[0-9a-fA-F]{1,8}$'
        description: |
          Hexadecimal CRC32 of this encoder's clean preloaded firmware data
          region, injected by the bootloader at boot. When absent, the driver
          falls back to /chosen/aurora,ave-data-crc32 for compatibility with
          older bootloaders; if present, it takes precedence and must be valid.

    required:
      - compatible
      - reg
      - interrupts
      - power-domains
      - iommus

    allOf:
      - if:
          properties:
            compatible:
              contains:
                enum:
                  - apple,t6020-ave
                  - apple,t6021-ave
                  - apple,t6022-ave
        then:
          properties:
            reg:
              minItems: 5
        else:
          properties:
            power-domains:
              minItems: 5
          required:
            - reg-names
            - power-domain-names
      - if:
          properties:
            compatible:
              contains:
                enum:
                  - apple,t6041-ave
                  - apple,t6050-ave
                  - apple,t8132-ave
                  - apple,t8140-ave
                  - apple,t8142-ave
        then:
          properties:
            reg:
              maxItems: 3
            reg-names:
              maxItems: 3

    additionalProperties: false

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        video-codec@285100000 {
            compatible = "apple,t6041-ave";
            reg = <0x2 0x85100000 0x0 0x45c000>,
                  <0x2 0x85050000 0x0 0x4000>,
                  <0x2 0x85800000 0x0 0x800000>;
            reg-names = "codec", "mailbox", "coproc";
            interrupt-parent = <&aic>;
            interrupts = <AIC_IRQ 1476 IRQ_TYPE_LEVEL_HIGH>,
                         <AIC_IRQ 1470 IRQ_TYPE_LEVEL_HIGH>,
                         <AIC_IRQ 1469 IRQ_TYPE_LEVEL_HIGH>,
                         <AIC_IRQ 1472 IRQ_TYPE_LEVEL_HIGH>,
                         <AIC_IRQ 1471 IRQ_TYPE_LEVEL_HIGH>;
            power-domains = <&ps_venc1_dma>, <&ps_venc1_pipe4>,
                            <&ps_venc1_pipe5>, <&ps_venc1_me0>,
                            <&ps_venc1_me1>, <&pmc_soc_max>;
            power-domain-names = "dma", "pipe4", "pipe5", "me0", "me1", "perf";
            iommus = <&ave1_dart0 0>, <&ave1_dart0 12>,
                     <&ave1_dart1 0>, <&ave1_dart1 12>;
            memory-region = <&ave1_fw_text>, <&ave1_fw_data>;
            aurora,ave-text-crc32 = "9a080cad";
            aurora,ave-data-crc32 = "6e66c376";
        };
    };
