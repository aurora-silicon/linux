%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,scaler.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple image scaler

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  The image scaler and its companion DMA registers. The two DART streams
  carry image data and PIODMA transfers. Firmware performance votes are
  not fixed clock rates and are not encoded as clock-frequency values.

properties:
  compatible:
    items:
      - enum:
          - apple,t6000-scaler
          - apple,t6030-scaler
          - apple,t6031-scaler
          - apple,t6041-scaler
          - apple,t8103-scaler
          - apple,t8122-scaler
          - apple,t8140-scaler
      - const: apple,scaler

  reg:
    minItems: 2
    maxItems: 4

  interrupts:
    minItems: 2
    maxItems: 2

  power-domains:
    minItems: 1
    maxItems: 2

  iommus:
    minItems: 1
    maxItems: 2

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - power-domains
  - iommus

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8103-scaler
    then:
      properties:
        reg:
          maxItems: 2
    else:
      if:
        properties:
          compatible:
            contains:
              const: apple,t6000-scaler
      then:
        properties:
          reg:
            minItems: 3
            maxItems: 3
      else:
        if:
          properties:
            compatible:
              contains:
                enum:
                  - apple,t6030-scaler
                  - apple,t6031-scaler
                  - apple,t8122-scaler
        then:
          properties:
            reg:
              minItems: 3
        else:
          properties:
            reg:
              minItems: 4
  - if:
      not:
        properties:
          compatible:
            contains:
              enum:
                - apple,t6030-scaler
                - apple,t6031-scaler
                - apple,t8122-scaler
    then:
      properties:
        power-domains:
          minItems: 2
        iommus:
          minItems: 2
      required:
        - resets
        - clocks

additionalProperties: false
