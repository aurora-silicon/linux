%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,scaler.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Apple image scaling accelerator
maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>
select:
  properties:
    compatible:
      allOf:
        -
          contains:
            enum:
              - apple,t8142-scaler
              - apple,t8152-scaler
              - apple,t6050-scaler
        -
          contains:
            const: apple,scaler
  required:
    - compatible
description: |
  Apple image scaling accelerator. Initial resource description for an unsupported firmware/backend
  layout. Register, IRQ and DMA topology can be recorded before a driver exists. This form must stay
  disabled; it does not substitute for the enabled driver contract or supply firmware, calibration,
  programming sequences or unresolved providers.
properties:
  compatible:
    items:
      -
        enum:
          - apple,t8142-scaler
          - apple,t8152-scaler
          - apple,t6050-scaler
      -
        const: apple,scaler
  status:
    const: disabled
  reg:
    description: Register apertures of the complete hardware complex, in hardware interface order.
    minItems: 10
    maxItems: 12
  interrupts:
    description: Interrupt lines wired to the system interrupt controller.
    minItems: 15
    maxItems: 20
  iommus:
    description: DMA translation streams emitted by this hardware.
    minItems: 2
    maxItems: 4
  power-domains:
    description: Power and combined clock gates required by this hardware.
    maxItems: 1
required:
  - compatible
  - reg
  - status
additionalProperties: false
