%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,scaler.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple image scaler

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  The image scaler and its companion DMA registers. The two DART streams
  carry image data and PIODMA transfers. Firmware performance votes are
  not fixed clock rates and are not encoded as clock-frequency values.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6041-scaler
          - apple,scaler
          - apple,t8140-scaler
          - apple,t8132-scaler
  required:
    - compatible

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - apple,t8132-scaler
      required:
        - compatible
    then:
      properties:
        compatible:
          items:
            - enum:
                - apple,t8132-scaler
            - const: apple,scaler

        reg:
          minItems: 4
          maxItems: 4

        interrupts:
          minItems: 2
          maxItems: 2

        power-domains:
          minItems: 1
          maxItems: 2

        iommus:
          minItems: 1
          maxItems: 2

        clocks:
          minItems: 1
          maxItems: 1

      required:
        - compatible
        - reg
        - interrupts
        - power-domains
        - iommus

      additionalProperties: false
    else:
      properties:
        compatible:
          oneOf:
            - items:
                - const: apple,t6041-scaler
                - const: apple,scaler
            - items:
                - const: apple,t8140-scaler
                - const: apple,scaler

        reg:
          minItems: 4
          maxItems: 4
          description: Register apertures in hardware-description order.

        interrupts:
          minItems: 2
          maxItems: 2

        power-domains:
          minItems: 2
          maxItems: 2

        iommus:
          minItems: 2
          maxItems: 2

        clocks:
          minItems: 1
          maxItems: 1

        resets:
          maxItems: 1

      required:
        - compatible
        - reg
        - interrupts
        - power-domains
        - resets
        - iommus
        - clocks

      additionalProperties: false
