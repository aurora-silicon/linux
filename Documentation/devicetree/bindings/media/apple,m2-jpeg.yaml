%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,m2-jpeg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M2 generation JPEG codec

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  JPEG codec resources on M2 generation SoCs. The register apertures
  follow hardware resource order. Firmware configuration and tuning are
  supplied by the bootloader and are not part of this binding. Unqualified
  instances must remain disabled.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6020-jpeg
          - apple,t6021-jpeg
          - apple,t6022-jpeg
          - apple,t8112-jpeg
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t6020-jpeg
          - apple,t6021-jpeg
          - apple,t6022-jpeg
          - apple,t8112-jpeg
      - const: apple,jpeg

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  iommus:
    maxItems: 1

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - iommus
  - power-domains

additionalProperties: false
