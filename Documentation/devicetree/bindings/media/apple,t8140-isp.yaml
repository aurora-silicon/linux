%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,t8140-isp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8140 Image Signal Processor

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description:
  The T8140 ISP controls the attached camera sensor and processes its frames
  through bootloader-loaded firmware. The host exchanges commands and image
  buffers through three DART instances. A separate watchdog register window
  must be serviced while capturing to receive sensor pixels.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t8140-isp
          - apple,t8142-isp
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t8140-isp
          - apple,t8142-isp
      - const: apple,isp

  reg:
    items:
      - description: Coprocessor control registers
      - description: Mailbox interrupt and doorbell registers
      - description: Firmware handshake registers
      - description: Capture watchdog registers

  reg-names:
    items:
      - const: coproc
      - const: mbox
      - const: gpio
      - const: wdt

  interrupts:
    maxItems: 1

  iommus:
    items:
      - description: First ISP DART stream
      - description: Second ISP DART stream
      - description: Third ISP DART stream

  power-domains:
    items:
      - description: ISP system domain
      - description: ISP CPU domain
      - description: ISP CPU core 0 domain
      - description: ISP CPU core 1 domain
      - description: ISP FE domain
      - description: ISP DPRX domain
      - description: ISP secure domain
      - description: ISP STS0 domain
      - description: ISP STS1 domain
      - description: ISP Pearl domain
      - description: ISP BE domain
      - description: ISP CLR domain
      - description: ISP CVD domain
      - description: ISP CVM domain

  memory-region:
    maxItems: 1
    description: Firmware heap region provided by the bootloader

  memory-region-names:
    items:
      - const: heap

  apple,dart-vm-size:
    $ref: /schemas/types.yaml#/definitions/uint64
    description:
      Size in bytes of the host allocation aperture used by the ISP driver.

  apple,platform-id:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Platform identifier passed in the firmware boot descriptor.

  apple,temporal-filter:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Firmware temporal-filter strength selected for the attached sensor.

  sensor-presets:
    type: object
    description:
      Sensor firmware presets and the host output geometry associated with them.
    patternProperties:
      "^preset[0-9]+$":
        type: object
        properties:
          apple,config-index:
            $ref: /schemas/types.yaml#/definitions/uint32
            description: Sensor configuration index understood by the firmware
          apple,input-size:
            $ref: /schemas/types.yaml#/definitions/uint32-array
            items:
              - description: Input width in pixels
              - description: Input height in pixels
            description: Sensor input dimensions
          apple,output-size:
            $ref: /schemas/types.yaml#/definitions/uint32-array
            items:
              - description: Output width in pixels
              - description: Output height in pixels
            description: Delivered frame dimensions
          apple,crop:
            $ref: /schemas/types.yaml#/definitions/uint32-array
            items:
              - description: Horizontal crop origin in pixels
              - description: Vertical crop origin in pixels
              - description: Crop width in pixels
              - description: Crop height in pixels
            description: Cropped sensor rectangle
        required:
          - apple,config-index
          - apple,input-size
          - apple,output-size
          - apple,crop
        additionalProperties: false
    additionalProperties: false

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - iommus
  - power-domains
  - memory-region
  - memory-region-names
  - apple,dart-vm-size
  - apple,platform-id
  - sensor-presets

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        isp@320000000 {
            compatible = "apple,t8140-isp", "apple,isp";
            reg = <0x3 0x20000000 0x0 0x1801000>,
                  <0x3 0x22920000 0x0 0x1000>,
                  <0x3 0x22921000 0x0 0x100>,
                  <0x3 0x63b50000 0x0 0x8000>;
            reg-names = "coproc", "mbox", "gpio", "wdt";
            interrupt-parent = <&aic>;
            interrupts = <AIC_IRQ 323 IRQ_TYPE_LEVEL_HIGH>;
            iommus = <&isp_dart0 0>, <&isp_dart1 0>, <&isp_dart2 0>;
            power-domains = <&ps_isp_sys>, <&ps_isp_cpu>,
                            <&ps_isp_cpu_core0>, <&ps_isp_cpu_core1>,
                            <&ps_isp_fe>, <&ps_isp_dprx>, <&ps_isp_secure>,
                            <&ps_isp_sts0>, <&ps_isp_sts1>, <&ps_isp_pearl>,
                            <&ps_isp_be>, <&ps_isp_clr>, <&ps_isp_cvd>,
                            <&ps_isp_cvm>;
            memory-region = <&isp_heap>;
            memory-region-names = "heap";
            apple,dart-vm-size = <0x0 0xa0000000>;
            apple,platform-id = <0x70>;
            apple,temporal-filter = <1>;

            sensor-presets {
                preset0 {
                    apple,config-index = <1>;
                    apple,input-size = <1920 1080>;
                    apple,output-size = <1920 1080>;
                    apple,crop = <0 0 1920 1080>;
                };
            };
        };
    };
