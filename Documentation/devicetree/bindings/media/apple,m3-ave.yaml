%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,m3-ave.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M3 family video encoder

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the M3 family video encoder.
  The interface is described for discovery and must remain disabled until
  its ownership, initialization and shutdown are supported. Register windows
  are listed in hardware resource order; firmware configuration and tuning
  data are supplied by the boot firmware rather than this binding.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t8122-ave
          - apple,t6030-ave
          - apple,t6031-ave
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t8122-ave
          - apple,t6030-ave
          - apple,t6031-ave
      - const: apple,ave

  reg:
    minItems: 5
    maxItems: 5

  interrupts:
    minItems: 5
    maxItems: 5

  power-domains:
    minItems: 1
    maxItems: 6

  iommus:
    minItems: 1
    maxItems: 2

required:
  - compatible
  - reg
  - interrupts
  - power-domains
  - iommus

additionalProperties: false
