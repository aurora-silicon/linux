%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,t8132-scaler.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M4 base SoC image scaler

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the M4 base SoC image scaler.
  The interface is described for discovery and must remain disabled until
  its ownership, initialization and shutdown are supported. Register windows
  are listed in hardware resource order; firmware configuration and tuning
  data are supplied by the boot firmware rather than this binding.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t8132-scaler
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t8132-scaler
      - const: apple,scaler

  reg:
    minItems: 4
    maxItems: 4

  interrupts:
    minItems: 2
    maxItems: 2

  power-domains:
    minItems: 1
    maxItems: 2

  iommus:
    minItems: 1
    maxItems: 2

  clocks:
    minItems: 1
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - power-domains
  - iommus

additionalProperties: false
