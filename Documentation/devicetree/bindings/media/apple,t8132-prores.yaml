%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,t8132-prores.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M4 base SoC ProRes codec

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the M4 base SoC ProRes codec.
  The interface is described for discovery and must remain disabled until
  its ownership, initialization and shutdown are supported. Register windows
  are listed in hardware resource order; firmware configuration and tuning
  data are supplied by the boot firmware rather than this binding.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t8132-prores
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t8132-prores
      - const: apple,prores

  reg:
    minItems: 3
    maxItems: 3

  interrupts:
    minItems: 2
    maxItems: 2

  power-domains:
    minItems: 1
    maxItems: 1

  iommus:
    minItems: 1
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - power-domains
  - iommus

additionalProperties: false
