%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,m2-ave.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M2 generation video encoder

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Video encoder resources on M2 generation SoCs. The register apertures
  follow hardware resource order. Firmware configuration and tuning are
  supplied by the bootloader and are not part of this binding. Unqualified
  instances must remain disabled.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6020-ave
          - apple,t6021-ave
          - apple,t6022-ave
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t6020-ave
          - apple,t6021-ave
          - apple,t6022-ave
      - const: apple,ave

  reg:
    maxItems: 5

  interrupts:
    maxItems: 5

  iommus:
    maxItems: 4

  power-domains:
    minItems: 6
    maxItems: 7

required:
  - compatible
  - reg
  - interrupts
  - iommus
  - power-domains

additionalProperties: false
