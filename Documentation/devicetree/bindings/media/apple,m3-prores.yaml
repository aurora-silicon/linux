%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,m3-prores.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M3 family ProRes codec

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the M3 family ProRes codec.
  The interface is described for discovery and must remain disabled until
  its ownership, initialization and shutdown are supported. Register windows
  are listed in hardware resource order; firmware configuration and tuning
  data are supplied by the boot firmware rather than this binding.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t8122-prores
          - apple,t6030-prores
          - apple,t6031-prores
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t8122-prores
          - apple,t6030-prores
          - apple,t6031-prores
      - const: apple,prores

  reg:
    minItems: 2
    maxItems: 3

  interrupts:
    minItems: 1
    maxItems: 2

  power-domains:
    minItems: 1
    maxItems: 1

  iommus:
    minItems: 1
    maxItems: 2

required:
  - compatible
  - reg
  - interrupts
  - power-domains
  - iommus

additionalProperties: false
