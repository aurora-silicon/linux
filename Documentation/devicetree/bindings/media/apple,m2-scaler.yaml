%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,m2-scaler.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M2 generation image scaler

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Image scaler resources on M2 generation SoCs. The register apertures
  follow hardware resource order. Firmware configuration and tuning are
  supplied by the bootloader and are not part of this binding. Unqualified
  instances must remain disabled.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6020-scaler
          - apple,t6021-scaler
          - apple,t6022-scaler
          - apple,t8112-scaler
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t6020-scaler
          - apple,t6021-scaler
          - apple,t6022-scaler
          - apple,t8112-scaler
      - const: apple,scaler

  reg:
    maxItems: 3

  interrupts:
    maxItems: 2

  iommus:
    maxItems: 2

  power-domains:
    minItems: 2
    maxItems: 3

required:
  - compatible
  - reg
  - interrupts
  - iommus
  - power-domains

additionalProperties: false
