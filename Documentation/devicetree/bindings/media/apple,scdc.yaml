%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,scdc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SCDC coprocessor

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  SCDC coprocessor resources on M2 generation SoCs. The register apertures
  follow hardware resource order. Firmware configuration and tuning are
  supplied by the bootloader and are not part of this binding. Unqualified
  instances must remain disabled.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6020-scdc
          - apple,t6021-scdc
          - apple,t6022-scdc
          - apple,t8112-scdc
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t6020-scdc
          - apple,t6021-scdc
          - apple,t6022-scdc
          - apple,t8112-scdc
      - const: apple,scdc

  reg:
    maxItems: 8

  interrupts:
    minItems: 5
    maxItems: 6

  iommus:
    maxItems: 3

  power-domains:
    minItems: 1
    maxItems: 2

required:
  - compatible
  - reg
  - interrupts
  - iommus
  - power-domains

additionalProperties: false
