%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,isp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Image Signal Processor

maintainers:
  - Jonathan Goyvaerts <jonathan.goyvaerts@gmail.com>

description:
  The ISP controls the attached camera sensor and processes its frames using
  a coprocessor. The host exchanges commands and image buffers through three
  DART instances. The memory handoff identifies either the allocation heap or
  separate firmware text, data and heap regions.

select:
  properties:
    compatible:
      contains:
        enum: ['apple,t6020-isp', 'apple,t6041-isp', 'apple,t8112-isp']
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t6020-isp
          - apple,t6041-isp
          - apple,t8112-isp
      - const: apple,isp

  reg:
    items:
      - description: Coprocessor registers up to its control block
      - description: Mailbox interrupt registers
      - description: Firmware handshake registers
      - description: Mailbox doorbell registers

  reg-names:
    items:
      - const: coproc
      - const: mbox
      - const: gpio
      - const: mbox2

  interrupts:
    maxItems: 1

  iommus:
    items:
      - description: First ISP DART stream
      - description: Second ISP DART stream
      - description: Third ISP DART stream

  power-domains:
    minItems: 7
    maxItems: 18
    description: Register-backed power domains required by the ISP.

  memory-region:
    minItems: 1
    maxItems: 3
    description: Firmware memory and the host allocation heap.

  memory-region-names:
    minItems: 1
    maxItems: 3
    items:
      enum: [text, data, heap]

  apple,dart-vm-size:
    $ref: /schemas/types.yaml#/definitions/uint64
    description:
      Size in bytes of the host allocation aperture used by the ISP driver.

  apple,platform-id:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Platform identifier passed in the firmware boot descriptor.

  apple,cam-connections-scheme:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Camera connection layout of the board passed in the firmware boot
      descriptor.

  apple,temporal-filter:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Firmware temporal-filter strength selected for the attached sensor.

  sensor-presets:
    type: object
    description:
      Sensor firmware presets and the host output geometry associated with them.
    patternProperties:
      "^preset[0-9]+$":
        type: object
        properties:
          apple,config-index:
            $ref: /schemas/types.yaml#/definitions/uint32
            description: Sensor configuration index understood by the firmware
          apple,input-size:
            $ref: /schemas/types.yaml#/definitions/uint32-array
            items:
              - description: Input width in pixels
              - description: Input height in pixels
            description: Sensor input dimensions
          apple,output-size:
            $ref: /schemas/types.yaml#/definitions/uint32-array
            items:
              - description: Output width in pixels
              - description: Output height in pixels
            description: Delivered frame dimensions
          apple,crop:
            $ref: /schemas/types.yaml#/definitions/uint32-array
            items:
              - description: Horizontal crop origin in pixels
              - description: Vertical crop origin in pixels
              - description: Crop width in pixels
              - description: Crop height in pixels
            description: Cropped sensor rectangle
        required:
          - apple,config-index
          - apple,input-size
          - apple,output-size
          - apple,crop
        additionalProperties: false
    additionalProperties: false

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - iommus
  - power-domains
  - apple,dart-vm-size

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: apple,t6041-isp
    then:
      properties:
        power-domains:
          items:
            - description: ISP system domain
            - description: ISP CPU domain
            - description: ISP FE domain
            - description: ISP DPRX domain
            - description: ISP secure domain
            - description: ISP BE domain
            - description: ISP CLR domain
            - description: Camera sensor domain
        memory-region:
          minItems: 3
        memory-region-names:
          items:
            - const: text
            - const: data
            - const: heap
      required:
        - memory-region
        - memory-region-names
        - apple,platform-id
        - sensor-presets
    else:
      properties:
        memory-region:
          maxItems: 1
        memory-region-names:
          items:
            - const: heap
  - if:
      not:
        properties:
          status:
            const: disabled
        required:
          - status
    then:
      required:
        - memory-region
        - memory-region-names
        - apple,platform-id
        - sensor-presets

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        isp@580000000 {
            compatible = "apple,t6041-isp", "apple,isp";
            reg = <0x5 0x80000000 0x0 0x1604000>,
                  <0x5 0x82924000 0x0 0x40>,
                  <0x5 0x829241d0 0x0 0x20>,
                  <0x5 0x82924464 0x0 0x10>;
            reg-names = "coproc", "mbox", "gpio", "mbox2";
            interrupt-parent = <&aic>;
            interrupts = <AIC_IRQ 0x286 IRQ_TYPE_LEVEL_HIGH>;
            iommus = <&isp_dart0 0>, <&isp_dart1 0>, <&isp_dart2 0>;
            power-domains = <&ps_isp_sys>, <&ps_isp_cpu>, <&ps_isp_fe>,
                            <&ps_isp_dprx>, <&ps_isp_secure>, <&ps_isp_be>,
                            <&ps_isp_clr>, <&ps_ispsens0>;
            memory-region = <&isp_fw_text>, <&isp_fw_data>, <&isp_heap>;
            memory-region-names = "text", "data", "heap";
            apple,dart-vm-size = /bits/ 64 <0xde600000>;
            apple,platform-id = <5>;
            apple,cam-connections-scheme = <0x10>;

            sensor-presets {
                preset0 {
                    apple,config-index = <5>;
                    apple,input-size = <1920 2160>;
                    apple,output-size = <1920 1080>;
                    apple,crop = <0 0 1920 1080>;
                };
            };
        };
    };
