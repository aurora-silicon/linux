%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,isp-secure-proxy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple secure image processor proxy apertures

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Secure image processor proxy register apertures. They are distinct from
  the non-secure image processor and remain owned by firmware.

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,t8152-isp-secure-proxy
          - const: apple,isp-secure-proxy
      - items:
          - const: apple,t8140-isp-secure-proxy
          - const: apple,isp-secure-proxy

  reg:
    minItems: 3
    maxItems: 3
    description: Register apertures in hardware-description order.

required:
  - compatible
  - reg

additionalProperties: false
