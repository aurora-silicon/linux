%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,m2-prores.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M2 generation ProRes codec

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  ProRes codec resources on M2 generation SoCs. The register apertures
  follow hardware resource order. Firmware configuration and tuning are
  supplied by the bootloader and are not part of this binding. Unqualified
  instances must remain disabled.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6020-prores
          - apple,t6021-prores
          - apple,t6022-prores
          - apple,t8112-prores
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t6020-prores
          - apple,t6021-prores
          - apple,t6022-prores
          - apple,t8112-prores
      - const: apple,prores

  reg:
    maxItems: 2

  interrupts:
    minItems: 1
    maxItems: 2

  iommus:
    minItems: 1
    maxItems: 2

  power-domains:
    minItems: 1
    maxItems: 2

required:
  - compatible
  - reg
  - interrupts
  - iommus
  - power-domains

additionalProperties: false
