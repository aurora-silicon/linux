%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,jpeg.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Silicon JPEG codec

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  Apple Silicon JPEG engines are directly programmed memory-to-memory codecs.
  Each engine has a dedicated interrupt and DART stream. Multiple engines can
  share a power domain. The power controller manages the gate; no separate
  clock or firmware interface is required.

  On T6041 the DMA window reserves one 4 GiB slice of the DART high alias for
  the engine's 32-bit buffer pointer registers. T8140 engines take 64-bit
  buffer addresses and use their DART's full window.

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - apple,t6041-jpeg
              - apple,t8140-jpeg
      required:
        - compatible
    -
      properties:
        compatible:
          allOf:
            -
              contains:
                enum:
                  - apple,t8142-jpeg
                  - apple,t8152-jpeg
                  - apple,t6050-jpeg
            -
              contains:
                const: apple,jpeg
      required:
        - compatible
properties:
  compatible: true

  reg: true

  interrupts: true

  iommus: true

  power-domains: true

  power-domain-names: true

  apple,dma-range:
    $ref: /schemas/types.yaml#/definitions/uint64-array
    items:
      - const: 0x10000000000
      - const: 0x100000000
    description: Device-visible DMA window, as a 64-bit base and size.
      Only for engines with 32-bit buffer pointers.

# The root declares the union of property types for DTB decoding. The
# conditional variants below each retain their closed property contract.
additionalProperties: true

allOf:
  -
    if:
      anyOf:
        -
          properties:
            compatible:
              allOf:
                -
                  contains:
                    enum:
                      - apple,t8142-jpeg
                      - apple,t8152-jpeg
                      - apple,t6050-jpeg
                -
                  contains:
                    const: apple,jpeg
            status:
              const: disabled
          required:
            - compatible
            - status
          not:
            required:
              - mboxes
    then:
      oneOf:
        -
          type: object
          description: |
            Apple jpeg codec and shared register windows. Initial resource description for an
            unsupported firmware/backend layout. Register, IRQ and DMA topology can be recorded before a
            driver exists. This form must stay disabled; it does not substitute for the enabled driver
            contract or supply firmware, calibration, programming sequences or unresolved providers.
          properties:
            compatible:
              items:
                -
                  enum:
                    - apple,t8142-jpeg
                    - apple,t8152-jpeg
                    - apple,t6050-jpeg
                -
                  const: apple,jpeg
            status:
              const: disabled
            reg:
              description: |
                Register apertures of the complete hardware complex, in hardware interface order.
              minItems: 1
              maxItems: 2
            interrupts:
              description: Interrupt lines wired to the system interrupt controller.
              maxItems: 1
            iommus:
              description: DMA translation streams emitted by this hardware.
              maxItems: 1
            power-domains:
              description: Physical power and combined clock-gate dependencies.
              minItems: 1
              maxItems: 8
          required:
            - compatible
            - reg
            - status
          additionalProperties: false
    else:
      $ref: "#/$defs/legacy-driver"

$defs:
  legacy-driver:
    type: object
    properties:
      compatible:
        enum:
          - apple,t6041-jpeg
          - apple,t8140-jpeg

      reg:
        maxItems: 1

      interrupts:
        maxItems: 1

      iommus:
        maxItems: 1

      power-domains:
        minItems: 1
        items:
          - description: The engine's power domain
          - description: Performance request held while the engine works

      power-domain-names:
        minItems: 1
        items:
          - const: core
          - const: perf

      apple,dma-range:
        $ref: /schemas/types.yaml#/definitions/uint64-array
        items:
          - const: 0x10000000000
          - const: 0x100000000
        description: Device-visible DMA window, as a 64-bit base and size.
          Only for engines with 32-bit buffer pointers.
    required:
      - compatible
      - reg
      - interrupts
      - iommus
      - power-domains
    allOf:
      - if:
          properties:
            compatible:
              const: apple,t6041-jpeg
        then:
          required:
            - apple,dma-range
        else:
          properties:
            apple,dma-range: false
    additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        jpeg@487000000 {
            compatible = "apple,t6041-jpeg";
            reg = <0x4 0x87000000 0x0 0x4000>;
            interrupt-parent = <&aic>;
            interrupts = <AIC_IRQ 1538 IRQ_TYPE_LEVEL_HIGH>;
            iommus = <&jpeg0_dart 0>;
            power-domains = <&ps_jpg>;
            apple,dma-range = /bits/ 64 <0x10000000000 0x100000000>;
            status = "disabled";
        };
    };
