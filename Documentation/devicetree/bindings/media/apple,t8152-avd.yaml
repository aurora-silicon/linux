%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,t8152-avd.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8152 Kopsia video decoder

maintainers:
  - Thomas Glanzmann <thomas@glanzmann.de>

description:
  Kopsia is the T8152 stateless video decoder. Its decoder, PIODMA and
  auxiliary data streams share a Gen3 DART and a PSD power domain. The host
  submits codec programs with the MCU halted and polls decoder status;
  the PostOffice mailbox transport is not used by this implementation.

properties:
  compatible:
    const: apple,t8152-avd

  reg:
    items:
      - description: MCU code memory
      - description: MCU control registers
      - description: Decoder control registers
      - description: Decoder wrapper registers
      - description: PIODMA registers

  reg-names:
    items:
      - const: code
      - const: mbox
      - const: ctrl
      - const: wrap
      - const: dma

  iommus:
    items:
      - description: Decoder stream
      - description: PIODMA stream
      - description: Auxiliary data stream

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - reg-names
  - iommus
  - power-domains

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        video-codec@485400000 {
            compatible = "apple,t8152-avd";
            reg = <0x4 0x85400000 0x0 0x12000>,
                  <0x4 0x85500000 0x0 0x4000>,
                  <0x4 0x85100000 0x0 0x10000>,
                  <0x4 0x850c0000 0x0 0x4000>,
                  <0x4 0x85070000 0x0 0x4000>;
            reg-names = "code", "mbox", "ctrl", "wrap", "dma";
            iommus = <&avd_dart 0>, <&avd_dart 1>, <&avd_dart 2>;
            power-domains = <&ps_avd>;
        };
    };
