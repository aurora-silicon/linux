%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,t6041-prores.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T6041 ProRes engine

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  T6041 APR engine, wrapper and auxiliary register banks. This resource
  layout is distinct from the T8140 APR binding and must not select that
  generation's driver.

select:
  properties:
    compatible:
      contains:
        const: apple,t6041-prores
  required:
    - compatible

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,t6041-prores
          - const: apple,prores

  reg:
    minItems: 3
    maxItems: 3
    description: Register apertures in hardware-description order.

  interrupts:
    minItems: 1
    maxItems: 1

  power-domains:
    minItems: 1
    maxItems: 1

  iommus:
    minItems: 1
    maxItems: 1

  resets:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - power-domains
  - resets
  - iommus

additionalProperties: false
