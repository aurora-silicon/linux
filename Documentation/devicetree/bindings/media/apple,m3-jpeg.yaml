%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,m3-jpeg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M3 family JPEG codec

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the M3 family JPEG codec.
  The interface is described for discovery and must remain disabled until
  its ownership, initialization and shutdown are supported. Register windows
  are listed in hardware resource order; firmware configuration and tuning
  data are supplied by the boot firmware rather than this binding.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t8122-jpeg
          - apple,t6030-jpeg
          - apple,t6031-jpeg
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t8122-jpeg
          - apple,t6030-jpeg
          - apple,t6031-jpeg
      - const: apple,jpeg

  reg:
    minItems: 1
    maxItems: 1

  interrupts:
    minItems: 1
    maxItems: 1

  power-domains:
    minItems: 1
    maxItems: 1

  iommus:
    minItems: 1
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - power-domains
  - iommus

additionalProperties: false
