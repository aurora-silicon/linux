%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,prores.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Silicon ProRes codec (APR)

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  The APR is a directly programmed ProRes engine with its own DART. Jobs are
  descriptors in a DMA ring; the engine signals completion with an
  interrupt. It has no firmware. Its power domain also resets it.

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - apple,t8140-prores
      required:
        - compatible
    -
      properties:
        compatible:
          allOf:
            -
              contains:
                enum:
                  - apple,t8142-prores
                  - apple,t8152-prores
                  - apple,t6050-prores
            -
              contains:
                const: apple,prores
      required:
        - compatible
properties:
  compatible: true

  reg: true

  reg-names: true

  interrupts: true

  iommus: true

  power-domains: true

  power-domain-names: true

  resets: true

# The root declares the union of property types for DTB decoding. The
# conditional variants below each retain their closed property contract.
additionalProperties: true

allOf:
  -
    if:
      anyOf:
        -
          properties:
            compatible:
              allOf:
                -
                  contains:
                    enum:
                      - apple,t8142-prores
                      - apple,t8152-prores
                      - apple,t6050-prores
                -
                  contains:
                    const: apple,prores
            status:
              const: disabled
          required:
            - compatible
            - status
          not:
            required:
              - mboxes
    then:
      oneOf:
        -
          type: object
          description: |
            Apple prores codec complex. Initial resource description for an unsupported firmware/backend
            layout. Register, IRQ and DMA topology can be recorded before a driver exists. This form
            must stay disabled; it does not substitute for the enabled driver contract or supply
            firmware, calibration, programming sequences or unresolved providers.
          properties:
            compatible:
              items:
                -
                  enum:
                    - apple,t8142-prores
                    - apple,t8152-prores
                    - apple,t6050-prores
                -
                  const: apple,prores
            status:
              const: disabled
            reg:
              description: |
                Register apertures of the complete hardware complex, in hardware interface order.
              minItems: 5
              maxItems: 5
            interrupts:
              description: Interrupt lines wired to the system interrupt controller.
              minItems: 2
              maxItems: 2
            iommus:
              description: DMA translation streams emitted by this hardware.
              maxItems: 1
          required:
            - compatible
            - reg
            - status
          additionalProperties: false
    else:
      $ref: "#/$defs/legacy-driver"

$defs:
  legacy-driver:
    type: object
    properties:
      compatible:
        const: apple,t8140-prores

      reg:
        items:
          - description: Engine registers
          - description: Wrapper registers

      reg-names:
        items:
          - const: core
          - const: wrapper

      interrupts:
        minItems: 1
        maxItems: 2

      iommus:
        maxItems: 1

      power-domains:
        minItems: 1
        items:
          - description: The engine's power domain
          - description: Performance request held while the engine works

      power-domain-names:
        minItems: 1
        items:
          - const: core
          - const: perf

      resets:
        maxItems: 1
    required:
      - compatible
      - reg
      - reg-names
      - interrupts
      - iommus
      - power-domains
    additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        video-codec@295000000 {
            compatible = "apple,t8140-prores";
            reg = <0x2 0x95000000 0x0 0x4000>,
                  <0x2 0x94000000 0x0 0x8000>;
            reg-names = "core", "wrapper";
            interrupt-parent = <&aic>;
            interrupts = <AIC_IRQ 1260 IRQ_TYPE_LEVEL_HIGH>,
                         <AIC_IRQ 1259 IRQ_TYPE_LEVEL_HIGH>;
            iommus = <&apr_dart 0>;
            power-domains = <&ps_prores>;
            resets = <&ps_prores>;
        };
    };
