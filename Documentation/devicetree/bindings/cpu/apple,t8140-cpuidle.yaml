%YAML 1.2
---
$id: http://devicetree.org/schemas/cpu/apple,t8140-cpuidle.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8140 CPU idle controller

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description:
  Selects the Apple CPU idle driver on T8140 systems. Only the WFI
  clock-gated state is supported; CPU and cluster power-down states
  are not enabled on this SoC.

properties:
  $nodename:
    const: cpuidle

  compatible:
    const: apple,t8140-cpuidle

required:
  - compatible

additionalProperties: false

examples:
  - |
    cpuidle {
        compatible = "apple,t8140-cpuidle";
    };
