%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/apple,aic-timebase.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple AIC timebase

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  The timebase register aperture associated with the interrupt controller.

properties:
  compatible:
    items:
      - enum:
          - apple,t6000-aic-timebase
          - apple,t6020-aic-timebase
          - apple,t6021-aic-timebase
          - apple,t6022-aic-timebase
          - apple,t6041-aic-timebase
          - apple,t6050-aic-timebase
          - apple,t8103-aic-timebase
          - apple,t8112-aic-timebase
          - apple,t8142-aic-timebase
          - apple,t8152-aic-timebase
      - const: apple,aic-timebase

  reg:
    maxItems: 1
    description: Register apertures in hardware-description order.

required:
  - compatible
  - reg

additionalProperties: false
