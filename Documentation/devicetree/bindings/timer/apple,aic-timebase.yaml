%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/apple,aic-timebase.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple AIC timebase

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  The timebase register aperture associated with the interrupt controller.

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - apple,aic-timebase
              - apple,t6000-aic-timebase
              - apple,t6020-aic-timebase
              - apple,t6021-aic-timebase
              - apple,t6022-aic-timebase
              - apple,t6041-aic-timebase
              - apple,t8103-aic-timebase
              - apple,t8112-aic-timebase
              - apple,t8142-aic-timebase
              - apple,t8152-aic-timebase
      required:
        - compatible
    -
      properties:
        compatible:
          items:
            -
              const: apple,t6050-aic-timebase
            -
              const: apple,aic-timebase
      required:
        - compatible

properties:
  compatible: true
  reg: true
  interrupts: true
  iommus: true
  power-domains: true
  clocks: true
  resets: true
  status: true

additionalProperties: true

allOf:
  - if:
      anyOf:
        -
          properties:
            compatible:
              items:
                -
                  const: apple,t6050-aic-timebase
                -
                  const: apple,aic-timebase
            status:
              const: disabled
          required:
            - compatible
            - status
    then:
      oneOf:
        -
          description: |
            T6050 native resource description. Firmware ownership, backend support and enables require
            separate qualification. This variant remains disabled and contains no programming sequences or
            firmware data.
          properties:
            compatible:
              items:
                -
                  const: apple,t6050-aic-timebase
                -
                  const: apple,aic-timebase
            status:
              const: disabled
            reg:
              maxItems: 1
              description: |
                Native register apertures in hardware-interface order, including shared auxiliary views.
          required:
            - compatible
            - reg
            - status
          additionalProperties: false
    else:
      properties:
        compatible:
          items:
            - enum:
                - apple,t6000-aic-timebase
                - apple,t6020-aic-timebase
                - apple,t6021-aic-timebase
                - apple,t6022-aic-timebase
                - apple,t6041-aic-timebase
                - apple,t8103-aic-timebase
                - apple,t8112-aic-timebase
                - apple,t8142-aic-timebase
                - apple,t8152-aic-timebase
            - const: apple,aic-timebase

        reg:
          maxItems: 1
          description: Register apertures in hardware-description order.
      required:
        - compatible
        - reg
      additionalProperties: false
