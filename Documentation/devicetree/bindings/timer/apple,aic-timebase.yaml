%YAML 1.2
---
$id: "http://devicetree.org/schemas/timer/apple,aic-timebase.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"
title: "Apple interrupt controller timebase"
maintainers:
  - "Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>"
select:
  properties:
    compatible:
      allOf:
        -
          contains:
            enum:
              - "apple,t8142-aic-timebase"
              - "apple,t8152-aic-timebase"
              - "apple,t6050-aic-timebase"
        -
          contains:
            const: "apple,aic-timebase"
  required:
    - "compatible"
description: "Apple interrupt controller timebase. Initial resource description for an unsupported firmware/backend layout. Register, IRQ and DMA topology can be recorded before a driver exists. This form must stay disabled; it does not substitute for the enabled driver contract or supply firmware, calibration, programming sequences or unresolved providers."
properties:
  compatible:
    items:
      -
        enum:
          - "apple,t8142-aic-timebase"
          - "apple,t8152-aic-timebase"
          - "apple,t6050-aic-timebase"
      -
        const: "apple,aic-timebase"
  status:
    const: "disabled"
  reg:
    description: "Register apertures of the complete hardware complex, in hardware interface order."
    maxItems: 1
required:
  - "compatible"
  - "reg"
  - "status"
additionalProperties: false
