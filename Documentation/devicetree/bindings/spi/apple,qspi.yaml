%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/apple,qspi.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple ARM SoC QSPIMC controller

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  Apple QSPIMC is a SPI-memory-only controller with a packed command FIFO.
  It is distinct from the ordinary Apple SPIMC controller despite serving a
  similar set of SPI NOR devices.

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - "apple,qspi"
              - "apple,t6030-qspi"
              - "apple,t6031-qspi"
              - "apple,t6041-qspi"
              - "apple,t6050-qspi"
              - "apple,t8122-qspi"
              - "apple,t8132-qspi"
              - "apple,t8140-qspi"
              - "apple,t8152-qspi"
      required:
        - "compatible"
    -
      properties:
        compatible:
          items:
            -
              const: "apple,t6050-qspi"
            -
              const: "apple,qspi"
      required:
        - "compatible"

properties:
  compatible: true
  reg: true
  clocks: true
  interrupts: true
  power-domains: true
  iommus: true
  resets: true
  status: true

allOf:
  - if:
      anyOf:
        -
          properties:
            compatible:
              items:
                -
                  const: "apple,t6050-qspi"
                -
                  const: "apple,qspi"
            status:
              const: "disabled"
          required:
            - "compatible"
            - "status"
    then:
      oneOf:
        -
          description: "T6050 native resource description. Firmware ownership, backend support and enables require separate qualification. This variant remains disabled and contains no programming sequences or firmware data."
          properties:
            compatible:
              items:
                -
                  const: "apple,t6050-qspi"
                -
                  const: "apple,qspi"
            status:
              const: "disabled"
            reg:
              minItems: 2
              maxItems: 2
              description: "Native register apertures in hardware-interface order, including shared auxiliary views."
            interrupts:
              maxItems: 1
            power-domains:
              maxItems: 1
            clocks:
              maxItems: 1
          required:
            - "compatible"
            - "reg"
            - "status"
            - "interrupts"
            - "power-domains"
            - "clocks"
          additionalProperties: false
    else:
      allOf:
        - $ref: spi-controller.yaml#
      properties:
        compatible:
          oneOf:
            - enum:
                - apple,t8122-qspi
                - apple,t8132-qspi
                - apple,t6041-qspi
                - apple,t8140-qspi
            - items:
                - enum:
                    - apple,t6030-qspi
                    - apple,t6031-qspi
                    - apple,t8122-qspi
                - const: apple,qspi
            - items:
                - enum:
                    - apple,t6050-qspi
                    - apple,t8152-qspi
                - const: apple,t8140-qspi

        reg:
          maxItems: 1

        clocks:
          maxItems: 1

        interrupts:
          maxItems: 1

        power-domains:
          maxItems: 1
      required:
        - compatible
        - reg
        - clocks
        - interrupts
      unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      spi@385110000 {
        compatible = "apple,t8140-qspi";
        reg = <0x3 0x85110000 0x0 0x4800>;
        interrupt-parent = <&aic>;
        interrupts = <AIC_IRQ 1106 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clk_200m>;
        #address-cells = <1>;
        #size-cells = <0>;
      };
    };
