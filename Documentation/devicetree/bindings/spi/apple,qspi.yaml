%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/apple,qspi.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple ARM SoC QSPIMC controller

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  Apple QSPIMC is a SPI-memory-only controller with a packed command FIFO.
  It is distinct from the ordinary Apple SPIMC controller despite serving a
  similar set of SPI NOR devices.

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - apple,t6041-qspi
              - apple,t6050-qspi
              - apple,t8122-qspi
              - apple,t8132-qspi
              - apple,t8140-qspi
              - apple,t8152-qspi
      required:
        - compatible
    -
      properties:
        compatible:
          allOf:
            -
              contains:
                enum:
                  - apple,t8142-qspi
                  - apple,t8152-qspi
            -
              contains:
                const: apple,qspi
      required:
        - compatible
properties:
  compatible: true

  reg: true

  clocks: true

  interrupts: true

  power-domains: true

# The root declares the union of property types for DTB decoding. The
# conditional variants below each retain their closed property contract.
additionalProperties: true

allOf:
  -
    if:
      anyOf:
        -
          properties:
            compatible:
              allOf:
                -
                  contains:
                    enum:
                      - apple,t8142-qspi
                      - apple,t8152-qspi
                -
                  contains:
                    const: apple,qspi
            status:
              const: disabled
          required:
            - compatible
            - status
          not:
            required:
              - mboxes
    then:
      oneOf:
        -
          type: object
          description: |
            Apple quad spi controller and pin interface. Initial resource description for an unsupported
            firmware/backend layout. Register, IRQ and DMA topology can be recorded before a driver
            exists. This form must stay disabled; it does not substitute for the enabled driver contract
            or supply firmware, calibration, programming sequences or unresolved providers.
          properties:
            compatible:
              items:
                -
                  enum:
                    - apple,t8142-qspi
                    - apple,t8152-qspi
                -
                  const: apple,qspi
            status:
              const: disabled
            reg:
              description: |
                Register apertures of the complete hardware complex, in hardware interface order.
              minItems: 2
              maxItems: 2
            interrupts:
              description: Interrupt lines wired to the system interrupt controller.
              maxItems: 1
            power-domains:
              description: Power and combined clock gates required by this hardware.
              maxItems: 1
          required:
            - compatible
            - reg
            - status
          additionalProperties: false
    else:
      $ref: "#/$defs/legacy-driver"

$defs:
  legacy-driver:
    type: object
    allOf:
      - $ref: spi-controller.yaml#
    properties:
      compatible:
        oneOf:
          - enum:
              - apple,t8122-qspi
              - apple,t8132-qspi
              - apple,t6041-qspi
              - apple,t8140-qspi
          - items:
              - enum:
                  - apple,t6050-qspi
                  - apple,t8152-qspi
              - const: apple,t8140-qspi

      reg:
        maxItems: 1

      clocks:
        maxItems: 1

      interrupts:
        maxItems: 1

      power-domains:
        maxItems: 1
    required:
      - compatible
      - reg
      - clocks
      - interrupts
    unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      spi@385110000 {
        compatible = "apple,t8140-qspi";
        reg = <0x3 0x85110000 0x0 0x4800>;
        interrupt-parent = <&aic>;
        interrupts = <AIC_IRQ 1106 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clk_200m>;
        #address-cells = <1>;
        #size-cells = <0>;
      };
    };
