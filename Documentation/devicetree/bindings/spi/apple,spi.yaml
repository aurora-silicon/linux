%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/apple,spi.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple ARM SoC SPI controller

maintainers:
  - Hector Martin <marcan@marcan.st>

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - "apple,spi"
              - "apple,t6000-spi"
              - "apple,t6020-spi"
              - "apple,t6030-spi"
              - "apple,t6031-spi"
              - "apple,t6041-spi"
              - "apple,t8103-spi"
              - "apple,t8112-spi"
              - "apple,t8122-spi"
              - "apple,t8132-spi"
              - "apple,t8140-spi"
      required:
        - "compatible"
    -
      properties:
        compatible:
          items:
            -
              const: "apple,t6050-spi"
            -
              const: "apple,t8103-spi"
      required:
        - "compatible"

properties:
  compatible: true
  reg: true
  clocks: true
  interrupts: true
  power-domains: true
  iommus: true
  resets: true
  status: true

additionalProperties: true

allOf:
  - if:
      anyOf:
        -
          properties:
            compatible:
              items:
                -
                  const: "apple,t6050-spi"
                -
                  const: "apple,t8103-spi"
            status:
              const: "disabled"
          required:
            - "compatible"
            - "status"
    then:
      oneOf:
        -
          description: "T6050 native resource description. Firmware ownership, backend support and enables require separate qualification. This variant remains disabled and contains no programming sequences or firmware data."
          properties:
            compatible:
              items:
                -
                  const: "apple,t6050-spi"
                -
                  const: "apple,t8103-spi"
            status:
              const: "disabled"
            reg:
              maxItems: 1
              description: "Native register apertures in hardware-interface order, including shared auxiliary views."
            interrupts:
              maxItems: 1
            power-domains:
              maxItems: 1
            clocks:
              maxItems: 1
            "#address-cells":
              const: 1
            "#size-cells":
              const: 0
          required:
            - "compatible"
            - "reg"
            - "status"
            - "interrupts"
            - "power-domains"
            - "clocks"
            - "#address-cells"
            - "#size-cells"
          additionalProperties: false
    else:
      allOf:
        - $ref: spi-controller.yaml#
      properties:
        compatible:
          oneOf:
            - items:
                - enum:
                    - apple,t6000-spi
                    - apple,t6020-spi
                    - apple,t6030-spi
                    - apple,t6031-spi
                    - apple,t6041-spi
                    - apple,t8112-spi
                    - apple,t8122-spi
                    - apple,t8132-spi
                    - apple,t8140-spi
                - const: apple,t8103-spi
            - items:
                - enum:
                    - apple,t8103-spi
                    - apple,t8112-spi
                    - apple,t6000-spi
                - const: apple,spi

        reg:
          maxItems: 1

        clocks:
          maxItems: 1

        interrupts:
          maxItems: 1

        power-domains:
          maxItems: 1
      required:
        - compatible
        - reg
        - clocks
        - interrupts
      unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      spi@39b104000 {
        compatible = "apple,t6000-spi", "apple,spi";
        reg = <0x3 0x9b104000 0x0 0x4000>;
        interrupt-parent = <&aic>;
        interrupts = <AIC_IRQ 0 1107 IRQ_TYPE_LEVEL_HIGH>;
        #address-cells = <1>;
        #size-cells = <0>;
        clocks = <&clk>;
      };
    };
