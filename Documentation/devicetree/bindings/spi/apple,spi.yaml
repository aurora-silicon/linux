%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/apple,spi.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple ARM SoC SPI controller

maintainers:
  - Hector Martin <marcan@marcan.st>

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - apple,spi
              - apple,t6000-spi
              - apple,t6020-spi
              - apple,t6030-spi
              - apple,t6031-spi
              - apple,t6041-spi
              - apple,t8103-spi
              - apple,t8112-spi
              - apple,t8122-spi
              - apple,t8132-spi
              - apple,t8140-spi
      required:
        - compatible
    -
      properties:
        compatible:
          allOf:
            -
              contains:
                enum:
                  - apple,t8142-spi
                  - apple,t8152-spi
                  - apple,t6050-spi
            -
              contains:
                const: apple,spi
      required:
        - compatible
properties:
  compatible: true

  reg: true

  clocks: true

  interrupts: true

  power-domains: true

# The root declares the union of property types for DTB decoding. The
# conditional variants below each retain their closed property contract.
additionalProperties: true

allOf:
  -
    if:
      anyOf:
        -
          properties:
            compatible:
              allOf:
                -
                  contains:
                    enum:
                      - apple,t8142-spi
                      - apple,t8152-spi
                      - apple,t6050-spi
                -
                  contains:
                    const: apple,spi
            status:
              const: disabled
          required:
            - compatible
            - status
          not:
            required:
              - mboxes
    then:
      oneOf:
        -
          type: object
          description: |
            Apple spi controller. Initial resource description for an unsupported firmware/backend
            layout. Register, IRQ and DMA topology can be recorded before a driver exists. This form
            must stay disabled; it does not substitute for the enabled driver contract or supply
            firmware, calibration, programming sequences or unresolved providers.
          properties:
            compatible:
              items:
                -
                  enum:
                    - apple,t8142-spi
                    - apple,t8152-spi
                    - apple,t6050-spi
                -
                  const: apple,spi
            status:
              const: disabled
            reg:
              description: |
                Register apertures of the complete hardware complex, in hardware interface order.
              maxItems: 1
            interrupts:
              description: Interrupt lines wired to the system interrupt controller.
              maxItems: 1
            power-domains:
              description: Power and combined clock gates required by this hardware.
              maxItems: 1
          required:
            - compatible
            - reg
            - status
          additionalProperties: false
    else:
      $ref: "#/$defs/legacy-driver"

$defs:
  legacy-driver:
    type: object
    allOf:
      - $ref: spi-controller.yaml#
    properties:
      compatible:
        oneOf:
          - items:
              - enum:
                  - apple,t6020-spi
                  - apple,t6030-spi
                  - apple,t6031-spi
                  - apple,t6041-spi
                  - apple,t8122-spi
                  - apple,t8132-spi
                  - apple,t8140-spi
              - const: apple,t8103-spi
          - items:
              - enum:
                  - apple,t8103-spi
                  - apple,t8112-spi
                  - apple,t6000-spi
              - const: apple,spi

      reg:
        maxItems: 1

      clocks:
        maxItems: 1

      interrupts:
        maxItems: 1

      power-domains:
        maxItems: 1
    required:
      - compatible
      - reg
      - clocks
      - interrupts
    unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      spi@39b104000 {
        compatible = "apple,t6000-spi", "apple,spi";
        reg = <0x3 0x9b104000 0x0 0x4000>;
        interrupt-parent = <&aic>;
        interrupts = <AIC_IRQ 0 1107 IRQ_TYPE_LEVEL_HIGH>;
        #address-cells = <1>;
        #size-cells = <0>;
        clocks = <&clk>;
      };
    };
