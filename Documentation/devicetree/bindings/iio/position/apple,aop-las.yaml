%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/position/apple,aop-las.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple AOP lid angle sensor service

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  The service is supplied by the parent Always-On Processor. Firmware and
  calibration handoff determine its availability. It has no independent
  application-processor register window or interrupt.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6020-aop-las
          - apple,t6050-aop-las
          - apple,t8112-aop-las
          - apple,t8142-aop-las
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t6020-aop-las
          - apple,t6050-aop-las
          - apple,t8112-aop-las
          - apple,t8142-aop-las
      - const: apple,aop-las

required:
  - compatible

additionalProperties: false
