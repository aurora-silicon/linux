%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/light/apple,t8140-aop-als.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8140 AOP ambient light sensor

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description:
  Ambient light measurements are reported by a service of the Always-On
  Processor. This child node identifies that service; it has no separate
  application-processor MMIO or interrupt resource. Machine calibration is
  supplied separately through the firmware loader, not inline in this node.

select:
  properties:
    compatible:
      contains:
        const: apple,t8140-aop-als
  required:
    - compatible

properties:
  compatible:
    items:
      - const: apple,t8140-aop-als
      - const: apple,aop-als

required:
  - compatible

additionalProperties: false
