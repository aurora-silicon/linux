%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/light/apple,t8140-aop-als.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8140 AOP ambient light sensor

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description:
  Ambient light measurements are reported by a service of the Always-On
  Processor. This child node identifies that service; it has no separate
  application-processor MMIO or interrupt resource. Machine calibration is
  supplied separately through the firmware loader, not inline in this node.

  The AOP firmware does not start the sensor until the application processor
  has handed it the sensor's calibration over the AOP's setup-port mailbox.
  The calibration is an 80-byte message that is specific to the machine and
  is not part of the operating system; the machine's own firmware sends the
  same message to the AOP.

select:
  properties:
    compatible:
      contains:
        const: apple,t8140-aop-als
  required:
    - compatible

properties:
  compatible:
    items:
      - const: apple,t8140-aop-als
      - const: apple,aop-als

  firmware-name:
    maxItems: 1
    description:
      Name of the file that holds the sensor's 80-byte setup-port calibration
      message, to be loaded through the firmware loader and passed to the AOP
      unchanged. Without it the sensor stays unstarted and reports nothing.

required:
  - compatible

additionalProperties: false
