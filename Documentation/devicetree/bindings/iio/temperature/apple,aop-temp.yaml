%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/temperature/apple,aop-temp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple AOP board temperature sensor service

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  The Always-On Processor of Apple laptops reads a board temperature sensor
  and reports it through this service. The bootloader may copy per-machine
  calibration containers into the optional properties below. Their payloads
  are opaque to the operating system and are sent unchanged to the firmware.

properties:
  compatible:
    items:
      - enum:
          - apple,t6041-aop-als-temp
          - apple,t8132-aop-als-temp
      - const: apple,aop-als-temp

  apple,temp-offset-calibration:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description: Sensor offset calibration container from the bootloader.

  apple,absolute-temp-offset-cal:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description: Absolute temperature offset container from the bootloader.

  apple,absolute-temp-offset-fcm-cal:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description: Front-compensation absolute offset container.

  apple,absolute-temp-offset-bcm-cal:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description: Back-compensation absolute offset container.

required:
  - compatible

additionalProperties: false

examples:
  - |
    als-temp {
        compatible = "apple,t6041-aop-als-temp", "apple,aop-als-temp";
    };

