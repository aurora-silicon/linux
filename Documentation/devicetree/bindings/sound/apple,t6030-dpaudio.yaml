%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/apple,t6030-dpaudio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T6030 DisplayPort audio

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  The external display processor provides the HDMI port's audio service.
  Its DisplayPort audio interface has no application-processor registers.
  Samples arrive through SIO, and the graph connects this interface to
  port 0 of the display processor that owns the audio service.

select:
  properties:
    compatible:
      contains:
        const: apple,t6030-dpaudio
  required:
    - compatible

properties:
  compatible:
    items:
      - const: apple,t6030-dpaudio
      - const: apple,dpaudio

  dmas:
    maxItems: 1

  dma-names:
    const: tx

  power-domains:
    maxItems: 1

  ports:
    $ref: /schemas/graph.yaml#/properties/ports
    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description: Connection to the display processor's audio service.
    required:
      - port@0

required:
  - compatible
  - dmas
  - dma-names
  - power-domains
  - ports

additionalProperties: false
