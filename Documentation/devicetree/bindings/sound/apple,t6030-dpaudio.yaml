%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/apple,t6030-dpaudio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple DisplayPort audio

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  The external display processor provides a DisplayPort/HDMI audio service.
  Its DisplayPort audio interface has no application-processor registers.
  Samples arrive through SIO, and the graph connects this interface to
  port 0 of the display processor that owns the audio service.

  Unrouted interfaces can be described disabled without inventing an audio
  connection to a display processor. A route is required before enabling.

  Existing T8112 descriptions also identify a register window which the
  firmware audio transport does not program directly.

  T6041 and T8140 interfaces remain disabled until a generation-specific SIO firmware
  backend and loader handoff are available and display audio is qualified.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6030-dpaudio
          - apple,t6041-dpaudio
          - apple,t8140-dpaudio
          - apple,t8112-dpaudio
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t6030-dpaudio
          - apple,t6041-dpaudio
          - apple,t8140-dpaudio
          - apple,t8112-dpaudio
      - const: apple,dpaudio

  reg:
    maxItems: 1

  dmas:
    maxItems: 1

  dma-names:
    const: tx

  power-domains:
    maxItems: 1

  ports:
    $ref: /schemas/graph.yaml#/properties/ports
    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description: Connection to the display processor's audio service.
    required:
      - port@0

required:
  - compatible
  - dmas
  - dma-names
  - power-domains

allOf:
  - if:
      not:
        properties:
          status:
            const: disabled
        required:
          - status
    then:
      required:
        - ports

  - if:
      properties:
        compatible:
          contains:
            enum: ["apple,t6030-dpaudio", "apple,t6041-dpaudio"]
    then:
      properties:
        reg: false

additionalProperties: false
