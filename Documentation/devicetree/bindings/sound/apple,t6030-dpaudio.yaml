%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/apple,t6030-dpaudio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple DisplayPort audio

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  The external display processor provides a DisplayPort/HDMI audio service.
  Samples arrive through SIO, and the graph connects this interface to
  port 0 of the display processor that owns the audio service.

  T6030 and T6041 interfaces have no application-processor registers.
  Existing T8112 device trees also identify a register window; the firmware
  audio transport does not program that window directly.

  T6041 interfaces remain disabled until a generation-specific SIO firmware
  backend and loader handoff are available and display audio is qualified.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6030-dpaudio
          - apple,t6041-dpaudio
          - apple,t8112-dpaudio
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t6030-dpaudio
          - apple,t6041-dpaudio
          - apple,t8112-dpaudio
      - const: apple,dpaudio

  reg:
    maxItems: 1

  dmas:
    maxItems: 1

  dma-names:
    const: tx

  power-domains:
    maxItems: 1

  ports:
    $ref: /schemas/graph.yaml#/properties/ports
    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description: Connection to the display processor's audio service.
    required:
      - port@0

required:
  - compatible
  - dmas
  - dma-names
  - power-domains
  - ports

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - apple,t6030-dpaudio
              - apple,t6041-dpaudio
    then:
      properties:
        reg: false

additionalProperties: false

examples:
  - |
    audio-controller {
        compatible = "apple,t8112-dpaudio", "apple,dpaudio";
        dmas = <&sio 0x66>;
        dma-names = "tx";
        power-domains = <&ps_dpa1>;

        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;

                endpoint {
                    remote-endpoint = <&dcpext_audio>;
                };
            };
        };
    };
