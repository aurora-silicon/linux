%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/apple,smc-mogul.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SMC Mogul control endpoint

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Mogul control endpoint published below the SMC firmware node. Its
  control address belongs to the SMC-mediated peripheral namespace and
  must not be interpreted as an AP physical address.

properties:
  compatible:
    items:
      - enum:
          - apple,t8140-smc-mogul
      - const: apple,smc-mogul

  apple,smc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: SMC firmware transport provider.

  apple,control-address:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Peripheral address in the SMC-mediated control namespace.

required:
  - compatible
  - apple,smc
  - apple,control-address

additionalProperties: false
