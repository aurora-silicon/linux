%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/apple,audio-firmware-services.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple firmware audio service endpoints

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Firmware audio services published separately from the active sound card.
  These endpoints identify voice-trigger, loopback, low-power microphone,
  shared microphone buffer and listening clients. A service has no AP MMIO
  aperture. DMA references describe ADMAC channel ownership, not permission
  to reset a firmware-owned audio fabric or start an audio stream.
  These endpoints remain disabled until their host client and ownership
  protocol have been qualified. No acoustic tuning or buffer contents are
  static hardware properties.

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,t6041-audio-leap-loopback
          - const: apple,audio-leap-loopback
      - items:
          - const: apple,t6041-audio-listening-client
          - const: apple,audio-listening-client
      - items:
          - const: apple,t6041-audio-low-power-mic
          - const: apple,audio-low-power-mic
      - items:
          - const: apple,t6041-audio-mca-loopback
          - const: apple,audio-mca-loopback
      - items:
          - const: apple,t6041-audio-mic-buffer
          - const: apple,audio-mic-buffer
      - items:
          - const: apple,t6041-audio-voice-trigger
          - const: apple,audio-voice-trigger
      - items:
          - const: apple,t8140-audio-leap-loopback
          - const: apple,audio-leap-loopback
      - items:
          - const: apple,t8140-audio-listening-client
          - const: apple,audio-listening-client
      - items:
          - const: apple,t8140-audio-low-power-mic
          - const: apple,audio-low-power-mic
      - items:
          - const: apple,t8140-audio-mca-loopback
          - const: apple,audio-mca-loopback
      - items:
          - const: apple,t8140-audio-mic-buffer
          - const: apple,audio-mic-buffer
      - items:
          - const: apple,t8140-audio-mic-injection
          - const: apple,audio-mic-injection
      - items:
          - const: apple,t8140-audio-speaker-tap
          - const: apple,audio-speaker-tap
      - items:
          - const: apple,t8140-audio-voice-trigger
          - const: apple,audio-voice-trigger

  dmas:
    minItems: 1
    maxItems: 2

  iommus:
    minItems: 1
    maxItems: 2

required:
  - compatible

additionalProperties: false
