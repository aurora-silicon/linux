%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/apple,aop-audio.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple AOP audio service

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  The service is supplied by the parent Always-On Processor. Firmware and
  calibration handoff determine its availability. It has no independent
  application-processor register window or interrupt.

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - apple,t6020-aop-audio
              - apple,t8112-aop-audio
      required:
        - compatible
    -
      properties:
        compatible:
          contains:
            const: apple,t6050-aop-audio
      required:
        - compatible

properties:
  "compatible": true
  dmas: true
  dma-names: true
    const: dma
  apple,chassis-name:
    $ref: /schemas/types.yaml#/definitions/string
    description: Board family used to identify the audio configuration.
  apple,machine-kind:
    $ref: /schemas/types.yaml#/definitions/string
    description: Machine family used for the sound card identity.
  "#sound-dai-cells": true

additionalProperties: true

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: apple,t6050-aop-audio
      required:
        - compatible
    then:
      properties:
        compatible:
          oneOf:
            -
              const: apple,t6050-aop-audio
            -
              items:
                -
                  const: apple,t6050-aop-audio
                -
                  const: apple,aop-audio
        dmas:
          minItems: 4
          maxItems: 4
        dma-names:
          items:
            -
              const: cout
            -
              const: cin
            -
              const: spkr
            -
              const: sense
        "#sound-dai-cells":
          const: 1
      required:
        - compatible
        - dmas
        - dma-names
        - "#sound-dai-cells"
      additionalProperties: false
    else:
      properties:
        compatible:
          items:
            - enum:
                - apple,t6020-aop-audio
                - apple,t8112-aop-audio
            - const: apple,aop-audio

        dmas:
          maxItems: 1

        dma-names:
          const: dma

        apple,chassis-name:
          $ref: /schemas/types.yaml#/definitions/string
          description: Board family used to identify the audio configuration.

        apple,machine-kind:
          $ref: /schemas/types.yaml#/definitions/string
          description: Machine family used for the sound card identity.
      required:
        - compatible
        - dmas
        - dma-names
      additionalProperties: false
