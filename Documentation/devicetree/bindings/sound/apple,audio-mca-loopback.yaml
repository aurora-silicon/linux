%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/apple,audio-mca-loopback.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple mca loopback firmware audio service

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Firmware audio service endpoint, separate from the active sound card.
  It has no independently published AP MMIO aperture. DMA and DART
  references describe the service resources, without transferring audio
  fabric ownership or authorizing a stream to start. The endpoint remains
  disabled until its host client and ownership protocol are qualified.
  Acoustic tuning and runtime buffer contents are not static properties.

properties:
  compatible:
    items:
      - enum:
          - apple,t6041-audio-mca-loopback
          - apple,t8140-audio-mca-loopback
      - const: apple,audio-mca-loopback

  dmas:
    minItems: 2
    maxItems: 2

required:
  - compatible
  - dmas

additionalProperties: false
