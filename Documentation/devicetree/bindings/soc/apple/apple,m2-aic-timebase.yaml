%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,m2-aic-timebase.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M2 generation interrupt timebase

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Interrupt timebase resources on M2 generation SoCs. The register apertures
  follow hardware resource order. Firmware configuration and tuning are
  supplied by the bootloader and are not part of this binding. Unqualified
  instances must remain disabled.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6020-aic-timebase
          - apple,t6021-aic-timebase
          - apple,t6022-aic-timebase
          - apple,t8112-aic-timebase
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t6020-aic-timebase
          - apple,t6021-aic-timebase
          - apple,t6022-aic-timebase
          - apple,t8112-aic-timebase
      - const: apple,aic-timebase

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false
