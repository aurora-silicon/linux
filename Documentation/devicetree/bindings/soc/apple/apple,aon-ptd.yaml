%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,aon-ptd.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple always-on power telemetry interrupt router

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Always-on power telemetry register banks and upstream interrupts. The
  firmware owns the telemetry data and interrupt routing at boot.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6031-aon-ptd
          - apple,t6032-aon-ptd
          - apple,t6041-aon-ptd
          - apple,t8132-aon-ptd
          - apple,t8140-aon-ptd
          - apple,t8142-aon-ptd
          - apple,t8152-aon-ptd
          - apple,t6050-aon-ptd
  required:
    - compatible

properties:
  compatible: true

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - apple,t8132-aon-ptd
      required:
        - compatible
    then:
      properties:
        compatible:
          items:
            - enum:
                - apple,t8132-aon-ptd
            - const: apple,aon-ptd

        reg:
          minItems: 4
          maxItems: 4

        interrupts:
          minItems: 32
          maxItems: 32

        '#address-cells':
          const: 0
        '#interrupt-cells':
          const: 1
        interrupt-controller: true

      required:
        - compatible
        - reg
        - interrupts
        - interrupt-controller
        - '#interrupt-cells'
        - '#address-cells'
    else:
      allOf:
        - if:
            properties:
              compatible:
                contains:
                  enum:
                    - apple,t6032-aon-ptd
            required:
              - compatible
          then:
            properties:
              compatible:
                items:
                  - enum:
                      - apple,t6032-aon-ptd
                  - const: apple,aon-ptd

              reg:
                minItems: 4
                maxItems: 4

              interrupts:
                minItems: 32
                maxItems: 32

              '#address-cells':
                const: 0
              '#interrupt-cells':
                const: 1
              interrupt-controller: true

            required:
              - compatible
              - reg
              - interrupts
              - interrupt-controller
              - '#interrupt-cells'
              - '#address-cells'
          else:
            properties:
              compatible:
                items:
                  - enum:
                      - apple,t6031-aon-ptd
                      - apple,t6041-aon-ptd
                      - apple,t8140-aon-ptd
                      - apple,t8142-aon-ptd
                      - apple,t8152-aon-ptd
                      - apple,t6050-aon-ptd
                  - const: apple,aon-ptd

              reg:
                minItems: 4
                maxItems: 4
                description: Register apertures in hardware-description order.

              interrupts:
                minItems: 32
                maxItems: 32

              interrupt-controller: true

              '#interrupt-cells':
                description: Firmware telemetry source identifier, plus flags on T8140.
                enum: [1, 2]

              '#address-cells':
                const: 0

            required:
              - compatible
              - reg
              - interrupts
              - interrupt-controller
              - '#interrupt-cells'

            additionalProperties: false

unevaluatedProperties: false
