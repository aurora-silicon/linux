%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,t8142-display-expert.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8142 display engine control and status windows

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  Display engine control and status windows on T8142. This describes the complete register complex,
  including auxiliary control and status apertures shared with firmware.
  It does not imply compatibility with an earlier generation's driver.
  The node remains disabled until ownership of the register windows and
  the firmware handoff have been established. Calibration, firmware and
  programming sequences are supplied separately by the boot environment.

select:
  properties:
    compatible:
      contains:
        const: apple,t8142-display-expert
  required:
    - compatible

properties:
  compatible:
    items:
      - const: apple,t8142-display-expert
      - const: apple,display-expert

  reg:
    description: Controller register apertures, in hardware interface order.
    minItems: 3
    maxItems: 10

  interrupts:
    description: Interrupt lines wired to the system interrupt controller.
    minItems: 1
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false
