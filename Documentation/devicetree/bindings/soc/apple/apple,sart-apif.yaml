%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,sart-apif.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SART mediated through Aura APIF

maintainers:
  - Dj <hey@djdev.me>

description: |
  SART provider using native SPTM table-5 calls. Existing consumers reference
  this provider through their apple,sart phandle. Linux tracks only its own
  regions; unknown firmware grants are not reported as inherited regions.

properties:
  compatible:
    const: apple,sart-apif
  aurora,apif:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: APIF version-2 transport provider.

required:
  - compatible
  - aurora,apif

additionalProperties: false

examples:
  - |
    sart {
        compatible = "apple,sart-apif";
        aurora,apif = <&apif>;
    };
