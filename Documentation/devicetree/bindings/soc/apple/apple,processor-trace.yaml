%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,processor-trace.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple processor trace service

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Processor trace service. The hardware description provides no AP MMIO
  register aperture; a driver must establish its firmware transport.

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,t6041-processor-trace
          - const: apple,processor-trace
      - items:
          - const: apple,t8140-processor-trace
          - const: apple,processor-trace

      - items:
          - const: apple,t8103-processor-trace
          - const: apple,processor-trace
      - items:
          - const: apple,t6000-processor-trace
          - const: apple,processor-trace

required:
  - compatible

additionalProperties: false
