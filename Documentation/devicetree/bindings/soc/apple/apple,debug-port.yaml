%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,debug-port.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple auxiliary on-chip debug port

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Auxiliary on-chip debug port. Firmware describes the port separately
  from the processor debug MMIO apertures. Pin ownership and the debug
  transport must be established before this endpoint is used.

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,t6041-debug-port
          - const: apple,debug-port
      - items:
          - const: apple,t8140-debug-port
          - const: apple,debug-port

  swclk-gpios:
    maxItems: 1
    description: Serial wire clock pin.

  swdio-gpios:
    maxItems: 1
    description: Bidirectional serial wire data pin.

required:
  - compatible

additionalProperties: false
