%YAML 1.2
---
$id: "http://devicetree.org/schemas/soc/apple/apple,phy-coproc.yaml#"

$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: "Apple phy coproc hardware resources"

maintainers:
  - "Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>"

description: "T6050 native resource description. Firmware ownership, backend support and enables require separate qualification. This variant remains disabled and contains no programming sequences or firmware data."

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - "apple,phy-coproc"
              - "apple,t6050-phy-coproc"
      required:
        - "compatible"
    -
      properties:
        compatible:
          items:
            -
              const: "apple,t6050-phy-coproc"
            -
              const: "apple,phy-coproc"
      required:
        - "compatible"

properties:
  compatible: true
  status: true
  reg: true
  interrupts: true
  iommus: true
  power-domains: true
  clocks: true
  resets: true

additionalProperties: true

allOf:
  - if:
      anyOf:
        -
          properties:
            compatible:
              items:
                -
                  const: "apple,t6050-phy-coproc"
                -
                  const: "apple,phy-coproc"
            status:
              const: "disabled"
          required:
            - "compatible"
            - "status"
    then:
      oneOf:
        -
          description: "T6050 native resource description. Firmware ownership, backend support and enables require separate qualification. This variant remains disabled and contains no programming sequences or firmware data."
          properties:
            compatible:
              items:
                -
                  const: "apple,t6050-phy-coproc"
                -
                  const: "apple,phy-coproc"
            status:
              const: "disabled"
            reg:
              minItems: 2
              maxItems: 2
              description: "Native register apertures in hardware-interface order, including shared auxiliary views."
            interrupts:
              minItems: 4
              maxItems: 4
          required:
            - "compatible"
            - "reg"
            - "status"
            - "interrupts"
          additionalProperties: false
    else:
      properties:
        compatible:
          items:
            -
              const: "apple,t6050-phy-coproc"
            -
              const: "apple,phy-coproc"
        status:
          const: "disabled"
        reg:
          minItems: 2
          maxItems: 2
          description: "Native register apertures in hardware-interface order, including shared auxiliary views."
        interrupts:
          minItems: 4
          maxItems: 4
      required:
        - "compatible"
        - "reg"
        - "status"
        - "interrupts"
      additionalProperties: false
