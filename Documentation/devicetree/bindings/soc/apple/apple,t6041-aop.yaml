%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,t6041-aop.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T604x and T8132 Always-On Processor

maintainers:
  - Jonathan Goyvaerts <jonathan.goyvaerts@gmail.com>

description:
  The Always-On Processor provides audio and sensor services through firmware
  loaded by the bootloader. The application processor patches the firmware's
  boot arguments in the AOP SRAM, starts it through RTKit over one mailbox and
  reaches its services through the RTKit endpoints. The firmware's external
  code and log segments live in DRAM, and the bootloader reserves them.

  On T8132 the bootloader leaves the AOP DART's address filter (DAPF) empty
  and iBoot moves the log segment at every boot. The host programs the DAPF
  from the Apple device tree and maps its windows and the log segment inside
  IOVA-only reservations listed in memory-region; the DAPF block is a fifth
  register range.

properties:
  compatible:
    enum:
      - apple,t6041-aop
      - apple,t8132-aop

  reg:
    minItems: 2
    items:
      - description: AOP SRAM, holding the boot-argument table
      - description: ASC wrapper and processor control registers
      - description: Second ASC register window
      - description: AOP configuration registers
      - description: The AOP DART's address filter (DAPF) block

  reg-names:
    minItems: 2
    items:
      - const: firmware
      - const: asc
      - const: asc-aux
      - const: config
      - const: dapf

  mboxes:
    maxItems: 1

  mbox-names:
    const: mbox

  iommus:
    maxItems: 1

  memory-region:
    minItems: 1
    maxItems: 4
    description:
      The firmware segments in DRAM (its external code and its log), filled in
      by the bootloader from the ADT. The iommu-addresses property of each
      region gives the address the firmware uses for it. A region without reg
      only reserves IOVA space, for windows the host maps from the ADT.

  audio:
    type: object
    $ref: /schemas/sound/apple,t6041-aop-audio.yaml#
    description: The audio service.

  als:
    type: object
    description: The ambient light sensor service.
    additionalProperties: false

    properties:
      compatible:
        items:
          - const: apple,t6041-aop-als
          - const: apple,aop-als

    required:
      - compatible

  las:
    type: object
    description: The lid angle sensor service.
    additionalProperties: false

    properties:
      compatible:
        items:
          - const: apple,t6041-aop-las
          - const: apple,aop-las

    required:
      - compatible

required:
  - compatible
  - reg
  - mboxes
  - mbox-names
  - iommus

allOf:
  - if:
      properties:
        compatible:
          const: apple,t8132-aop
    then:
      properties:
        reg:
          minItems: 5
        reg-names:
          minItems: 5
    else:
      properties:
        reg:
          maxItems: 4
        reg-names:
          maxItems: 4

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        aop@510c10000 {
            compatible = "apple,t6041-aop";
            reg = <0x5 0x10c10000 0x0 0x2e0000>,
                  <0x5 0x10600000 0x0 0x88000>,
                  <0x5 0x10050000 0x0 0x4000>,
                  <0x5 0x08328000 0x0 0x24>;
            reg-names = "firmware", "asc", "asc-aux", "config";
            mboxes = <&aop_mbox>;
            mbox-names = "mbox";
            iommus = <&aop_dart 0>;
            memory-region = <&aop_etext>, <&aop_oslog>; /* Filled by the bootloader */

            als {
                compatible = "apple,t6041-aop-als", "apple,aop-als";
            };

            las {
                compatible = "apple,t6041-aop-las", "apple,aop-las";
            };
        };
    };
