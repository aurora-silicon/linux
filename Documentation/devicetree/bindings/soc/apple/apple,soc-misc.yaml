%YAML 1.2
---
$id: "http://devicetree.org/schemas/soc/apple/apple,soc-misc.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"
title: "Apple miscellaneous soc control registers"
maintainers:
  - "Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>"
select:
  properties:
    compatible:
      allOf:
        -
          contains:
            enum:
              - "apple,t8152-soc-misc"
        -
          contains:
            const: "apple,soc-misc"
  required:
    - "compatible"
description: "Apple miscellaneous soc control registers. Initial resource description for an unsupported firmware/backend layout. Register, IRQ and DMA topology can be recorded before a driver exists. This form must stay disabled; it does not substitute for the enabled driver contract or supply firmware, calibration, programming sequences or unresolved providers."
properties:
  compatible:
    items:
      -
        enum:
          - "apple,t8152-soc-misc"
      -
        const: "apple,soc-misc"
  status:
    const: "disabled"
  reg:
    description: "Register apertures of the complete hardware complex, in hardware interface order."
    minItems: 7
    maxItems: 7
required:
  - "compatible"
  - "reg"
  - "status"
additionalProperties: false
