%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,t6050-video-decoder-complex.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T6050 video decoding accelerator complex

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  Video decoding accelerator complex on T6050. This describes the complete register complex,
  including auxiliary control and status apertures shared with firmware.
  It does not imply compatibility with an earlier generation's driver.
  The node remains disabled until ownership of the register windows and
  the firmware handoff have been established. Calibration, firmware and
  programming sequences are supplied separately by the boot environment.

select:
  properties:
    compatible:
      contains:
        const: apple,t6050-video-decoder-complex
  required:
    - compatible

properties:
  compatible:
    items:
      - const: apple,t6050-video-decoder-complex
      - const: apple,video-decoder-complex

  reg:
    description: Controller register apertures, in hardware interface order.
    minItems: 2
    maxItems: 2

  interrupts:
    description: Interrupt lines wired to the system interrupt controller.
    minItems: 2
    maxItems: 2

  iommus:
    description: DMA translation streams used by this controller.
    minItems: 3
    maxItems: 3

required:
  - compatible
  - reg

additionalProperties: false
