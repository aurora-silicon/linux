%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,t8142-watchdog-complex.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8142 watchdog and reset register complex

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  Watchdog and reset register complex on T8142. This describes the complete register complex,
  including auxiliary control and status apertures shared with firmware.
  It does not imply compatibility with an earlier generation's driver.
  The node remains disabled until ownership of the register windows and
  the firmware handoff have been established. Calibration, firmware and
  programming sequences are supplied separately by the boot environment.

select:
  properties:
    compatible:
      contains:
        const: apple,t8142-watchdog-complex
  required:
    - compatible

properties:
  compatible:
    items:
      - const: apple,t8142-watchdog-complex
      - const: apple,watchdog-complex

  reg:
    description: Controller register apertures, in hardware interface order.
    minItems: 5
    maxItems: 5

  interrupts:
    description: Interrupt lines wired to the system interrupt controller.
    minItems: 2
    maxItems: 2

  clocks:
    description: The 24 MHz reference clock.
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false
