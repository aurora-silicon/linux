%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,m2-mcc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M2 generation memory cache controller

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Memory cache controller resources on M2 generation SoCs. The register apertures
  follow hardware resource order. Firmware configuration and tuning are
  supplied by the bootloader and are not part of this binding. Unqualified
  instances must remain disabled.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t8112-mcc
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t8112-mcc
      - const: apple,mcc

  reg:
    maxItems: 5

required:
  - compatible
  - reg

additionalProperties: false
