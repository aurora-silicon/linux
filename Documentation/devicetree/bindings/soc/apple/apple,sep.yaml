%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,sep.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Secure Enclave Processor

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description:
  The Secure Enclave Processor (SEP) is a coprocessor on Apple SoCs that
  holds device keys, provides a hardware random number generator and runs
  the Touch ID matcher. The bootloader starts it. The operating system talks
  to it through an ASC mailbox and through shared memory that the SEP
  reaches via its own DART.

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - apple,sep
      required:
        - compatible
    -
      properties:
        compatible:
          allOf:
            -
              contains:
                enum:
                  - apple,t8142-sep
                  - apple,t8152-sep
                  - apple,t6050-sep
            -
              contains:
                const: apple,sep
      required:
        - compatible
properties:
  compatible: true

  reg: true

  mboxes:
    maxItems: 1

  mbox-names:
    const: mbox

  iommus: true

  power-domains: true

  memory-region: true

  iboot-manifest:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description:
      The signed iBoot manifest of the running boot, added by the bootloader.
      The SEP needs it to open the machine's secure storage.

  local-policy-manifest:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description:
      The signed local boot policy of the running boot, added by the
      bootloader, for the same purpose.

# The root declares the union of property types for DTB decoding. The
# conditional variants below each retain their closed property contract.
additionalProperties: true

allOf:
  -
    if:
      anyOf:
        -
          properties:
            compatible:
              allOf:
                -
                  contains:
                    enum:
                      - apple,t8142-sep
                      - apple,t8152-sep
                      - apple,t6050-sep
                -
                  contains:
                    const: apple,sep
            status:
              const: disabled
          required:
            - compatible
            - status
          not:
            required:
              - mboxes
    then:
      oneOf:
        -
          type: object
          description: |
            Apple secure enclave processor. Initial resource description for an unsupported
            firmware/backend layout. Register, IRQ and DMA topology can be recorded before a driver
            exists. This form must stay disabled; it does not substitute for the enabled driver contract
            or supply firmware, calibration, programming sequences or unresolved providers.
          properties:
            compatible:
              items:
                -
                  enum:
                    - apple,t8142-sep
                    - apple,t8152-sep
                    - apple,t6050-sep
                -
                  const: apple,sep
            status:
              const: disabled
            reg:
              description: |
                Register apertures of the complete hardware complex, in hardware interface order.
              minItems: 2
              maxItems: 3
            interrupts:
              description: Interrupt lines wired to the system interrupt controller.
              minItems: 2
              maxItems: 4
            iommus:
              description: DMA translation streams emitted by this hardware.
              minItems: 1
              maxItems: 2
          required:
            - compatible
            - reg
            - status
          additionalProperties: false
    else:
      $ref: "#/$defs/legacy-driver"

$defs:
  legacy-driver:
    type: object
    properties:
      compatible:
        const: apple,sep

      reg:
        maxItems: 1

      mboxes:
        maxItems: 1

      mbox-names:
        const: mbox

      iommus:
        maxItems: 1

      power-domains:
        minItems: 1
        items:
          - description: The SEP's own power state.
          - description:
              A power state the SEP depends on while it runs. On T8140 this is
              the GPIO power state; the SEP stops servicing its mailbox for good
              once that is switched off.

      memory-region:
        maxItems: 1
        description:
          The SEP firmware carveout, added by the bootloader.

      iboot-manifest:
        $ref: /schemas/types.yaml#/definitions/uint8-array
        description:
          The signed iBoot manifest of the running boot, added by the bootloader.
          The SEP needs it to open the machine's secure storage.

      local-policy-manifest:
        $ref: /schemas/types.yaml#/definitions/uint8-array
        description:
          The signed local boot policy of the running boot, added by the
          bootloader, for the same purpose.
    required:
      - compatible
      - reg
      - mboxes
      - mbox-names
      - iommus
    additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        sep@282600000 {
            compatible = "apple,sep";
            reg = <0x2 0x82600000 0x0 0x88000>;
            mboxes = <&sep_mbox>;
            mbox-names = "mbox";
            iommus = <&sep_dart 0>;
            power-domains = <&ps_sep>;
        };
    };
