%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,sep.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Secure Enclave Processor

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description:
  The Secure Enclave Processor (SEP) is a coprocessor on Apple SoCs that
  holds device keys, provides a hardware random number generator and runs
  the Touch ID matcher. The bootloader starts it. The operating system talks
  to it through an ASC mailbox and through shared memory that the SEP
  reaches via its own DART.

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - "apple,sep"
              - "apple,t6030-sep"
              - "apple,t6031-sep"
      required:
        - "compatible"
    -
      properties:
        compatible:
          items:
            -
              const: "apple,t6050-sep"
            -
              const: "apple,sep"
      required:
        - "compatible"

properties:
  compatible: true
  reg: true
  mboxes:
    maxItems: 1
  mbox-names:
    const: mbox
  iommus: true
  power-domains: true
  memory-region: true
  iboot-manifest:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description:
      The signed iBoot manifest of the running boot, added by the bootloader.
      The SEP needs it to open the machine's secure storage.
  local-policy-manifest:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description:
      The signed local boot policy of the running boot, added by the
      bootloader, for the same purpose.
  interrupts: true
  clocks: true
  resets: true
  status: true

additionalProperties: true

allOf:
  - if:
      anyOf:
        -
          properties:
            compatible:
              items:
                -
                  const: "apple,t6050-sep"
                -
                  const: "apple,sep"
            status:
              const: "disabled"
          required:
            - "compatible"
            - "status"
    then:
      oneOf:
        -
          description: "T6050 native resource description. Firmware ownership, backend support and enables require separate qualification. This variant remains disabled and contains no programming sequences or firmware data."
          properties:
            compatible:
              items:
                -
                  const: "apple,t6050-sep"
                -
                  const: "apple,sep"
            status:
              const: "disabled"
            reg:
              minItems: 2
              maxItems: 2
              description: "Native register apertures in hardware-interface order, including shared auxiliary views."
            interrupts:
              minItems: 4
              maxItems: 4
            iommus:
              maxItems: 1
            power-domains:
              maxItems: 1
            clocks:
              maxItems: 1
          required:
            - "compatible"
            - "reg"
            - "status"
            - "interrupts"
            - "iommus"
            - "power-domains"
            - "clocks"
          additionalProperties: false
    else:
      properties:
        compatible:
          oneOf:
            - const: apple,sep
            - items:
                - enum:
                    - apple,t6030-sep
                    - apple,t6031-sep
                - const: apple,sep

        reg:
          minItems: 1
          items:
            - description: Coprocessor control registers
            - description: Coprocessor boot interface

        mboxes:
          maxItems: 1

        mbox-names:
          const: mbox

        iommus:
          maxItems: 1

        power-domains:
          minItems: 1
          items:
            - description: The SEP's own power state.
            - description:
                A power state the SEP depends on while it runs. On T8140 this is
                the GPIO power state; the SEP stops servicing its mailbox for good
                once that is switched off.

        memory-region:
          maxItems: 1
          description:
            The SEP firmware carveout, added by the bootloader.

        iboot-manifest:
          $ref: /schemas/types.yaml#/definitions/uint8-array
          description:
            The signed iBoot manifest of the running boot, added by the bootloader.
            The SEP needs it to open the machine's secure storage.

        local-policy-manifest:
          $ref: /schemas/types.yaml#/definitions/uint8-array
          description:
            The signed local boot policy of the running boot, added by the
            bootloader, for the same purpose.
      required:
        - compatible
        - reg
        - mboxes
        - mbox-names
        - iommus
      additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        sep@282600000 {
            compatible = "apple,sep";
            reg = <0x2 0x82600000 0x0 0x88000>;
            mboxes = <&sep_mbox>;
            mbox-names = "mbox";
            iommus = <&sep_dart 0>;
            power-domains = <&ps_sep>;
        };
    };
