%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,rsm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple remote service manager

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Remote service manager register banks, interrupt and DART stream.

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,t8142-rsm
          - const: apple,rsm
      - items:
          - const: apple,t8152-rsm
          - const: apple,rsm
      - items:
          - const: apple,t8140-rsm
          - const: apple,rsm

  reg:
    minItems: 2
    maxItems: 2
    description: Register apertures in hardware-description order.

  interrupts:
    maxItems: 1

  iommus:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - iommus

additionalProperties: false
