%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,t6032-rsm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T6032 remote service manager

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the T6032 remote service manager. The package contains two
  peripheral dies. Register banks follow hardware resource order. The block
  remains disabled until its ownership and lifecycle are supported; firmware
  data and tuning are supplied separately by the boot firmware.

select:
  properties:
    compatible:
      contains:
        const: apple,t6032-rsm
  required:
    - compatible

properties:
  compatible:
    items:
      - const: apple,t6032-rsm
      - const: apple,rsm

  reg:
    minItems: 2
    maxItems: 2

  interrupts:
    minItems: 1
    maxItems: 1

  power-domains:
    minItems: 1
    maxItems: 1

  iommus:
    minItems: 1
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - power-domains
  - iommus

additionalProperties: false
