%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,aop2.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple secondary always-on processor

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Secondary always-on processor register banks and transport interrupts.
  The processor uses a distinct stream in the primary AOP DART. On T6050 the
  host starts the processor and talks to it over its RTKit mailbox; the node
  then has the ASC wrapper's registers and the mailbox provider, which has
  the transport interrupts.

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - apple,t6050-aop2
              - apple,t8140-aop2
          - const: apple,aop2

  reg:
    minItems: 1
    maxItems: 3
    description:
      Register apertures in hardware-description order, or, with a mailbox
      provider, the ASC wrapper and processor control registers alone.

  reg-names:
    items:
      - const: asc

  interrupts:
    minItems: 4
    maxItems: 4

  mboxes:
    maxItems: 1

  mbox-names:
    items:
      - const: mbox

  apple,dma-range:
    $ref: /schemas/types.yaml#/definitions/uint64-array
    minItems: 2
    maxItems: 2
    description:
      Host DMA allocation window as a base and nonzero size, inside the root
      slots of this processor's DART stream that are free for the host.

  power-domains:
    maxItems: 1

  iommus:
    maxItems: 1

  apple,init-arg:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      The argument of the INIT message with which the host opens each service
      endpoint. Without it, INIT carries no argument. Filled in by the
      bootloader.

  apple,sleep-message:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 28
    description:
      The message, in 32-bit words, that the host puts on each open service
      endpoint's transmit ring before a system sleep, waiting for the
      firmware to answer it. Without it the endpoints get no message and the
      host only sends its IDLE. Filled in by the bootloader.

  apple,wake-message:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 3
    maxItems: 28
    description:
      The message, in 32-bit words, that the host puts on the transmit ring
      of each service endpoint that took the sleep message, after the system
      sleep and its ON, waiting for the firmware to answer it. Without it
      those endpoints stay closed. Filled in by the bootloader.

  apple,open-endpoints:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 13
    uniqueItems: true
    items:
      minimum: 0x20
      maximum: 0x2c
    description:
      The service endpoints the host opens once the firmware has started, in
      the order it opens them; one not listed is not opened. Without it the
      host opens every service endpoint the firmware has, in endpoint order.
      Filled in by the bootloader.

  apple,sleep-endpoints:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 13
    uniqueItems: true
    items:
      minimum: 0x20
      maximum: 0x2c
    description:
      The open service endpoints that get the sleep message before a system
      sleep, in the order they get it; one not listed gets none. Without it
      every open endpoint gets the message, in endpoint order. Filled in by
      the bootloader.

required:
  - compatible
  - reg
  - iommus

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8140-aop2
    then:
      required:
        - power-domains
  - if:
      properties:
        compatible:
          contains:
            const: apple,t6050-aop2
      required:
        - mboxes
    then:
      properties:
        reg:
          maxItems: 1
        interrupts: false
      required:
        - reg-names
        - mbox-names
    else:
      properties:
        reg:
          minItems: 3
        reg-names: false
        mboxes: false
        mbox-names: false
      required:
        - interrupts

additionalProperties: false
