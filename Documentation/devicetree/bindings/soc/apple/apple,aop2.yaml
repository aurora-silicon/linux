%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,aop2.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Apple second always-on processor
maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>
select:
  properties:
    compatible:
      allOf:
        -
          contains:
            enum:
              - apple,t8142-aop2
              - apple,t8152-aop2
              - apple,t6050-aop2
        -
          contains:
            const: apple,aop2
  required:
    - compatible
description: |
  Apple second always-on processor. Initial resource description for an unsupported firmware/backend
  layout. Register, IRQ and DMA topology can be recorded before a driver exists. This form must stay
  disabled; it does not substitute for the enabled driver contract or supply firmware, calibration,
  programming sequences or unresolved providers.
properties:
  compatible:
    items:
      -
        enum:
          - apple,t8142-aop2
          - apple,t8152-aop2
          - apple,t6050-aop2
      -
        const: apple,aop2
  status:
    const: disabled
  reg:
    description: Register apertures of the complete hardware complex, in hardware interface order.
    minItems: 3
    maxItems: 4
  interrupts:
    description: Interrupt lines wired to the system interrupt controller.
    minItems: 3
    maxItems: 4
  iommus:
    description: DMA translation streams emitted by this hardware.
    maxItems: 1
required:
  - compatible
  - reg
  - status
additionalProperties: false
