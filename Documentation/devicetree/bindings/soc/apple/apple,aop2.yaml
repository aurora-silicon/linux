%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,aop2.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple secondary always-on processor

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Secondary always-on processor register banks and transport interrupts.
  The processor uses a distinct stream in the primary AOP DART.

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - "apple,aop2"
              - "apple,t8140-aop2"
      required:
        - "compatible"
    -
      properties:
        compatible:
          items:
            -
              const: "apple,t6050-aop2"
            -
              const: "apple,aop2"
      required:
        - "compatible"

properties:
  compatible: true
  reg: true
  interrupts: true
  power-domains: true
  iommus: true
  clocks: true
  resets: true
  status: true

allOf:
  - if:
      anyOf:
        -
          properties:
            compatible:
              items:
                -
                  const: "apple,t6050-aop2"
                -
                  const: "apple,aop2"
            status:
              const: "disabled"
          required:
            - "compatible"
            - "status"
    then:
      oneOf:
        -
          description: "T6050 native resource description. Firmware ownership, backend support and enables require separate qualification. This variant remains disabled and contains no programming sequences or firmware data."
          properties:
            compatible:
              items:
                -
                  const: "apple,t6050-aop2"
                -
                  const: "apple,aop2"
            status:
              const: "disabled"
            reg:
              minItems: 3
              maxItems: 3
              description: "Native register apertures in hardware-interface order, including shared auxiliary views."
            interrupts:
              minItems: 4
              maxItems: 4
            iommus:
              maxItems: 1
            clocks:
              maxItems: 1
          required:
            - "compatible"
            - "reg"
            - "status"
            - "interrupts"
            - "iommus"
            - "clocks"
          additionalProperties: false
    else:
      properties:
        compatible:
          oneOf:
            - items:
                - const: apple,t8140-aop2
                - const: apple,aop2

        reg:
          minItems: 3
          maxItems: 3
          description: Register apertures in hardware-description order.

        interrupts:
          minItems: 4
          maxItems: 4

        power-domains:
          maxItems: 1

        iommus:
          maxItems: 1
      required:
        - compatible
        - reg
        - interrupts
        - power-domains
        - iommus
      additionalProperties: false
