%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,aop2.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple secondary always-on processor

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Secondary always-on processor register banks and transport interrupts.
  The processor uses a distinct stream in the primary AOP DART.

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - apple,t6050-aop2
              - apple,t8140-aop2
          - const: apple,aop2

  reg:
    minItems: 3
    maxItems: 3
    description: Register apertures in hardware-description order.

  interrupts:
    minItems: 4
    maxItems: 4

  power-domains:
    maxItems: 1

  iommus:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - iommus

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8140-aop2
    then:
      required:
        - power-domains

additionalProperties: false
