%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,dockchannel-complex.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Apple dockchannel fifo and interrupt complex
maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>
select:
  properties:
    compatible:
      allOf:
        -
          contains:
            enum:
              - apple,t8142-dockchannel-complex
              - apple,t6050-dockchannel-complex
        -
          contains:
            const: apple,dockchannel-complex
  required:
    - compatible
description: |
  Apple dockchannel fifo and interrupt complex. Initial resource description for an unsupported
  firmware/backend layout. Register, IRQ and DMA topology can be recorded before a driver exists. This
  form must stay disabled; it does not substitute for the enabled driver contract or supply firmware,
  calibration, programming sequences or unresolved providers.
properties:
  compatible:
    items:
      -
        enum:
          - apple,t8142-dockchannel-complex
          - apple,t6050-dockchannel-complex
      -
        const: apple,dockchannel-complex
  status:
    const: disabled
  reg:
    description: Register apertures of the complete hardware complex, in hardware interface order.
    minItems: 6
    maxItems: 6
  interrupts:
    description: Interrupt lines wired to the system interrupt controller.
    maxItems: 1
required:
  - compatible
  - reg
  - status
additionalProperties: false
