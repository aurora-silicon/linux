%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,cluster-pwrgate.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SoC CPU cluster power-gate enables

maintainers:
  - Diljit Singh <hey@djdev.me>

description: |
  PMGR words whose top bit lets a CPU power down in WFI: one per cluster on
  T8140, one per core on T6050. A core that PMGR powers on comes up allowed to,
  but the boot CPU was started by the boot ROM and only follows its word, which
  the boot loader may leave clear. The words are set early in boot, in the order
  listed.

properties:
  compatible:
    items:
      - enum:
          - apple,t6050-cluster-pwrgate
          - apple,t8140-cluster-pwrgate
      - const: apple,cluster-pwrgate

  reg:
    minItems: 1
    maxItems: 8
    description: The words to set, one per cluster or per core.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        power-gate@300724000 {
            compatible = "apple,t8140-cluster-pwrgate", "apple,cluster-pwrgate";
            reg = <0x3 0x00724000 0x0 0x4>,
                  <0x3 0x00724040 0x0 0x4>;
        };
    };
