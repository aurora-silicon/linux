%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,t6000-pmgr-misc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SoC PMGR Misc Power States

maintainers:
  - Sasha Finkelstein <k@chaosmail.tech>

description: |
  Certain Apple SoCs include additional PMGR power states that are controlled
  via a different "misc" control block. This includes the fabric and memory
  controller states.

  When the host owns these registers and PMP firmware is disabled, an optional
  measured bandwidth OPP table enables one shared interconnect provider on
  T600x. Endpoint 0 represents clients and endpoint 1 represents memory. All
  clients use the path from 0 to 1, so their bandwidth requests aggregate.

properties:
  compatible:
    enum:
      - apple,t8103-pmgr-misc
      - apple,t6000-pmgr-misc
      - apple,t6020-pmgr-misc

  reg:
    minItems: 2
    maxItems: 3

  reg-names:
    minItems: 2
    items:
      - const: fabric-ps
      - const: dcs-ps
      - const: disp-ps

  apple,fabric-min-pstate:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 15
    description: |
      Lowest raw PMGR fabric p-state verified safe on this board for idle and
      s2idle scaling. When absent on SoCs without a built-in suspend floor,
      the boot fabric p-state is retained for idle and s2idle.

  apple,dcs-min-pstate:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 15
    description: |
      Lowest raw PMGR DCS p-state verified safe on this board for idle and
      s2idle scaling without starving active display scanout. When absent on
      SoCs without a built-in suspend floor, the boot DCS p-state is retained
      for idle and s2idle. Mutually exclusive with operating-points-v2.

  apple,disp-min-pstate:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 15
    description: |
      Lowest raw PMGR display perf p-state verified safe on this board for idle
      and s2idle scaling while scanning out the internal panel. Requires the
      optional disp-ps register range; when absent, the boot display perf
      p-state is retained.

  '#interconnect-cells':
    const: 1

  operating-points-v2:
    description: |
      Measured sustainable bandwidth table following
      operating-points-v2-apple-dcs.yaml. Only valid with host ownership of DCS;
      do not enable PMP firmware together with this interface.
    maxItems: 1

required:
  - compatible
  - reg
  - reg-names

dependentRequired:
  operating-points-v2: ['#interconnect-cells']
  '#interconnect-cells': [operating-points-v2]

allOf:
  - if:
      properties:
        compatible:
          enum:
            - apple,t8103-pmgr-misc
            - apple,t6020-pmgr-misc
    then:
      properties:
        operating-points-v2: false
        '#interconnect-cells': false
  - not:
      required:
        - apple,dcs-min-pstate
        - operating-points-v2

additionalProperties: false

examples:
  - |
    power-management@8e20c000 {
        compatible = "apple,t6000-pmgr-misc";
        reg = <0x8e20c000 0x400>,
              <0x8e20c800 0x400>;
        reg-names = "fabric-ps", "dcs-ps";
    };
