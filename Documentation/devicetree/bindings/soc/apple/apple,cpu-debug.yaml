%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,cpu-debug.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple processor debug interface

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Processor debug register apertures. Access ownership must be established
  before a debugger accesses this block.

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,t6041-cpu-debug
          - const: apple,cpu-debug

  reg:
    minItems: 2
    maxItems: 2
    description: Register apertures in hardware-description order.

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false
