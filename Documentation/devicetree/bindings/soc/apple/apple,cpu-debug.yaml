%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,cpu-debug.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple processor debug interface

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Processor debug register apertures. Access ownership must be established
  before a debugger accesses this block.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6041-cpu-debug
          - apple,cpu-debug
          - apple,t8132-cpu-debug
  required:
    - compatible

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - apple,t8132-cpu-debug
      required:
        - compatible
    then:
      properties:
        compatible:
          items:
            - enum:
                - apple,t8132-cpu-debug
            - const: apple,cpu-debug

        reg:
          minItems: 2
          maxItems: 2

        interrupts:
          minItems: 1
          maxItems: 1

      required:
        - compatible
        - reg
        - interrupts

      additionalProperties: false
    else:
      properties:
        compatible:
          oneOf:
            - items:
                - const: apple,t6041-cpu-debug
                - const: apple,cpu-debug

        reg:
          minItems: 2
          maxItems: 2
          description: Register apertures in hardware-description order.

        interrupts:
          minItems: 1
          maxItems: 1

      required:
        - compatible
        - reg
        - interrupts

      additionalProperties: false
