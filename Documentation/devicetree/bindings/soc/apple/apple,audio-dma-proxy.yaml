%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,audio-dma-proxy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Apple isolated audio dma proxy
maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>
select:
  properties:
    compatible:
      allOf:
        -
          contains:
            enum:
              - apple,t8142-audio-dma-proxy
              - apple,t8152-audio-dma-proxy
              - apple,t6050-audio-dma-proxy
        -
          contains:
            const: apple,audio-dma-proxy
  required:
    - compatible
description: |
  Apple isolated audio dma proxy. Initial resource description for an unsupported firmware/backend
  layout. Register, IRQ and DMA topology can be recorded before a driver exists. This form must stay
  disabled; it does not substitute for the enabled driver contract or supply firmware, calibration,
  programming sequences or unresolved providers.
properties:
  compatible:
    items:
      -
        enum:
          - apple,t8142-audio-dma-proxy
          - apple,t8152-audio-dma-proxy
          - apple,t6050-audio-dma-proxy
      -
        const: apple,audio-dma-proxy
  status:
    const: disabled
  reg:
    description: Register apertures of the complete hardware complex, in hardware interface order.
    maxItems: 1
required:
  - compatible
  - reg
  - status
additionalProperties: false
