%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,t8152-error-monitor.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8152 soc error monitoring register windows

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  SoC error monitoring register windows on T8152. This describes the complete register complex,
  including auxiliary control and status apertures shared with firmware.
  It does not imply compatibility with an earlier generation's driver.
  The node remains disabled until ownership of the register windows and
  the firmware handoff have been established. Calibration, firmware and
  programming sequences are supplied separately by the boot environment.

select:
  properties:
    compatible:
      contains:
        const: apple,t8152-error-monitor
  required:
    - compatible

properties:
  compatible:
    items:
      - const: apple,t8152-error-monitor
      - const: apple,error-monitor

  reg:
    description: Controller register apertures, in hardware interface order.
    minItems: 112
    maxItems: 120

  interrupts:
    description: Interrupt lines wired to the system interrupt controller.
    minItems: 96
    maxItems: 96

required:
  - compatible
  - reg

additionalProperties: false
