%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,hibernation-watchdog.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Apple isolated hibernation watchdog
maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>
select:
  properties:
    compatible:
      allOf:
        -
          contains:
            enum:
              - apple,t8142-hibernation-watchdog
        -
          contains:
            const: apple,hibernation-watchdog
  required:
    - compatible
description: |
  Apple isolated hibernation watchdog. Initial resource description for an unsupported firmware/backend
  layout. Register, IRQ and DMA topology can be recorded before a driver exists. This form must stay
  disabled; it does not substitute for the enabled driver contract or supply firmware, calibration,
  programming sequences or unresolved providers.
properties:
  compatible:
    items:
      -
        enum:
          - apple,t8142-hibernation-watchdog
      -
        const: apple,hibernation-watchdog
  status:
    const: disabled
  reg:
    description: Register apertures of the complete hardware complex, in hardware interface order.
    maxItems: 1
  power-domains:
    description: Physical power and combined clock-gate dependencies.
    minItems: 1
    maxItems: 8
required:
  - compatible
  - reg
  - status
additionalProperties: false
