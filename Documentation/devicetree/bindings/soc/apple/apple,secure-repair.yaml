%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,secure-repair.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Apple secure repair mailbox
maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>
select:
  properties:
    compatible:
      allOf:
        -
          contains:
            enum:
              - apple,t8142-secure-repair
              - apple,t8152-secure-repair
              - apple,t6050-secure-repair
        -
          contains:
            const: apple,secure-repair
  required:
    - compatible
description: |
  Apple secure repair mailbox. Initial resource description for an unsupported firmware/backend layout.
  Register, IRQ and DMA topology can be recorded before a driver exists. This form must stay disabled;
  it does not substitute for the enabled driver contract or supply firmware, calibration, programming
  sequences or unresolved providers.
properties:
  compatible:
    items:
      -
        enum:
          - apple,t8142-secure-repair
          - apple,t8152-secure-repair
          - apple,t6050-secure-repair
      -
        const: apple,secure-repair
  status:
    const: disabled
  reg:
    description: Register apertures of the complete hardware complex, in hardware interface order.
    maxItems: 1
  interrupts:
    description: Interrupt lines wired to the system interrupt controller.
    minItems: 7
    maxItems: 7
required:
  - compatible
  - reg
  - status
additionalProperties: false
