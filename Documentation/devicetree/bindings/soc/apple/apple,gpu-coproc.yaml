%YAML 1.2
---
$id: "http://devicetree.org/schemas/soc/apple/apple,gpu-coproc.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"
title: "Apple gpu coproc hardware resources"
maintainers:
  - "Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>"
description: "T6050 native resource description. Firmware ownership, backend support and enables require separate qualification. This variant remains disabled and contains no programming sequences or firmware data."
properties:
  compatible:
    items:
      -
        const: "apple,t6050-gpu-coproc"
      -
        const: "apple,gpu-coproc"
  status:
    const: "disabled"
  reg:
    minItems: 2
    maxItems: 2
    description: "Native register apertures in hardware-interface order, including shared auxiliary views."
  interrupts:
    minItems: 4
    maxItems: 4
  power-domains:
    maxItems: 1
  clocks:
    maxItems: 1
required:
  - "compatible"
  - "reg"
  - "status"
  - "interrupts"
  - "power-domains"
  - "clocks"
additionalProperties: false
