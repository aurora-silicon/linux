%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,t8140-mcc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8140 memory cache controller

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description:
  The memory cache controller of the Apple T8140 SoC holds the system level
  cache in front of DRAM, split into planes. The boot firmware enables and
  powers the cache ways of every plane but leaves allocation disabled, so the
  cache holds no data until the operating system allows allocation.

properties:
  compatible:
    const: apple,t8140-mcc

  reg:
    description: The register block of each cache plane.
    minItems: 1
    maxItems: 8

  apple,boot-dma-devices:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      maxItems: 1
    description:
      Devices that take over DMA the bootloader left running. Cache allocation
      is enabled only once each of them is bound to its driver.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        display: display-subsystem {
        };

        memory-controller@220000000 {
            compatible = "apple,t8140-mcc";
            reg = <0x2 0x20000000 0x0 0x4000>,
                  <0x2 0x20040000 0x0 0x4000>,
                  <0x2 0x20080000 0x0 0x4000>,
                  <0x2 0x200c0000 0x0 0x4000>;
            apple,boot-dma-devices = <&display>;
        };
    };
