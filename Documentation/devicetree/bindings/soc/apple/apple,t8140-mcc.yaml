%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,t8140-mcc.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple memory cache controller

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description:
  The memory cache controller holds the system level cache in front of DRAM.
  T8140 exposes per-plane allocation and flush controls. T8132 instead has
  two apertures with two planes each and a multicast cache-enable register;
  its enabled cache is retained until a dirty-data drain is qualified.

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - apple,t6041-mcc
              - apple,t8132-mcc
              - apple,t8140-mcc
      required:
        - compatible
    -
      properties:
        compatible:
          allOf:
            -
              contains:
                enum:
                  - apple,t8142-mcc
                  - apple,t8152-mcc
                  - apple,t6050-mcc
            -
              contains:
                const: apple,mcc
      required:
        - compatible
allOf:
  -
    if:
      anyOf:
        -
          properties:
            compatible:
              allOf:
                -
                  contains:
                    enum:
                      - apple,t8142-mcc
                      - apple,t8152-mcc
                      - apple,t6050-mcc
                -
                  contains:
                    const: apple,mcc
            status:
              const: disabled
          required:
            - compatible
            - status
          not:
            required:
              - mboxes
    then:
      oneOf:
        -
          type: object
          description: |
            Apple memory cache controller complex. Initial resource description for an unsupported
            firmware/backend layout. Register, IRQ and DMA topology can be recorded before a driver
            exists. This form must stay disabled; it does not substitute for the enabled driver contract
            or supply firmware, calibration, programming sequences or unresolved providers.
          properties:
            compatible:
              items:
                -
                  enum:
                    - apple,t8142-mcc
                    - apple,t8152-mcc
                    - apple,t6050-mcc
                -
                  const: apple,mcc
            status:
              const: disabled
            reg:
              description: |
                Register apertures of the complete hardware complex, in hardware interface order.
              minItems: 4
              maxItems: 18
          required:
            - compatible
            - reg
            - status
          additionalProperties: false
    else:
      $ref: "#/$defs/legacy-driver"

unevaluatedProperties: false

$defs:
  legacy-driver:
    type: object
    properties:
      compatible:
        oneOf:
          - enum:
              - apple,t8132-mcc
              - apple,t8140-mcc
          - items:
              - const: apple,t6041-mcc
              - const: apple,t8140-mcc

      reg:
        description: Per-plane blocks on T8140, or the two multicast apertures on T8132.
        minItems: 1
        maxItems: 32

      nonposted-mmio: true

      apple,boot-dma-devices:
        $ref: /schemas/types.yaml#/definitions/phandle-array
        items:
          maxItems: 1
        description:
          Devices that take over DMA the bootloader left running. Cache allocation
          is enabled only once each of them is bound to its driver.
    required:
      - compatible
      - reg
    additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        display: display-subsystem {
        };

        memory-controller@220000000 {
            compatible = "apple,t8140-mcc";
            reg = <0x2 0x20000000 0x0 0x4000>,
                  <0x2 0x20040000 0x0 0x4000>,
                  <0x2 0x20080000 0x0 0x4000>,
                  <0x2 0x200c0000 0x0 0x4000>;
            apple,boot-dma-devices = <&display>;
        };
    };
