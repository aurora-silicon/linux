%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,t8140-mcc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple memory cache controller

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description:
  The memory cache controller holds the system level cache in front of DRAM.
  T8140 exposes per-plane allocation and flush controls. T8132 instead has
  two apertures with two planes each and a multicast cache-enable register;
  its enabled cache is retained until a dirty-data drain is qualified.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6000-mcc
          - apple,t6020-mcc
          - apple,t6021-mcc
          - apple,t6022-mcc
          - apple,t6030-mcc
          - apple,t6031-mcc
          - apple,t6032-mcc
          - apple,t6041-mcc
          - apple,t6050-mcc
          - apple,t8103-mcc
          - apple,t8112-mcc
          - apple,t8122-mcc
          - apple,t8132-mcc
          - apple,t8140-mcc
  required:
    - compatible

properties:
  compatible: true

  apple,boot-dma-devices:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description: Shared hardware resource metadata.
    items:
      maxItems: 1

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - apple,t6032-mcc
      required:
        - compatible
    then:
      properties:
        compatible:
          items:
            - const: apple,t6032-mcc
            - const: apple,mcc

        reg:
          minItems: 20
          maxItems: 20

      required:
        - compatible
        - reg
    else:
      properties:
        compatible:
          oneOf:
            - enum:
                - apple,t6050-mcc
                - apple,t8132-mcc
                - apple,t8140-mcc
            - items:
                - enum:
                    - apple,t6000-mcc
                    - apple,t6020-mcc
                    - apple,t6021-mcc
                    - apple,t6022-mcc
                    - apple,t6030-mcc
                    - apple,t6031-mcc
                    - apple,t8103-mcc
                    - apple,t8112-mcc
                    - apple,t8122-mcc
                - const: apple,mcc
            - items:
                - enum:
                    - apple,t6041-mcc
                - const: apple,t8140-mcc

        reg:
          description:
            Per-plane blocks or multicast memory-controller apertures. A two-die
            T6050 lists both dies' planes.
          minItems: 1
          maxItems: 64

        nonposted-mmio: true

        apple,boot-dma-devices:
          $ref: /schemas/types.yaml#/definitions/phandle-array
          items:
            maxItems: 1
          description:
            Devices that take over DMA the bootloader left running. Cache allocation
            is enabled only once each of them is bound to its driver.

      required:
        - compatible
        - reg

      additionalProperties: false

unevaluatedProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        display: display-subsystem {
        };

        memory-controller@220000000 {
            compatible = "apple,t8140-mcc";
            reg = <0x2 0x20000000 0x0 0x4000>,
                  <0x2 0x20040000 0x0 0x4000>,
                  <0x2 0x20080000 0x0 0x4000>,
                  <0x2 0x200c0000 0x0 0x4000>;
            apple,boot-dma-devices = <&display>;
        };
    };
