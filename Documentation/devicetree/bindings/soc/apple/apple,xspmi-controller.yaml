%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,xspmi-controller.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple external SPMI controller endpoint

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  External SPMI controller firmware endpoint. Its bus access is mediated
  by a proxy follower; it has no independently published AP MMIO aperture.

properties:
  compatible:
    items:
      - enum:
          - apple,t8140-xspmi-controller
      - const: apple,xspmi-controller

  apple,proxy:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: SPMI follower implementing the firmware proxy transport.

required:
  - compatible
  - apple,proxy

additionalProperties: false
