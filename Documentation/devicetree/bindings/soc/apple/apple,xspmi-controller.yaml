%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,xspmi-controller.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple external SPMI controller endpoint

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  External SPMI controller queue aperture, published separately from the
  non-secure bus and its SPMI proxy follower. The queue aperture is owned
  by secure firmware; the response vector is local to this transport and
  is not an AIC interrupt number.

properties:
  compatible:
    items:
      - enum:
          - apple,t8140-xspmi-controller
      - const: apple,xspmi-controller

  reg:
    maxItems: 1

  apple,response-vector:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Local response vector of the firmware transport.

required:
  - compatible
  - reg
  - apple,response-vector

additionalProperties: false
