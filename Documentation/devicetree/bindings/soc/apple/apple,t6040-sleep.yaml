%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,t6040-sleep.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T6040 system sleep controls

maintainers:
  - Diljit Singh <hey@djdev.me>
  - František Balázsy <frantisekbalazsy@gmail.com>

description: |
  The registers a kernel running directly at EL2 on an Apple SoC writes to enter
  and return from suspend-to-RAM and to power its secondary CPUs off. They belong
  to several hardware blocks, some of which other drivers also use, so this node
  overlaps those drivers' register ranges and the driver does not claim them.

  On the T6040 the sleep engine waits for the display pipes, so the node lists
  the power states that have to be off before a sleep. Each entry names a PMGR
  register block,
  the offset of a display pipe's CPU power state and the offset of its last
  sub-block; the states in between are 8 bytes apart. All of the T6040's
  register blocks are needed to enter a suspend and to undo it.

properties:
  compatible:
    const: apple,t6040-sleep

  reg:
    items:
      - description: CPU start/stop block (pmgr + 0x88000)
      - description: AON watchdog
      - description: control words of the three CPU complexes
      - description: SoC power gate, wake and retention voters
      - description: SPMI controller of the PMU (boot stage, notify, hibernate)
      - description: second SPMI controller's notify word
      - description: MasterMini block with the S2R timer
      - description: SOC-East page with retention, fabric, DCS, SIO and other power words
      - description: SOC page with the west axi2af, ATC, fabric and DCS power words
      - description: AOP global block, S2R control and wake masks
      - description: MiniPMGR power states of the AOP and its audio island
      - description: internal display's DART, for its transaction idle wait
      - description: internal display's power gate controls
      - description: PMC voters of the display coprocessors
      - description: PMC bandwidth request and boost enables of the display pipes
      - description: keep-alive enables in the SOC PMGR
      - description: keep-alive enables in the SOC-East PMGR
      - description: SMC's AP watchdog deadline
      - description: MiniPMGR GPU residency gate
      - description: MiniPMGR S2R entry counter
      - description: GPU AFR power state
      - description: external debug windows of the CPU cores
      - description: power gating controls of DCS 0, channel 0
      - description: power gating controls of DCS 0, channel 1
      - description: power gating controls of DCS 0, channel 2
      - description: power gating controls of DCS 0, channel 3
      - description: power gating controls of DCS 1, channel 0
      - description: power gating controls of DCS 1, channel 1
      - description: power gating controls of DCS 1, channel 2
      - description: power gating controls of DCS 1, channel 3
      - description: power gating controls of DCS 2, channel 0
      - description: power gating controls of DCS 2, channel 1
      - description: power gating controls of DCS 2, channel 2
      - description: power gating controls of DCS 2, channel 3
      - description: power gating controls of DCS 3, channel 0
      - description: power gating controls of DCS 3, channel 1
      - description: power gating controls of DCS 3, channel 2
      - description: power gating controls of DCS 3, channel 3
      - description: configuration of Type-C PHY 0
      - description: configuration of Type-C PHY 1
      - description: configuration of Type-C PHY 2
      - description: configuration of Type-C PHY 3
      - description: fabric bridge of the atc0-common power domain
      - description: fabric bridge of the atc1-common power domain
      - description: fabric bridge of the atc2-common power domain
      - description: fabric bridge of the atc3-common power domain
      - description: fabric bridge of the disp-sys power domain
      - description: fabric bridge of the dispext0-sys power domain
      - description: fabric bridge of the dispext1-sys power domain
      - description: fabric bridge of the dispext2-sys power domain
      - description: fabric bridge of the dispext3-sys power domain
      - description: fabric bridge of the ans power domain
      - description: fabric bridge of the avd-sys power domain
      - description: fabric bridge of the venc0-sys power domain
      - description: fabric bridge of the venc1-sys power domain
      - description: fabric bridge of the jpg power domain
      - description: fabric bridge of the apcie-sys-gp power domain
      - description: APSC control of the E CPU complex
      - description: APSC control of the P0 CPU complex
      - description: APSC control of the P1 CPU complex
      - description: disp2 voltage monitor control and status
      - description: afr voltage monitor control and status
      - description: dcs0 voltage monitor control and status
      - description: dcs1 voltage monitor control and status
      - description: gfx0 voltage monitor control and status
      - description: gfx1 voltage monitor control and status
      - description: disp voltage monitor control and status
      - description: soc voltage monitor control and status

  reg-names:
    items:
      - const: cpu-start
      - const: wdt
      - const: cluster
      - const: pwrgate
      - const: spmi
      - const: spmi-a0
      - const: mastermini
      - const: soc-east
      - const: soc-ps
      - const: wake
      - const: aop-ps
      - const: disp-dart
      - const: disp-pwrgate
      - const: pmc-dcp
      - const: pmc-bwr
      - const: keep-alive-soc
      - const: keep-alive-east
      - const: smc-wdt
      - const: agx-gate
      - const: s2r-count
      - const: gfx-ps
      - const: cpu-debug
      - const: dcs0
      - const: dcs1
      - const: dcs2
      - const: dcs3
      - const: dcs4
      - const: dcs5
      - const: dcs6
      - const: dcs7
      - const: dcs8
      - const: dcs9
      - const: dcs10
      - const: dcs11
      - const: dcs12
      - const: dcs13
      - const: dcs14
      - const: dcs15
      - const: atc0-cfg
      - const: atc1-cfg
      - const: atc2-cfg
      - const: atc3-cfg
      - const: axi2af-atc0-common
      - const: axi2af-atc1-common
      - const: axi2af-atc2-common
      - const: axi2af-atc3-common
      - const: axi2af-disp-sys
      - const: axi2af-dispext0-sys
      - const: axi2af-dispext1-sys
      - const: axi2af-dispext2-sys
      - const: axi2af-dispext3-sys
      - const: axi2af-ans
      - const: axi2af-avd-sys
      - const: axi2af-venc0-sys
      - const: axi2af-venc1-sys
      - const: axi2af-jpg
      - const: axi2af-apcie-sys-gp
      - const: apsc-e
      - const: apsc-p0
      - const: apsc-p1
      - const: tvm-disp2
      - const: tvm-afr
      - const: tvm-dcs0
      - const: tvm-dcs1
      - const: tvm-gfx0
      - const: tvm-gfx1
      - const: tvm-disp
      - const: tvm-soc

  apple,apcie:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      The PCIe host whose shared registers and tunables the storage controller's
      link depends on. They are needed even with that host disabled. The boot
      loader adds it, with those registers and tunables on the host's node;
      without it the storage controller can't be stopped for a sleep.

  apple,gp-pcie:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      The general-purpose PCIe host. Its port and PHY windows are needed even
      with that host disabled, and the reset pins of its ports' endpoints
      when it is enabled.

  apple,check-ps-b4-sleep:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description:
      The display pipes whose power states have to be off before a sleep, one
      entry per pipe.
    items:
      items:
        - description: PMGR syscon
        - description: offset of the pipe's CPU power state
        - description: offset of its last sub-block's power state

  apple,check-ps-b4-sleep-names:
    $ref: /schemas/types.yaml#/definitions/string-array
    description: One name per apple,check-ps-b4-sleep entry.

  apple,pinctrl:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The AP pin controller, whose pins a deep sleep resets.

  apple,pinctrl-skip-pins:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: Pins neither saved nor restored.

required:
  - compatible
  - reg
  - reg-names
  - apple,check-ps-b4-sleep
  - apple,check-ps-b4-sleep-names

additionalProperties: false

