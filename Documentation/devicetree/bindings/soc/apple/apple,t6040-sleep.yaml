%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,t6040-sleep.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T6040 system sleep controller

maintainers:
  - František Balázsy <frantisekbalazsy@gmail.com>

description: |
  What an operating system that runs at EL2, with no firmware below it to ask,
  drives itself to suspend the T6040 to RAM and to bring it back: the CPU
  start block, the always-on watchdog, the complex and power-gate words, the
  PMU's SPMI controllers and the always-on timer that starts the SoC's sleep
  engine. All of these register blocks are shared with the devices that own
  them, and all of them are needed to enter a suspend and to undo it.

  The sleep engine waits for the display pipes, so the node lists the power
  states that have to be off before a sleep, as the ADT's
  device-check-ps-b4-sleep table does. Each entry names a PMGR register block,
  the offset of a display pipe's CPU power state and the offset of its last
  sub-block; the states in between are 8 bytes apart.

properties:
  compatible:
    const: apple,t6040-sleep

  reg:
    items:
      - description: CPU start/stop block (pmgr + 0x88000)
      - description: AON watchdog
      - description: control words of the three CPU complexes
      - description: SoC power gate, wake and retention voters
      - description: clock generator, the clock mux park words
      - description: SPMI controller of the PMU (boot stage, notify, hibernate)
      - description: second SPMI controller's notify word
      - description: MasterMini block with the S2R timer
      - description: SOC-East retention and power words
      - description: PMGR power words of the west axi2af bridges
      - description: AOP global block, S2R control and wake masks

  reg-names:
    items:
      - const: cpu-start
      - const: wdt
      - const: cluster-ctl
      - const: soc-pwrgate
      - const: clkgen
      - const: spmi0
      - const: spmi-a0
      - const: mastermini
      - const: soc-east
      - const: soc-ps
      - const: aop-global

  apple,check-ps-b4-sleep:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description:
      The display pipes whose power states have to be off before a sleep, one
      entry per pipe.
    items:
      items:
        - description: PMGR syscon
        - description: offset of the pipe's CPU power state
        - description: offset of its last sub-block's power state

  apple,check-ps-b4-sleep-names:
    $ref: /schemas/types.yaml#/definitions/string-array
    description: One name per apple,check-ps-b4-sleep entry.

  apple,apcie:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      The PCIe host whose shared registers and tunables the storage controller's
      link depends on. The boot loader adds it, with those registers and
      tunables on the host's node. Without it the storage controller can't be
      stopped for a sleep.

required:
  - compatible
  - reg
  - reg-names
  - apple,check-ps-b4-sleep
  - apple,check-ps-b4-sleep-names

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        sleep-controller@502888000 {
            compatible = "apple,t6040-sleep";
            reg = <0x5 0x02888000 0x0 0x20>,
                  <0x5 0x0836c000 0x0 0x4000>,
                  <0x5 0x02820000 0x0 0x20>,
                  <0x5 0x0282c000 0x0 0x1000>,
                  <0x5 0x00000000 0x0 0x80000>,
                  <0x5 0x09014000 0x0 0x1000>,
                  <0x5 0x09188000 0x0 0x1000>,
                  <0x5 0x08900000 0x0 0x8000>,
                  <0x5 0x02280000 0x0 0x1000>,
                  <0x5 0x02800000 0x0 0x1000>,
                  <0x5 0x08004000 0x0 0x1000>;
            reg-names = "cpu-start", "wdt", "cluster-ctl", "soc-pwrgate",
                        "clkgen", "spmi0", "spmi-a0", "mastermini",
                        "soc-east", "soc-ps", "aop-global";
            apple,check-ps-b4-sleep = <&pmgr_disp 0x0 0x58>;
            apple,check-ps-b4-sleep-names = "disp";
        };
    };
