%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,m3-error-handler.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M3 family fabric error reporting interface

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the M3 family fabric error reporting interface.
  The interface is described for discovery and must remain disabled until
  its ownership, initialization and shutdown are supported. Register windows
  are listed in hardware resource order; firmware configuration and tuning
  data are supplied by the boot firmware rather than this binding.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t8122-error-handler
          - apple,t6030-error-handler
          - apple,t6031-error-handler
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t8122-error-handler
          - apple,t6030-error-handler
          - apple,t6031-error-handler
      - const: apple,error-handler

  reg:
    minItems: 19
    maxItems: 123

  interrupts:
    minItems: 39
    maxItems: 159

  power-domains:
    minItems: 1
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false
