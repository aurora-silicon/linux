%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,esm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple secure SEP manager transport

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Secure SEP manager transport register aperture and interrupts. This is
  separate from the ordinary SEP mailbox and has no qualified AP client.

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,t8142-esm
          - const: apple,esm
      - items:
          - const: apple,t8152-esm
          - const: apple,esm
      - items:
          - const: apple,t8140-esm
          - const: apple,esm

  reg:
    maxItems: 1
    description: Register apertures in hardware-description order.

  interrupts:
    minItems: 2
    maxItems: 2

  iommus:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - iommus

additionalProperties: false
