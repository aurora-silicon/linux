%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,t8142-isp-complex.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8142 image signal processor complex

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  Image signal processor complex on T8142. This describes the complete register complex,
  including auxiliary control and status apertures shared with firmware.
  It does not imply compatibility with an earlier generation's driver.
  The node remains disabled until ownership of the register windows and
  the firmware handoff have been established. Calibration, firmware and
  programming sequences are supplied separately by the boot environment.

select:
  properties:
    compatible:
      contains:
        const: apple,t8142-isp-complex
  required:
    - compatible

properties:
  compatible:
    items:
      - const: apple,t8142-isp-complex
      - const: apple,isp-complex

  reg:
    description: Controller register apertures, in hardware interface order.
    minItems: 3
    maxItems: 3

  interrupts:
    description: Interrupt lines wired to the system interrupt controller.
    minItems: 5
    maxItems: 5

  iommus:
    description: DMA translation streams used by this controller.
    minItems: 10
    maxItems: 10

  power-domains:
    description: Power and combined clock gates required by the controller.
    minItems: 2
    maxItems: 2

required:
  - compatible
  - reg

additionalProperties: false
