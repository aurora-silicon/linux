%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,rtk-helper-asc4.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple RTKit ASC v4 transport helper

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  The MTP coprocessor provides firmware services used by the keyboard and
  trackpad transport. A client refers to the helper to coordinate startup
  through its RTKit mailbox. The helper has a control aperture, shared SRAM
  and a DART stream. Firmware contents and boot configuration are supplied
  by the bootloader.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6020-rtk-helper-asc4
          - apple,t8112-rtk-helper-asc4
  required:
    - compatible

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,t6020-mtp
          - const: apple,t6020-rtk-helper-asc4
          - const: apple,mtp
          - const: apple,rtk-helper-asc4
      - items:
          - const: apple,t8112-mtp
          - const: apple,t8112-rtk-helper-asc4
          - const: apple,mtp
          - const: apple,rtk-helper-asc4

  reg:
    items:
      - description: Coprocessor control registers
      - description: Shared SRAM

  reg-names:
    items:
      - const: asc
      - const: sram

  mboxes:
    maxItems: 1

  iommus:
    maxItems: 1

  '#helper-cells':
    const: 0
    description: The helper reference has no arguments.

required:
  - compatible
  - reg
  - reg-names
  - mboxes
  - iommus
  - '#helper-cells'

additionalProperties: false
