%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,aop.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Always-On Processor

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  The Always-On Processor runs firmware that owns audio and sensor services.
  The host uses an RTKit mailbox and a DART stream to exchange messages and
  buffers. Service nodes do not have independent host MMIO or interrupts.

select:
  anyOf:
    -
      properties:
        compatible:
          items:
            - enum:
                - apple,t6020-aop
                - apple,t8112-aop
      required:
        - compatible
    -
      properties:
        compatible:
          items:
            -
              const: "apple,t6050-aop"
            -
              const: "apple,t8152-aop"
      required:
        - "compatible"

properties:
  "compatible": true
  "reg": true
  mboxes:
    maxItems: 1
  mbox-names:
    const: mbox
  "iommus": true
  audio:
    $ref: /schemas/sound/apple,aop-audio.yaml#
  als:
    $ref: /schemas/iio/light/apple,aop-als.yaml#
  las:
    $ref: /schemas/iio/position/apple,aop-las.yaml#
  accel:
    $ref: /schemas/iio/imu/apple,aop-motion.yaml#
  gyro:
    $ref: /schemas/iio/imu/apple,aop-motion.yaml#
  reg-names: true
  nonposted-mmio: true

additionalProperties: true

allOf:
  - if:
      properties:
        compatible:
          items:
            -
              const: "apple,t6050-aop"
            -
              const: "apple,t8152-aop"
      required:
        - "compatible"
    then:
      properties:
        compatible:
          items:
            -
              const: "apple,t6050-aop"
            -
              const: "apple,t8152-aop"
        reg:
          minItems: 2
          maxItems: 2
        reg-names:
          minItems: 2
          maxItems: 2
        mboxes:
          maxItems: 1
        mbox-names:
          const: "mbox"
        iommus:
          maxItems: 1
        nonposted-mmio: true
        audio:
          $ref: "/schemas/sound/apple,aop-audio.yaml#"
      required:
        - "compatible"
        - "reg"
        - "reg-names"
        - "mboxes"
        - "mbox-names"
        - "iommus"
      additionalProperties: false
    else:
      properties:
        compatible:
          enum:
            - apple,t6020-aop
            - apple,t8112-aop

        reg:
          items:
            - description: Shared SRAM
            - description: Coprocessor registers

        mboxes:
          maxItems: 1

        mbox-names:
          const: mbox

        iommus:
          maxItems: 1

        audio:
          $ref: /schemas/sound/apple,aop-audio.yaml#

        als:
          $ref: /schemas/iio/light/apple,aop-als.yaml#

        las:
          $ref: /schemas/iio/position/apple,aop-las.yaml#

        accel:
          $ref: /schemas/iio/imu/apple,aop-motion.yaml#

        gyro:
          $ref: /schemas/iio/imu/apple,aop-motion.yaml#
      required:
        - compatible
        - reg
        - mboxes
        - mbox-names
        - iommus
      additionalProperties: false
