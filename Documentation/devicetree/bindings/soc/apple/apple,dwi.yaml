%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,dwi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple DWI controller

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  DWI hardware register window and interrupt. Register programming and
  firmware ownership must be qualified before enabling the controller.

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,t6041-dwi
          - const: apple,dwi
      - items:
          - const: apple,t8140-dwi
          - const: apple,dwi

  reg:
    minItems: 1
    maxItems: 1
    description: Register apertures in hardware-description order.

  interrupts:
    minItems: 1
    maxItems: 1

  power-domains:
    minItems: 1
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - power-domains

additionalProperties: false
