%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,t8152-pwm-controller.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8152 fixed-frequency pwm controller

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  Fixed-frequency PWM controller on T8152. This describes the complete register complex,
  including auxiliary control and status apertures shared with firmware.
  It does not imply compatibility with an earlier generation's driver.
  The node remains disabled until ownership of the register windows and
  the firmware handoff have been established. Calibration, firmware and
  programming sequences are supplied separately by the boot environment.

select:
  properties:
    compatible:
      contains:
        const: apple,t8152-pwm-controller
  required:
    - compatible

properties:
  compatible:
    items:
      - const: apple,t8152-pwm-controller
      - const: apple,pwm-controller

  reg:
    description: Controller register apertures, in hardware interface order.
    minItems: 1
    maxItems: 1

  interrupts:
    description: Interrupt lines wired to the system interrupt controller.
    minItems: 1
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false
