%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,pmp.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple power management co-processor

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  The PMP runs firmware loaded by the bootloader. Linux starts it through
  RTKit and supplies calibration copied from the Apple device tree. The
  bootloader must initialize the PMP DART address protection filter before
  Linux starts the firmware. Firmware-owned PMC power state must be retained.

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - apple,t6000-pmp-v2
              - apple,t6020-pmp-v2
              - apple,t6030-pmp-v2
              - apple,t6031-pmp-v2
              - apple,t6041-pmp-v2
              - apple,t8122-pmp-v2
              - apple,t8132-pmp-v2
              - apple,t8140-pmp-v2
      required:
        - compatible
    -
      properties:
        compatible:
          allOf:
            -
              contains:
                enum:
                  - apple,t8142-pmp
                  - apple,t8152-pmp
                  - apple,t6050-pmp
            -
              contains:
                const: apple,pmp
      required:
        - compatible
allOf:
  -
    if:
      anyOf:
        -
          properties:
            compatible:
              allOf:
                -
                  contains:
                    enum:
                      - apple,t8142-pmp
                      - apple,t8152-pmp
                      - apple,t6050-pmp
                -
                  contains:
                    const: apple,pmp
            status:
              const: disabled
          required:
            - compatible
            - status
          not:
            required:
              - mboxes
    then:
      oneOf:
        -
          type: object
          description: |
            Apple power management processor. Initial resource description for an unsupported
            firmware/backend layout. Register, IRQ and DMA topology can be recorded before a driver
            exists. This form must stay disabled; it does not substitute for the enabled driver contract
            or supply firmware, calibration, programming sequences or unresolved providers.
          properties:
            compatible:
              items:
                -
                  enum:
                    - apple,t8142-pmp
                    - apple,t8152-pmp
                    - apple,t6050-pmp
                -
                  const: apple,pmp
            status:
              const: disabled
            reg:
              description: |
                Register apertures of the complete hardware complex, in hardware interface order.
              minItems: 4
              maxItems: 5
            interrupts:
              description: Interrupt lines wired to the system interrupt controller.
              minItems: 3
              maxItems: 4
            iommus:
              description: DMA translation streams emitted by this hardware.
              maxItems: 1
            power-domains:
              description: Power and combined clock gates required by this hardware.
              minItems: 2
              maxItems: 2
          required:
            - compatible
            - reg
            - status
          additionalProperties: false
    else:
      $ref: "#/$defs/legacy-driver"

unevaluatedProperties: false

$defs:
  legacy-driver:
    type: object
    properties:
      compatible:
        oneOf:
          - items:
              - const: apple,t6020-pmp-v2
              - const: apple,t6000-pmp-v2
          - const: apple,t6000-pmp-v2
          - items:
              - enum:
                  - apple,t6030-pmp-v2
                  - apple,t6031-pmp-v2
                  - apple,t6041-pmp-v2
                  - apple,t8122-pmp-v2
                  - apple,t8132-pmp-v2
                  - apple,t8140-pmp-v2
              - const: apple,t6000-pmp-v2

      reg:
        items:
          - description: Firmware SRAM
          - description: ASC control registers

      reg-names:
        items:
          - const: pmp
          - const: asc

      mboxes:
        maxItems: 1

      mbox-names:
        const: mbox

      iommus:
        maxItems: 1

      power-domains:
        maxItems: 1

      apple,pmp-report:
        $ref: /schemas/types.yaml#/definitions/phandle
        description: Report provider whose running state qualifies device-power requests.

      apple,board-id:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: Board identifier copied by the bootloader.

      apple,dram-vendor-id:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: DRAM vendor identifier copied by the bootloader.

      apple,dram-capacity:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: Firmware DRAM capacity value copied by the bootloader.

      apple,dram-channel-disable:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: Disabled DRAM channel mask (boot argument DCHD), copied by the bootloader.

      apple,pmc:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: Boot argument PMC_, the PMGR's pmc value in the Apple device tree.

      apple,pmc-pmgr:
        $ref: /schemas/types.yaml#/definitions/uint32
        description:
          PMGR PMC configuration word from the Apple device tree. Bits 0 and 3
          are passed as the boot arguments PMCV and PMCB.

      apple,pmc-msg-disabled:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: Boot argument PMCX, from the Apple device tree.

      apple,soc-chip-variant:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: SoC chip variant (boot argument CVAR), copied by the bootloader.

      apple,pio-ranges:
        $ref: /schemas/types.yaml#/definitions/uint64-array
        minItems: 2
        description: Host physical address and size pairs mapped into firmware PIO space.
    patternProperties:
      '^apple,tunable-':
        $ref: /schemas/types.yaml#/definitions/uint8-array
        description: Opaque firmware calibration copied from the Apple device tree.
    required:
      - compatible
      - reg
      - reg-names
      - mboxes
      - mbox-names
      - iommus
    additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        pmp@300500000 {
            compatible = "apple,t8140-pmp-v2", "apple,t6000-pmp-v2";
            reg = <3 0x00500000 0 0xa0000>, <3 0x00e00000 0 0x4000>;
            reg-names = "pmp", "asc";
            mboxes = <&pmp_mbox>;
            mbox-names = "mbox";
            iommus = <&pmp_dart 0>;
        };
    };
