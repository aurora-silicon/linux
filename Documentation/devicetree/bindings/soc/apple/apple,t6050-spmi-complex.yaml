%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,t6050-spmi-complex.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T6050 spmi controller register complex

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  SPMI controller register complex on T6050. This describes the complete register complex,
  including auxiliary control and status apertures shared with firmware.
  It does not imply compatibility with an earlier generation's driver.
  The node remains disabled until ownership of the register windows and
  the firmware handoff have been established. Calibration, firmware and
  programming sequences are supplied separately by the boot environment.

select:
  properties:
    compatible:
      contains:
        const: apple,t6050-spmi-complex
  required:
    - compatible

properties:
  compatible:
    items:
      - const: apple,t6050-spmi-complex
      - const: apple,spmi-complex

  reg:
    description: Controller register apertures, in hardware interface order.
    minItems: 3
    maxItems: 3

required:
  - compatible
  - reg

additionalProperties: false
