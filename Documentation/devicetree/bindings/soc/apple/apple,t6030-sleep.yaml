%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,t6030-sleep.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T6030 system sleep controls

maintainers:
  - Aron van de Pol <hello@aronvandepol.com>

description: |
  The registers a kernel running directly at EL2 on the M3 Pro writes to enter
  and return from suspend-to-RAM: the sleep commit word, the PMGR's power
  states, power gates, CPU-start block and CPU complex words, the AON
  watchdog, the AP wake-enable words and nub-spmi0; optionally nub-spmi-a0,
  the AON AP watchdog deadline, the clock-generator muxes, the CLLT word and
  the SoC perf word. They belong to several hardware blocks, some of which
  other drivers also use, so the driver does not claim them. Every address is
  from the J516S ADT.

properties:
  compatible:
    const: apple,t6030-sleep

  reg:
    minItems: 8
    maxItems: 13

  reg-names:
    minItems: 8
    items:
      - const: commit
      - const: ps
      - const: pwrgate
      - const: cpu-start
      - const: cluster
      - const: wdt
      - const: wake
      - const: spmi
      - const: spmi-a0
      - const: aon-deadline
      - const: clk-mux
      - const: cllt
      - const: soc-perf

  apple,wake-enable:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description:
      The wake source IDs left enabled across suspend-to-RAM (the ADT's
      pmgr ap-wake-sources). Every other source is masked.

  apple,apcie:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      The PCIe host whose shared registers and tunables the storage
      controller's link depends on, added by the boot loader.

  apple,pinctrl:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      The pin controller whose pins a deep sleep resets. Its pins are saved
      before a sleep and put back after it.

  apple,pinctrl-skip-pins:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description:
      Pins of that controller to leave alone across a sleep.

required:
  - compatible
  - reg
  - reg-names
  - apple,wake-enable

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        sleep-controller@3642d4000 {
            compatible = "apple,t6030-sleep";
            reg = <0x3 0x642d4000 0x0 0x4>,
                  <0x3 0x50700000 0x0 0x14000>,
                  <0x3 0x50724000 0x0 0x100>,
                  <0x3 0x50734000 0x0 0x10>,
                  <0x3 0x50780000 0x0 0x40>,
                  <0x3 0x642b0000 0x0 0x100>,
                  <0x3 0x64004000 0x0 0x100>,
                  <0x3 0x64714000 0x0 0x100>;
            reg-names = "commit", "ps", "pwrgate", "cpu-start", "cluster",
                        "wdt", "wake", "spmi";
            apple,wake-enable = <3 51 74 83>;
        };
    };
