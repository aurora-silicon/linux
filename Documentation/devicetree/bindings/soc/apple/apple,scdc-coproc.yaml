%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,scdc-coproc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Apple camera processing coprocessor
maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>
select:
  properties:
    compatible:
      allOf:
        -
          contains:
            enum:
              - apple,t8142-scdc-coproc
        -
          contains:
            const: apple,scdc-coproc
  required:
    - compatible
description: |
  Apple camera processing coprocessor. Initial resource description for an unsupported firmware/backend
  layout. Register, IRQ and DMA topology can be recorded before a driver exists. This form must stay
  disabled; it does not substitute for the enabled driver contract or supply firmware, calibration,
  programming sequences or unresolved providers.
properties:
  compatible:
    items:
      -
        enum:
          - apple,t8142-scdc-coproc
      -
        const: apple,scdc-coproc
  status:
    const: disabled
  reg:
    description: Register apertures of the complete hardware complex, in hardware interface order.
    minItems: 8
    maxItems: 8
  interrupts:
    description: Interrupt lines wired to the system interrupt controller.
    minItems: 5
    maxItems: 5
  iommus:
    description: DMA translation streams emitted by this hardware.
    minItems: 2
    maxItems: 2
  power-domains:
    description: Power and combined clock gates required by this hardware.
    maxItems: 1
required:
  - compatible
  - reg
  - status
additionalProperties: false
