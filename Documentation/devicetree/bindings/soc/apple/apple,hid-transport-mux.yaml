%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,hid-transport-mux.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple HID transport multiplexer

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Firmware HID transport multiplexer between the MTP and AOP services.
  The hardware description provides no independent register aperture.

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,t6041-hid-transport-mux
          - const: apple,hid-transport-mux
      - items:
          - const: apple,t8140-hid-transport-mux
          - const: apple,hid-transport-mux

required:
  - compatible

additionalProperties: false
