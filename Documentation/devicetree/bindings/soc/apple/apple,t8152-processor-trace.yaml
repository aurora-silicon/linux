%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/apple/apple,t8152-processor-trace.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8152 cpu processor trace windows

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  CPU processor trace windows on T8152. This describes the complete register complex,
  including auxiliary control and status apertures shared with firmware.
  It does not imply compatibility with an earlier generation's driver.
  The node remains disabled until ownership of the register windows and
  the firmware handoff have been established. Calibration, firmware and
  programming sequences are supplied separately by the boot environment.

select:
  properties:
    compatible:
      contains:
        const: apple,t8152-processor-trace
  required:
    - compatible

properties:
  compatible:
    items:
      - const: apple,t8152-processor-trace
      - const: apple,processor-trace

  reg:
    description: Controller register apertures, in hardware interface order.
    minItems: 22
    maxItems: 22

required:
  - compatible
  - reg

additionalProperties: false
