%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/apple,m3-aon-ptd.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M3 family always-on interrupt distributor

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the M3 family always-on interrupt distributor.
  The interface is described for discovery and must remain disabled until
  its ownership, initialization and shutdown are supported. Register windows
  are listed in hardware resource order; firmware configuration and tuning
  data are supplied by the boot firmware rather than this binding.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6031-aon-ptd
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t6031-aon-ptd
      - const: apple,aon-ptd

  reg:
    minItems: 4
    maxItems: 4

  interrupts:
    minItems: 32
    maxItems: 32

  '#address-cells':
    const: 0
  '#interrupt-cells':
    const: 1
  interrupt-controller: true

required:
  - compatible
  - reg
  - interrupts
  - interrupt-controller
  - '#interrupt-cells'
  - '#address-cells'

additionalProperties: false
