%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/apple,pcie-msi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple PCIe root port MSI controller

maintainers:
  - Thomas Glanzmann <thomas@glanzmann.de>

description: |
  The MSI maps of the Apple PCIe root ports that the bootloader trained
  and that Linux drives as a generic ECAM host. Endpoint MSI writes to the
  doorbell are routed by each port's map to a contiguous range of AIC
  interrupts. The ports of a root complex share that range, so one
  controller lists every port of the host.

allOf:
  - $ref: /schemas/interrupt-controller/msi-controller.yaml#

properties:
  compatible:
    const: apple,t8142-pcie-msi

  reg:
    minItems: 1
    maxItems: 3
    description: The MSI map registers of each root port.

  msi-controller: true

  msi-ranges:
    maxItems: 1

required:
  - compatible
  - reg
  - msi-controller
  - msi-ranges

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        msi-controller@488028000 {
            compatible = "apple,t8142-pcie-msi";
            reg = <0x4 0x88028000 0x0 0x8000>;
            msi-controller;
            msi-ranges = <&aic AIC_IRQ 1741 IRQ_TYPE_EDGE_RISING 32>;
        };
    };
