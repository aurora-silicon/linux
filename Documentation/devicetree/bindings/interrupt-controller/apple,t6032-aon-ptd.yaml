%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/apple,t6032-aon-ptd.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T6032 always-on interrupt distributor

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the T6032 always-on interrupt distributor. The package contains two
  peripheral dies. Register banks follow hardware resource order. The block
  remains disabled until its ownership and lifecycle are supported; firmware
  data and tuning are supplied separately by the boot firmware.

select:
  properties:
    compatible:
      contains:
        const: apple,t6032-aon-ptd
  required:
    - compatible

properties:
  compatible:
    items:
      - const: apple,t6032-aon-ptd
      - const: apple,aon-ptd

  reg:
    minItems: 4
    maxItems: 4

  interrupts:
    minItems: 32
    maxItems: 32

  interrupt-controller: true
  '#address-cells':
    const: 0
  '#interrupt-cells':
    const: 1

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false
