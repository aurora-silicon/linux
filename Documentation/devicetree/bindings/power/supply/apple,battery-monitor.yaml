%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/apple,battery-monitor.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple PMU battery monitor

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Battery-monitor function. T6041 uses a separate SPMI follower and
  telemetry-router source identifiers; T8140 is a function of the primary
  PMIC and signals through the SPMI interrupt controller. The monitor does
  not transfer ownership of PMIC control or battery policy to the host.

properties:
  compatible:
    items:
      - enum:
          - apple,t8103-battery-monitor
          - apple,t6000-battery-monitor
          - apple,t6041-battery-monitor
          - apple,t8140-battery-monitor
      - const: apple,battery-monitor

  reg:
    maxItems: 1

  interrupts:
    minItems: 1
    maxItems: 2

required:
  - compatible
  - interrupts

additionalProperties: false
