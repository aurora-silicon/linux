%YAML 1.2
---
$id: http://devicetree.org/schemas/power/apple,pmgr-pwrstate.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SoC PMGR Power States

maintainers:
  - Hector Martin <marcan@marcan.st>

allOf:
  - $ref: power-domain.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8132-pmgr-pwrstate
      required:
        - compatible
        - apple,inherited-on
    then:
      properties:
        apple,firmware-owned: false
        apple,always-on: false
        apple,min-state: false
        apple,force-disable: false
        apple,force-reset: false
        apple,externally-clocked: false

description: |
  Apple SoCs include PMGR blocks responsible for power management,
  which can control various clocks, resets, power states, and
  performance features. This binding describes the device power
  state registers, which control power states and resets.

  Each instance of a power controller within the PMGR syscon node
  represents a generic power domain provider, as documented in
  Documentation/devicetree/bindings/power/power-domain.yaml.
  The provider controls a single SoC block. The power hierarchy is
  represented via power-domains relationships between these nodes.

  See Documentation/devicetree/bindings/arm/apple/apple,pmgr.yaml
  for the top-level PMGR node documentation.

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              # Do not add additional SoC to this list.
              - apple,s5l8960x-pmgr-pwrstate
              - apple,t7000-pmgr-pwrstate
              - apple,s8000-pmgr-pwrstate
              - apple,t8010-pmgr-pwrstate
              - apple,t8015-pmgr-pwrstate
              - apple,t8103-pmgr-pwrstate
              - apple,t8112-pmgr-pwrstate
              - apple,t6000-pmgr-pwrstate
          - const: apple,pmgr-pwrstate
      - items:
          - enum:
              - apple,t6020-pmgr-pwrstate
              - apple,t6030-pmgr-pwrstate
              - apple,t6031-pmgr-pwrstate
              - apple,t6041-pmgr-pwrstate
              - apple,t8122-pmgr-pwrstate
              - apple,t8132-pmgr-pwrstate
              - apple,t8140-pmgr-pwrstate
              - apple,t8142-pmgr-pwrstate
          - const: apple,t8103-pmgr-pwrstate

  reg:
    maxItems: 1

  "#power-domain-cells":
    const: 0

  "#reset-cells":
    const: 0

  power-domains:
    description:
      Reference to parent power domains. A domain may have multiple parents,
      and all will be powered up when it is powered.
    minItems: 1
    maxItems: 8 # Arbitrary, should be enough

  label:
    description:
      Specifies the name of the SoC domain being controlled. This is used to
      name the power/reset domains.

  apple,always-on:
    description:
      Forces this power domain to always be powered up.
    type: boolean

  apple,firmware-owned:
    description:
      The boot loader hands over active hardware whose power domain remains
      under firmware control. Its state register may not be CPU-accessible.
      The OS keeps the domain on and never accesses its state register,
      including reads, power target, automatic gating and reset. Availability
      is supplied by the firmware handoff rather than determined by probing
      the power-state register.
    type: boolean

  apple,inherited-on:
    description:
      The boot loader hands over an active domain whose state register can be
      read, but whose power and reset transitions have not been handed over.
      Both target and actual state must already be active, with reset,
      auto-enable, reset-state, busy and device-disable indications clear.
      The OS verifies that state, retains an always-on domain, and refuses
      power-off and reset operations without writing its state register.
    type: boolean

  apple,min-state:
    description:
      Specifies the minimum power state for auto-PM.
      0 = power gated, 4 = clock gated, 15 = on.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 15

  apple,force-disable:
    description:
      Forces this device to be disabled (bus access blocked) when the power
      domain is powered down.
    type: boolean

  apple,force-reset:
    description:
      Forces a reset/error recovery of the power control logic when the power
      domain is powered down.
    type: boolean

  apple,no-auto-pm:
    description:
      Never enables automatic power management on this domain. Used for a
      coprocessor CPU domain whose firmware must not be clock or power gated
      behind its back, such as the external display controllers.
    type: boolean

required:
  - compatible
  - reg
  - "#power-domain-cells"
  - "#reset-cells"
  - label

additionalProperties: false
