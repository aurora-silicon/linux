%YAML 1.2
---
$id: http://devicetree.org/schemas/power/apple,t8152-psd.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8152 PMGR2 PSD service

maintainers:
  - Thomas Glanzmann <thomas@glanzmann.de>

description:
  On T8152, the video decoder, USB4 routers and their PHYs use PMGR2 PSD
  services. The reg property identifies the 0x100-byte register block for
  each service. The block contains a target-state request, an acknowledge
  bit and the current state (0 powered, 6 cold). Reading the state consumes
  the acknowledge. One node describes one service as a power domain.

allOf:
  - $ref: power-domain.yaml#

properties:
  compatible:
    const: apple,t8152-psd

  reg:
    maxItems: 1

  '#power-domain-cells':
    const: 0

  label:
    description: The service's name, for the power domain.

  apple,always-on:
    type: boolean
    description:
      Keep the service powered. For a service whose consumers cannot yet
      restore the state another agent set up in its blocks, such as a PHY
      configured by the bootloader.

required:
  - compatible
  - reg
  - '#power-domain-cells'

unevaluatedProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        power-controller@303a13200 {
            compatible = "apple,t8152-psd";
            reg = <0x3 0x03a13200 0x0 0x100>;
            #power-domain-cells = <0>;
            label = "avd";
        };
    };
