%YAML 1.2
---
$id: http://devicetree.org/schemas/power/apple,t8140-pmp-report.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8140 PMP report aperture

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  The PMP report aperture contains a read window and an update window.
  The PMP running bit qualifies the per-cluster fast-die effort. Lane 1
  tracks P-cluster load in Linux measurements. Lane 0 is assigned to the
  E cluster from the Apple device tree order and has not been observed
  changing. Only documented report entries may be read; the aperture is
  not a contiguous readable array of registers.

properties:
  compatible:
    const: apple,t8140-pmp-v2-report

  reg:
    maxItems: 1

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        pmp-report@3003c0000 {
            compatible = "apple,t8140-pmp-v2-report";
            reg = <3 0x003c0000 0 0x14000>;
        };
    };
