%YAML 1.2
---
$id: http://devicetree.org/schemas/net/apple,aqc107-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Aquantia Ethernet I2C sideband

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  The Ethernet controller exposes an I2C control interface in addition to
  its PCIe host interface. This node identifies the addressed sideband,
  not a second PCIe Ethernet controller.

properties:
  compatible:
    items:
      - enum:
          - apple,t8103-aqc107-i2c
          - apple,t6000-aqc107-i2c
      - const: apple,aqc107-i2c

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false
