%YAML 1.2
---
$id: http://devicetree.org/schemas/net/nfc/apple,stockholm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Stockholm NFC controller over SPMI

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Stockholm is an NCI NFC controller and embedded Secure Element connected as
  an SPMI follower. NCI frames are transferred through a non-incrementing FIFO
  register. A separate enable GPIO controls the deepest power state.

properties:
  compatible:
    const: apple,stockholm-nci

  reg:
    maxItems: 1

  interrupts:
    minItems: 3
    maxItems: 3

  interrupt-names:
    items:
      - const: host-wake
      - const: data-ready
      - const: error

  enable-gpios:
    maxItems: 1
    description: VEN, the controller's enable line; low is its deepest power state.

  apple,transport-crc16:
    type: boolean
    description: NCI frames carry the standard big-endian CRC-CCITT trailer.

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - enable-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/spmi/spmi.h>

    spmi {
        #address-cells = <2>;
        #size-cells = <0>;

        nfc@9 {
            compatible = "apple,stockholm-nci";
            reg = <9 SPMI_USID>;
            interrupts = <229 IRQ_TYPE_EDGE_RISING>,
                         <230 IRQ_TYPE_EDGE_RISING>,
                         <227 IRQ_TYPE_EDGE_RISING>;
            interrupt-names = "host-wake", "data-ready", "error";
            enable-gpios = <&smc_gpio 14 GPIO_ACTIVE_HIGH>;
        };
    };
