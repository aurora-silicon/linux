%YAML 1.2
---
$id: http://devicetree.org/schemas/net/nfc/apple,stockholm-spmi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple first-generation Stockholm SPMI endpoint

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  The endpoint occupies an SPMI follower address and exports seven event
  interrupts. Event roles and the firmware-controlled enable sequence are
  unqualified. This description does not select the later NCI transport.

properties:
  compatible:
    items:
      - enum:
          - apple,t8103-stockholm-spmi
          - apple,t6000-stockholm-spmi
          - apple,t8112-stockholm-spmi
      - const: apple,stockholm-spmi

  reg:
    maxItems: 1

  interrupts:
    minItems: 7
    maxItems: 7

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false
