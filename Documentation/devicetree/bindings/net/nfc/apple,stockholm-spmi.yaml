%YAML 1.2
---
$id: http://devicetree.org/schemas/net/nfc/apple,stockholm-spmi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple first-generation Stockholm SPMI endpoint

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  The endpoint occupies an SPMI follower address and exports seven event
  interrupts, of which three have a known role: the transport error, host
  wake and receive data ready. VEN enables the controller.

properties:
  compatible:
    items:
      - enum:
          - apple,t8103-stockholm-spmi
          - apple,t6000-stockholm-spmi
          - apple,t8112-stockholm-spmi
      - const: apple,stockholm-spmi

  reg:
    maxItems: 1

  interrupts:
    minItems: 7
    maxItems: 7

  interrupt-names:
    items:
      - const: event0
      - const: event1
      - const: event2
      - const: error
      - const: event4
      - const: host-wake
      - const: data-ready

  enable-gpios:
    maxItems: 1
    description: VEN, the controller enable line.

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false
