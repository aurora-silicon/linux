%YAML 1.2
---
$id: http://devicetree.org/schemas/net/wireless/apple,centauri.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple N1 Centauri Control PCI function

maintainers:
  - Dj <hey@djdev.me>

description: |
  PCI function zero owns the shared N1 firmware bootstrap. The boot producer
  supplies the personalized FTAB filename and packed firmware platform ID.
  The endpoint must be left in its stopped ROM personality with DMA and MSI
  quiesced. The host's root-port reset retrains the link after the ROM
  bootstrap. This binding does not authorize adopting an existing live
  firmware session or releasing another owner's retained DART streams.

  The T8142 native transport uses the same PCI function IDs but is a
  different firmware profile. Its SoC-specific compatible identifies this
  binding profile; the generic PCI compatible is retained as the fallback.
  Runtime driver selection continues to use the PCI ID and host SoC, and the
  native driver selects personalized firmware and transport data from its
  root-board match table rather than the T6050 wire-protocol properties.

properties:
  compatible:
    oneOf:
      - enum:
          - pci106b,1900
          - pci106b,1901
      - items:
          - const: apple,t8142-centauri-control
          - const: pci106b,1900

  reg:
    maxItems: 1
    description: Standard five-cell PCI function address

  firmware-name:
    $ref: /schemas/types.yaml#/definitions/string
    description: Personalized FTAB including the required per-device calibration

  apple,centauri-platform-id:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Firmware chip ID in bits 15..0 and board ID in bits 30..16

  apple,centauri-protocol:
    $ref: /schemas/types.yaml#/definitions/uint32
    const: 27
    description: Shared firmware wire protocol profile

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8142-centauri-control
    then:
      properties:
        firmware-name: false
        apple,centauri-platform-id: false
        apple,centauri-protocol: false
    else:
      required:
        - firmware-name
        - apple,centauri-platform-id
        - apple,centauri-protocol

required:
  - compatible
  - reg

additionalProperties: false
