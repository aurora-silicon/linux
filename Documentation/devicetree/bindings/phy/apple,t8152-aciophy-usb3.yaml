%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/apple,t8152-aciophy-usb3.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8152 ACIOPHY in USB3 mode

maintainers:
  - Thomas Glanzmann <thomas@glanzmann.de>

description:
  The Type-C PHY (ACIOPHY) of the Apple T8152 (M6) SoC, used as the USB3 PHY
  of a port that is wired to a fixed USB3 device instead of a Type-C
  connector, such as the on-board hub behind the Mac mini (2026) front ports.
  The PHY also switches the PIPE handler of its DWC3 controller between the
  controller's dummy PHY and the ACIOPHY.

$defs:
  apple,tunable:
    $ref: /schemas/types.yaml#/definitions/uint32-matrix
    minItems: 1
    maxItems: 512
    items:
      items:
        - description: Register offset into the ATC PHY block
        - description: Mask to be applied to the register value
        - description: Bits to be set after applying the mask
    description:
      List of (register offset, mask, value) tuples from the PHY's node in
      Apple's device tree. These values can differ between devices of the
      same model and likely contain calibration values.

properties:
  compatible:
    const: apple,t8152-aciophy-usb3

  reg:
    items:
      - description: ATC PHY block
      - description: PIPE handler of the DWC3 controller
      - description: PMGR power states of the ATC's DP_0, DP_1 and USB_AON
      - description: PMGR2 PSD service block of the ATC's common domain

  reg-names:
    items:
      - const: atc
      - const: pipehandler
      - const: atc-ps
      - const: atc-psd

  "#phy-cells":
    const: 0

  apple,tunable-pre:
    $ref: "#/$defs/apple,tunable"
    description:
      Register settings applied after the PHY power-up, before the lane
      crossbar is set up.

  apple,tunable-post:
    $ref: "#/$defs/apple,tunable"
    description:
      Register settings applied after the lane crossbar is set up, including
      those of the USB3 lane.

required:
  - compatible
  - reg
  - reg-names
  - "#phy-cells"
  - apple,tunable-pre
  - apple,tunable-post

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        phy@383000000 {
            compatible = "apple,t8152-aciophy-usb3";
            reg = <0x3 0x83000000 0x0 0x84000>,
                  <0x3 0x82414000 0x0 0x4000>,
                  <0x3 0x08290080 0x0 0x104>,
                  <0x3 0x03a13900 0x0 0xc0>;
            reg-names = "atc", "pipehandler", "atc-ps", "atc-psd";
            #phy-cells = <0>;
            apple,tunable-pre = <0x00800 0x00fc0000 0x00fc0000>;
            apple,tunable-post = <0x6c12c 0x0000801f 0x00000004>;
        };
    };
