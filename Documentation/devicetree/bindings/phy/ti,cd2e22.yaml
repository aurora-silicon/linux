%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/ti,cd2e22.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments CD2E22 eUSB2 to USB 2.0 repeater

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  The CD2E22 is a dual-channel eUSB2 to USB 2.0 repeater with an I2C
  configuration interface. Board-specific tuning is supplied by firmware and
  is represented as masked 8-bit register updates. The operating-system driver
  deliberately has no built-in fallback values.

properties:
  compatible:
    const: ti,cd2e22

  reg:
    maxItems: 1

  "#phy-cells":
    const: 0

  ti,port:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    description: Repeater channel connected to this PHY consumer.

  apple,tunable:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 4
    maxItems: 1024
    description: |
      Packed (register, mask, value, reserved) byte tuples copied verbatim
      from the corresponding firmware device-tree property by the bootloader.
      The reserved byte must be zero. Each entry applies
      (old & ~mask) | (value & mask).

required:
  - compatible
  - reg
  - "#phy-cells"
  - ti,port

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        usb_repeater: phy@21 {
            compatible = "ti,cd2e22";
            reg = <0x21>;
            #phy-cells = <0>;
            ti,port = <0>;
            apple,tunable = [ 01 0f 05 00 ];
        };
    };
...
