%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/apple,dptx-phy.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple DisplayPort transmitter PHY

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the Apple Silicon DisplayPort transmitter PHY.
  The interface is described for discovery and must remain disabled until
  its ownership, initialization and shutdown are supported. Register windows
  are listed in hardware resource order; firmware configuration and tuning
  data are supplied by the boot firmware rather than this binding.

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - apple,t8122-dptx-phy
      required:
        - compatible
    -
      properties:
        compatible:
          items:
            -
              const: "apple,t6050-dptx-phy"
            -
              const: "apple,dptx-phy"
      required:
        - "compatible"

properties:
  compatible: true
  reg: true
  power-domains: true
  "#phy-cells": true
  interrupts: true
  iommus: true
  clocks: true
  resets: true
  status: true

allOf:
  - if:
      anyOf:
        -
          properties:
            compatible:
              items:
                -
                  const: "apple,t6050-dptx-phy"
                -
                  const: "apple,dptx-phy"
            status:
              const: "disabled"
          required:
            - "compatible"
            - "status"
    then:
      oneOf:
        -
          description: "T6050 native resource description. Firmware ownership, backend support and enables require separate qualification. This variant remains disabled and contains no programming sequences or firmware data."
          properties:
            compatible:
              items:
                -
                  const: "apple,t6050-dptx-phy"
                -
                  const: "apple,dptx-phy"
            status:
              const: "disabled"
            reg:
              minItems: 2
              maxItems: 2
              description: "Native register apertures in hardware-interface order, including shared auxiliary views."
            power-domains:
              maxItems: 1
          required:
            - "compatible"
            - "reg"
            - "status"
            - "power-domains"
          additionalProperties: false
    else:
      properties:
        compatible:
          items:
            - enum:
                - apple,t8122-dptx-phy
            - const: apple,dptx-phy

        reg:
          minItems: 2
          maxItems: 2

        power-domains:
          maxItems: 1

        '#phy-cells':
          const: 0
      required:
        - compatible
        - reg
        - power-domains
        - '#phy-cells'
      additionalProperties: false
