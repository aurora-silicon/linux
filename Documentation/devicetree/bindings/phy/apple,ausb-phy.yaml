%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/apple,ausb-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T6000 AUSB port PHY

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  An AUSB port PHY has its own register aperture and control gate.
  Its shared USB3 PHY is described by the phys reference.

properties:
  compatible:
    items:
      - enum:
          - apple,t6000-ausb-phy
      - const: apple,ausb-phy

  reg:
    maxItems: 1

  power-domains:
    maxItems: 1

  phys:
    maxItems: 1

  '#phy-cells':
    const: 0

required:
  - compatible
  - reg
  - power-domains
  - phys
  - '#phy-cells'

additionalProperties: false
