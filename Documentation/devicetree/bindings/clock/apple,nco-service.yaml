%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/apple,nco-service.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple firmware NCO clock service

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Firmware-managed numerically controlled oscillator service. Unlike the
  directly programmed NCO binding, no AP register window is published.
  The input selectors identify clocks in the PMGR clock namespace.

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,t8140-nco-service
          - const: apple,nco-service

  clocks:
    minItems: 4
    maxItems: 4

required:
  - compatible
  - clocks

additionalProperties: false
