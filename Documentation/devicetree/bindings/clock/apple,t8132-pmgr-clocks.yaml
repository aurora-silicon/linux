%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/apple,t8132-pmgr-clocks.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8132 peripheral clock namespace

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  PMGR peripheral clock outputs identified by the hardware clock IDs.
  The provider describes the wiring without assuming fixed frequencies
  or programming sequences. It remains disabled until a clock driver can
  manage those outputs. The single clock specifier is the hardware clock ID.

select:
  properties:
    compatible:
      contains:
        const: apple,t8132-pmgr-clocks
  required:
    - compatible

properties:
  compatible:
    items:
      - const: apple,t8132-pmgr-clocks
      - const: apple,pmgr-clocks

  '#clock-cells':
    const: 1

required:
  - compatible
  - '#clock-cells'

additionalProperties: false
