%YAML 1.2
---
$id: http://devicetree.org/schemas/iommu/apple,dart.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple DART IOMMU

maintainers:
  - Sven Peter <sven@svenpeter.dev>

description: |+
  Apple SoCs may contain an implementation of their Device Address
  Resolution Table which provides a mandatory layer of address
  translations for various masters.

  Depending on the generation, a DART instance handles up to 256 streams
  with individual pagetables and page-level read/write protection flags.

  This DART IOMMU also raises interrupts in response to various
  fault conditions.

properties:
  compatible:
    oneOf:
      - enum:
          - apple,t8103-dart
          - apple,t8103-usb4-dart
          - apple,t8110-dart
          - apple,t6000-dart
      - items:
          - enum:
              - apple,t6000-dart
              - apple,t8112-dart
          - const: apple,t8110-dart
      - items:
          - enum:
              - apple,t6020-dart
              - apple,t6041-dart
              - apple,t8122-dart
              - apple,t8132-dart
              - apple,t8140-dart
              - apple,t8142-dart
          - const: apple,t8110-dart

  apple,managed-sids:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    items:
      - const: 1
      - const: 2
    description: >
      J713 radio ordinary stream ownership profile. Only these inactive
      normal streams and their exact-RID entries may be adopted by the OS.
      Other streams and RID entries remain inherited. The documented static
      SID16 bypass role may be initialized only from a disabled stream with
      no valid root; an existing bypass remains unchanged. PIODMA and other
      reserved roles are not modified. This does not authorize a controller
      reset or takeover of active page tables. Both the radio DART and PCI
      host describe the same two ordinary streams. Error reporting must
      already be unmasked at admission; the OS preserves the inherited global
      error-mask policy rather than changing it for these streams.

  reg:
    minItems: 1
    items:
      - description: DART registers
      - description:
          Address filter (DAPF) registers, which restrict the physical
          addresses the DART lets its masters reach

  reg-names:
    minItems: 1
    items:
      - const: dart
      - const: dapf

  interrupts:
    maxItems: 1

  clocks:
    description:
      Reference to the gate clock phandle if required for this IOMMU.
      Optional since not all IOMMUs are attached to a clock gate.

  '#iommu-cells':
    enum: [1, 5]
    description:
      One cell describes the stream ID emitted by a master. Five cells
      describe the stream ID followed by the 64-bit base and length of its
      device-visible DMA window.

  power-domains:
    maxItems: 1

  apple,dma-range:
    $ref: /schemas/types.yaml#/definitions/uint64-array
    minItems: 2
    maxItems: 2
    description: >
      Device-visible DMA aperture encoded as a base and a nonzero size. The
      IOMMU DMA allocator restricts mappings to this range; high address bits
      may select a firmware-visible alias of the translation aperture.
      A consumer may further specify its own aperture in its binding.

  apple,dma-offset:
    $ref: /schemas/types.yaml#/definitions/uint64
    description: >
      Offset added to device-visible DMA addresses when indexing the DART page
      tables. This models host bridges which alias a low PCI bus aperture into
      a high DART translation window.

  apple,firmware-root-handoff:
    $ref: /schemas/types.yaml#/definitions/uint32
    const: 1
    description: >
      The bootloader has reserved the actual three-level locked root and leaf
      table pages as normal RAM and completed the display coprocessor power
      handoff. Linux retains occupied root slots and excludes their entire
      IOVA spans from allocation. This does not assert immutable descendants.

  apple,tunable:
    $ref: /schemas/types.yaml#/definitions/uint32-matrix
    items:
      items:
        - description: Register offset
        - description: Mask to be applied to the register value
        - description: Bits to be set after applying the mask
    description: >
      List of (register offset, mask, value) tuples copied from Apple's Device
      Tree by the bootloader and required to initialize dynamically powered
      DART instances.

  apple,remap-streams:
    $ref: /schemas/types.yaml#/definitions/uint32-matrix
    minItems: 1
    maxItems: 256
    items:
      items:
        - description: Source stream ID, unique within this list.
          maximum: 255
        - description: Destination stream ID, which must not itself be remapped.
          maximum: 15
    description:
      T8110 stream remaps. A source uses the destination stream's translation
      and filtering state without a separate page-table root. Source and
      destination must differ, and both must exist on the controller.

required:
  - compatible
  - reg
  - '#iommu-cells'
  - interrupts

allOf:
  - if:
      properties:
        reg:
          minItems: 2
      required:
        - reg
    then:
      required:
        - reg-names

additionalProperties: false

examples:
  - |+
    dart1: iommu@82f80000 {
      compatible = "apple,t8103-dart";
      reg = <0x82f80000 0x4000>;
      interrupts = <1 781 4>;
      #iommu-cells = <1>;
    };

    master1 {
      iommus = <&dart1 0>;
    };

  - |+
    dart2a: iommu@82f00000 {
      compatible = "apple,t8103-dart";
      reg = <0x82f00000 0x4000>;
      interrupts = <1 781 4>;
      #iommu-cells = <1>;
    };
    dart2b: iommu@82f80000 {
      compatible = "apple,t8103-dart";
      reg = <0x82f80000 0x4000>;
      interrupts = <1 781 4>;
      #iommu-cells = <1>;
    };

    master2 {
      iommus = <&dart2a 0>, <&dart2b 1>;
    };

  - |+
    dart3: iommu@8e8c0000 {
      compatible = "apple,t8132-dart", "apple,t8110-dart";
      reg = <0x8e8c0000 0xc000>, <0x8e8d0000 0x4000>;
      reg-names = "dart", "dapf";
      interrupts = <1 387 4>;
      #iommu-cells = <1>;
    };
