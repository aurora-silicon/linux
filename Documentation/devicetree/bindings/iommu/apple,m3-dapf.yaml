%YAML 1.2
---
$id: http://devicetree.org/schemas/iommu/apple,m3-dapf.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M3 family DMA address protection filter

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the M3 family DMA address protection filter.
  The interface is described for discovery and must remain disabled until
  its ownership, initialization and shutdown are supported. Register windows
  are listed in hardware resource order; firmware configuration and tuning
  data are supplied by the boot firmware rather than this binding.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t8122-dapf
          - apple,t6030-dapf
          - apple,t6031-dapf
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t8122-dapf
          - apple,t6030-dapf
          - apple,t6031-dapf
      - const: apple,dapf

  reg:
    minItems: 1
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false
