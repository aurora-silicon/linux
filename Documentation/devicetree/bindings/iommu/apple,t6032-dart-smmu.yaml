%YAML 1.2
---
$id: http://devicetree.org/schemas/iommu/apple,t6032-dart-smmu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T6032 system MMU companion

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the T6032 system MMU companion. The package contains two
  peripheral dies. Register banks follow hardware resource order. The block
  remains disabled until its ownership and lifecycle are supported; firmware
  data and tuning are supplied separately by the boot firmware.

select:
  properties:
    compatible:
      contains:
        const: apple,t6032-dart-smmu
  required:
    - compatible

properties:
  compatible:
    items:
      - const: apple,t6032-dart-smmu
      - const: apple,dart-smmu

  reg:
    minItems: 1
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false
