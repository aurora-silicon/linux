%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/via,vl122.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: VIA Labs VL122 USB 2.0 hub sideband interface

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  The VL122 exposes an I2C sideband configuration interface while its reset is
  asserted. Firmware supplies board-specific masked register updates. The
  driver identifies the attached hub and selects the matching firmware list;
  it deliberately has no built-in fallback tuning values.

properties:
  compatible:
    const: via,vl122

  reg:
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description:
      Hub reset. The management interface only answers while the hub is
      held in reset.

  usb-hub:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: USB device-tree node for the hub controlled by this interface.

  apple,tunable-vl:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 4
    maxItems: 1024
    description: VIA Labs variant tuning tuples.

  apple,tunable-vlf0:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 4
    maxItems: 1024
    description: VIA Labs variant 0xf0 tuning tuples.

  apple,tunable-gl:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 4
    maxItems: 1024
    description: Genesys Logic compatible-controller tuning tuples.

required:
  - compatible
  - reg
  - reset-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        usb-hub@2c {
            compatible = "via,vl122";
            reg = <0x2c>;
            reset-gpios = <&gpio 142 GPIO_ACTIVE_HIGH>;
            apple,tunable-vl = [ 07 ff 55 00 ];
            apple,tunable-vlf0 = [ 07 ff aa 00 ];
            apple,tunable-gl = [ 09 7f 08 00 ];
        };
    };
...
