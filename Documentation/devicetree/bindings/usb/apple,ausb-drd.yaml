%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/apple,ausb-drd.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T6000 AUSB dual-role controller

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  The AUSB controller has four register apertures and four interrupt
  sources. Both DMA translation banks use stream 3. Its PHY is separate.

properties:
  compatible:
    items:
      - enum:
          - apple,t6000-ausb-drd
      - const: apple,ausb-drd

  reg:
    minItems: 4
    maxItems: 4

  interrupts:
    minItems: 4
    maxItems: 4

  power-domains:
    maxItems: 1

  phys:
    maxItems: 1

  iommus:
    minItems: 2
    maxItems: 2

required:
  - compatible
  - reg
  - interrupts
  - power-domains
  - phys
  - iommus

additionalProperties: false
