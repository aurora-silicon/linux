%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/apple,sn201202x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments sn201202x Type-C Power Delivery controller

maintainers:
  - Sasha Finkelstein <k@chaosmail.tech>

description: |
  Texas Instruments sn201202x Type-C Power Delivery controller

  A variant of tps6598x controller also known as Apple ACE3
  present on hardware with Apple SoCs starting from the M3.

  The controller can be polled when interrupt resources are not supplied.

  T8132 omits the register-selection interrupt, so selection is polled while
  event, standby and wakeup notifications use interrupts.

properties:
  compatible:
    oneOf:
      - const: apple,sn201202x
      - items:
          - const: apple,t8132-sn201202x
          - const: apple,sn201202x

  reg:
    maxItems: 1

  interrupts:
    minItems: 3
    maxItems: 4

  interrupt-names:
    minItems: 3
    maxItems: 4

  wakeup-source: true

  connector:
    $ref: /schemas/connector/usb-connector.yaml#

required:
  - compatible
  - reg

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8132-sn201202x
    then:
      properties:
        interrupts:
          items:
            - description: Primary irq used for tps6598x events
            - description: Standby command completed
            - description: Wakeup command completed
        interrupt-names:
          items:
            - const: irq
            - const: sleep
            - const: wake
    else:
      properties:
        interrupts:
          items:
            - description: Primary irq used for tps6598x events
            - description: Logical register selection completed
            - description: Standby command completed
            - description: Wakeup command completed
        interrupt-names:
          items:
            - const: irq
            - const: select
            - const: sleep
            - const: wake

dependentRequired:
  interrupts: [interrupt-names]
  interrupt-names: [interrupts]

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/spmi/spmi.h>
    spmi {
        #address-cells = <2>;
        #size-cells = <0>;
        usb-pd@c {
            compatible = "apple,sn201202x";
            reg = <0xc SPMI_USID>;
            interrupts = <11 IRQ_TYPE_EDGE_RISING>,
                         <13 IRQ_TYPE_EDGE_RISING>,
                         <17 IRQ_TYPE_EDGE_RISING>,
                         <19 IRQ_TYPE_EDGE_RISING>;
            interrupt-names = "irq", "select", "sleep", "wake";

            connector {
                compatible = "usb-c-connector";
                label = "USB-C";

                port {
                    typec_ep: endpoint {
                        remote-endpoint = <&otg_ep>;
                    };
                };
            };
        };
    };
