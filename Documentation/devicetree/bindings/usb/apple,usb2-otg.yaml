%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/apple,usb2-otg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple USB2 OTG interface

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the Apple Silicon USB2 OTG interface.
  The interface is described for discovery and must remain disabled until
  its ownership, initialization and shutdown are supported. Register windows
  are listed in hardware resource order; firmware configuration and tuning
  data are supplied by the boot firmware rather than this binding.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t8122-usb2-otg
          - apple,t6030-usb2-otg
          - apple,t6031-usb2-otg
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t8122-usb2-otg
          - apple,t6030-usb2-otg
          - apple,t6031-usb2-otg
      - const: apple,usb2-otg

  reg:
    minItems: 2
    maxItems: 2

  interrupts:
    maxItems: 1

  iommus:
    minItems: 2
    maxItems: 2

  power-domains:
    maxItems: 1

  phys:
    maxItems: 1
  phy-names:
    const: usb2-phy

required:
  - compatible
  - reg
  - interrupts
  - iommus
  - power-domains
  - phys
  - phy-names

additionalProperties: false
