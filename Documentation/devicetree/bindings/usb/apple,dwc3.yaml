%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/apple,dwc3.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Silicon DWC3 USB controller

maintainers:
  - Sven Peter <sven@kernel.org>

description:
  Apple Silicon SoCs use a Synopsys DesignWare DWC3 based controller for each of
  their Type-C ports.

  On T8152 the bootloader can hand a controller over already running, powered
  and with the USB2 side of its ATC PHY set up for host mode. Such a controller
  is described by its DWC3 core region, as a host. Its PHY reset and power
  domain, and on a Type-C port its USB role switch, exist but are left to the
  bootloader, so they are optional.

allOf:
  - $ref: snps,dwc3-common.yaml#
  - if:
      properties:
        compatible:
          not:
            contains:
              enum:
                - apple,t8132-dwc3
                - apple,t8152-dwc3
    then:
      required:
        - power-domains
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8152-dwc3
    then:
      properties:
        dr_mode:
          const: host
      required:
        - dr_mode
    else:
      properties:
        reg:
          minItems: 2
        reg-names:
          minItems: 2
      required:
        - reg-names
        - resets
        - usb-role-switch

$defs:
  apple,tunable:
    $ref: /schemas/types.yaml#/definitions/uint32-matrix
    minItems: 1
    maxItems: 512
    items:
      items:
        - description: Register offset
        - description: Mask to be applied to the register value
        - description: Bits to be set after applying the mask
    description: >
      Controller table from the device's Apple device tree, applied after
      every core reset (T6040).

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - apple,t6000-dwc3
              - apple,t6020-dwc3
              - apple,t6030-dwc3
              - apple,t6031-dwc3
              - apple,t6040-dwc3
              - apple,t8112-dwc3
              - apple,t8122-dwc3
              - apple,t8140-dwc3
              - apple,t8142-dwc3
          - const: apple,t8103-dwc3
      - const: apple,t8103-dwc3
      - const: apple,t8132-dwc3
      - const: apple,t8152-dwc3

  reg:
    minItems: 1
    items:
      - description: Core DWC3 region
      - description: Apple-specific DWC3 region
      - description: Controller configuration block (T6040)

  reg-names:
    minItems: 1
    items:
      - const: dwc3-core
      - const: dwc3-apple
      - const: drd-cfg

  interrupts:
    maxItems: 1

  iommus:
    maxItems: 2

  resets:
    maxItems: 1

  power-domains:
    maxItems: 1

  apple,tunable-gbl-default:
    $ref: "#/$defs/apple,tunable"
    description: Tunables applied to the DWC3 global registers.

  apple,tunable-gbl-host:
    $ref: "#/$defs/apple,tunable"
    description: Host mode tunables applied to the DWC3 global registers.

  apple,tunable-dbg:
    $ref: "#/$defs/apple,tunable"
    description: Tunables applied to the debug registers of the Apple region.

  apple,tunable-cfg-host:
    $ref: "#/$defs/apple,tunable"
    description: Host mode tunables applied to the drd-cfg region.

  apple,tunable-link:
    $ref: "#/$defs/apple,tunable"
    description: Tunables applied to the link registers of the Apple region.

required:
  - compatible
  - reg
  - interrupts
  - iommus

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    usb@82280000 {
      compatible = "apple,t8103-dwc3";
      reg = <0x82280000 0xcd00>, <0x8228cd00 0x3200>;
      reg-names = "dwc3-core", "dwc3-apple";
      interrupts = <AIC_IRQ 777 IRQ_TYPE_LEVEL_HIGH>;
      iommus = <&dwc3_0_dart_0 0>, <&dwc3_0_dart_1 1>;

      power-domains = <&ps_atc0_usb>;
      resets = <&atcphy0>;

      usb-role-switch;
    };

  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    usb@82430000 {
      compatible = "apple,t8152-dwc3";
      reg = <0x82430000 0xcd00>;
      interrupts = <AIC_IRQ 1763 IRQ_TYPE_LEVEL_HIGH>;
      iommus = <&dwc3_2_dart_0 0>, <&dwc3_2_dart_1 1>;
      dr_mode = "host";
      maximum-speed = "high-speed";
      snps,dis_u2_susphy_quirk;
      snps,dis_u3_susphy_quirk;
    };
