%YAML 1.2
---
$id: http://devicetree.org/schemas/display/apple,dcp-ioreporting.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple secure display reporting service

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Secure display coprocessor reporting endpoint. It is a firmware service
  without an independently published AP MMIO window or interrupt. A host
  client must establish the reporting transport and its lifecycle before
  using it; the service is not an additional display engine.

properties:
  compatible:
    items:
      - const: apple,t8140-dcp-ioreporting
      - const: apple,dcp-ioreporting

required:
  - compatible

additionalProperties: false
