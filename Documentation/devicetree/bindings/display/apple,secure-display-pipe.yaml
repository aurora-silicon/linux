%YAML 1.2
---
$id: http://devicetree.org/schemas/display/apple,secure-display-pipe.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple secure display pipeline

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Secure display pipeline firmware endpoint, its interrupts and DART
  streams. Firmware retains control of the display registers.

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,t8140-secure-display-pipe
          - const: apple,secure-display-pipe

  interrupts:
    minItems: 4
    maxItems: 4

  iommus:
    minItems: 2
    maxItems: 2

required:
  - compatible
  - interrupts
  - iommus

additionalProperties: false
