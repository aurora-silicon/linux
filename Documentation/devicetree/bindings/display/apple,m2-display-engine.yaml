%YAML 1.2
---
$id: http://devicetree.org/schemas/display/apple,m2-display-engine.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M2 generation display engine

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Display engine resources on M2 generation SoCs. The register apertures
  follow hardware resource order. Firmware configuration and tuning are
  supplied by the bootloader and are not part of this binding. Unqualified
  instances must remain disabled.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6021-display-engine
          - apple,t6022-display-engine
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t6021-display-engine
          - apple,t6022-display-engine
      - const: apple,display-engine

  reg:
    maxItems: 5

  interrupts:
    maxItems: 12

  iommus:
    maxItems: 4

required:
  - compatible
  - reg
  - interrupts
  - iommus

additionalProperties: false
