%YAML 1.2
---
$id: http://devicetree.org/schemas/display/bridge/parade,dp855.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Parade DP855 panel timing controller

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Panel timing controller controlled through SPI. The controller also
  mediates access to panel management devices. Its downstream address
  transport must be established before exposing those clients on a host
  bus; the SPI chip select is not their downstream device address.

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: parade,dp855

  reg:
    maxItems: 1

  i2c:
    type: object
    $ref: /schemas/i2c/i2c-controller.yaml#
    description: Downstream panel management bus mediated by the timing controller.

    patternProperties:
      '^temperature-sensor@7[0-2]$':
        type: object
        $ref: /schemas/trivial-devices.yaml#

    unevaluatedProperties: false

required:
  - compatible
  - reg

unevaluatedProperties: false
