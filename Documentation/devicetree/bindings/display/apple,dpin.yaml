%YAML 1.2
---
$id: http://devicetree.org/schemas/display/apple,dpin.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple DisplayPort tunnel ingress

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  DisplayPort ingress registers and interrupt for a USB4 display tunnel.

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - apple,t6000-dpin
              - apple,t6020-dpin
              - apple,t6021-dpin
              - apple,t6022-dpin
              - apple,t6030-dpin
              - apple,t6031-dpin
              - apple,t6032-dpin
              - apple,t6041-dpin
              - apple,t8103-dpin
              - apple,t8112-dpin
              - apple,t8122-dpin
              - apple,t8132-dpin
      required:
        - compatible
    -
      properties:
        compatible:
          items:
            -
              const: apple,t6050-dpin
            -
              const: apple,dpin
      required:
        - compatible

properties:
  compatible: true
  reg: true
  interrupts: true
  iommus: true
  power-domains: true
  clocks: true
  resets: true
  status: true

additionalProperties: true

allOf:
  - if:
      anyOf:
        -
          properties:
            compatible:
              items:
                -
                  const: apple,t6050-dpin
                -
                  const: apple,dpin
            status:
              const: disabled
          required:
            - compatible
            - status
    then:
      oneOf:
        -
          description: |
            T6050 native resource description. Firmware ownership, backend support and enables require
            separate qualification. This variant remains disabled and contains no programming sequences or
            firmware data.
          properties:
            compatible:
              items:
                -
                  const: apple,t6050-dpin
                -
                  const: apple,dpin
            status:
              const: disabled
            reg:
              maxItems: 1
              description: |
                Native register apertures in hardware-interface order, including shared auxiliary views.
            interrupts:
              maxItems: 1
          required:
            - compatible
            - reg
            - status
            - interrupts
          additionalProperties: false
    else:
      properties:
        compatible: true
      allOf:
        - if:
            properties:
              compatible:
                contains:
                  enum:
                    - apple,t8132-dpin
            required:
              - compatible
          then:
            properties:
              compatible:
                items:
                  - enum:
                      - apple,t8132-dpin
                  - const: apple,dpin

              reg:
                maxItems: 1

              interrupts:
                maxItems: 1

            required:
              - compatible
              - reg
              - interrupts
          else:
            allOf:
              - if:
                  properties:
                    compatible:
                      contains:
                        enum:
                          - apple,t6032-dpin
                  required:
                    - compatible
                then:
                  properties:
                    compatible:
                      items:
                        - const: apple,t6032-dpin
                        - const: apple,dpin

                    reg:
                      maxItems: 1

                    interrupts:
                      maxItems: 1

                  required:
                    - compatible
                    - reg
                    - interrupts
                else:
                  properties:
                    compatible:
                      items:
                        - enum:
                            - apple,t6000-dpin
                            - apple,t6020-dpin
                            - apple,t6021-dpin
                            - apple,t6022-dpin
                            - apple,t6030-dpin
                            - apple,t6031-dpin
                            - apple,t6041-dpin
                            - apple,t8103-dpin
                            - apple,t8112-dpin
                            - apple,t8122-dpin
                        - const: apple,dpin

                    reg:
                      maxItems: 1
                      description: Register apertures in hardware-description order.

                    interrupts:
                      maxItems: 1

                  required:
                    - compatible
                    - reg
                    - interrupts

                  additionalProperties: false
      unevaluatedProperties: false
