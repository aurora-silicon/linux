%YAML 1.2
---
$id: http://devicetree.org/schemas/display/apple,dpin.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple DisplayPort tunnel ingress

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  DisplayPort ingress registers and interrupt for a USB4 display tunnel.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6041-dpin
          - apple,t6032-dpin
  required:
    - compatible

properties:
  compatible: true

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - apple,t6032-dpin
      required:
        - compatible
    then:
      properties:
        compatible:
          items:
            - const: apple,t6032-dpin
            - const: apple,dpin

        reg:
          minItems: 1
          maxItems: 1

        interrupts:
          minItems: 1
          maxItems: 1

      required:
        - compatible
        - reg
        - interrupts

    else:
      properties:
        compatible:
          oneOf:
            - items:
                - const: apple,t6041-dpin
                - const: apple,dpin

        reg:
          minItems: 1
          maxItems: 1
          description: Register apertures in hardware-description order.

        interrupts:
          minItems: 1
          maxItems: 1

      required:
        - compatible
        - reg
        - interrupts

unevaluatedProperties: false
