%YAML 1.2
---
$id: http://devicetree.org/schemas/display/apple,dcp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple display coprocessor

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description:
  Apple's Display Co-Processor (DCP) drives internal and external displays
  through an RTKit mailbox. Its piodma child uses a separate display DART
  stream from the coprocessor itself.

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - apple,t8103-dcp
              - apple,t8112-dcp
              - apple,t6000-dcp
              - apple,t6020-dcp
              - apple,t6041-dcp
              - apple,t6050-dcp
              - apple,t8140-dcp
              - apple,t8142-dcp
          - const: apple,dcp
      - items:
          - enum:
              - apple,t8103-dcpext
              - apple,t8112-dcpext
              - apple,t6000-dcpext
              - apple,t6020-dcpext
              - apple,t6041-dcpext
              - apple,t6050-dcpext
          - const: apple,dcpext
      - items:
          - const: apple,t8140-dcpext
          - const: apple,dcp
      - description:
          J713 internal display controller (T8132), whose inherited firmware
          session uses IOMFB 26.6.2. The loader publishes the firmware identity,
          reserved memory and validated display DART mappings.
        const: apple,t8132-dcp
      - description:
          J713 external display coprocessors (T8132), running the internal
          DCP's firmware. The boot loader can hand them over running; it then
          reserves their firmware memory, publishes the firmware identity and
          sets apple,t8132-dcpext-firmware-ready.
        const: apple,t8132-dcpext
      - description:
          T6031 (M3 Max) internal display controller. The display gate enables
          it after the boot loader has handed the running display over.
        const: apple,t6031-dcp

  reg:
    minItems: 2
    maxItems: 8

  reg-names:
    minItems: 2
    items:
      - const: coproc
      - const: disp-0
      - enum: [disp-1, iop-vbar]
      - enum: [disp-2, iop-vbar]
      - enum: [disp-3, iop-vbar]
      - enum: [disp-4, iop-vbar]
      - enum: [disp-5, iop-vbar, coproc-aux]
      - const: iop-vbar

  interrupts:
    minItems: 7
    maxItems: 16
    description: Optional host display-engine interrupt sources.

  mboxes:
    minItems: 1
    maxItems: 2

  mbox-names:
    minItems: 1
    items:
      - const: mbox
      - const: secure

  iommus:
    maxItems: 1

  power-domains:
    maxItems: 1

  dma-noncoherent: true

  resets:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 64

  clock-names:
    minItems: 1
    maxItems: 64

  apple,clock-ids:
    oneOf:
      - type: boolean
      - $ref: /schemas/types.yaml#/definitions/uint32-array
        minItems: 1
        maxItems: 64
    description: |
      Ordered firmware provider clock identifiers. Callback clock indices
      select the corresponding entry in clocks. An explicitly empty table
      is allowed when the provider has no clocks.

  apple,firmware-physical-regs:
    $ref: /schemas/types.yaml#/definitions/uint64-array
    minItems: 1
    maxItems: 10
    description: |
      Coprocessor physical base addresses in display register-table order,
      including the bandwidth scratch and optional doorbell windows.
      The number of entries must match the complete register table.
      Omit on identity-mapped systems; reg supplies the physical view.

  memory-region:
    minItems: 1
    maxItems: 64
    description:
      Boot framebuffer and reserved mappings. A T6050 external processor
      without a boot framebuffer may omit these regions and their names.

  memory-region-names:
    minItems: 1
    maxItems: 64

  phys:
    minItems: 1
    maxItems: 8

  phy-names:
    minItems: 1
    maxItems: 8
    items:
      pattern: '^(dp-phy|typec[0-9]+)$'

  apple,display-power:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      A node whose ps, pwrgate and pmc-dcp registers hold the display power
      words this coprocessor's driver writes around a firmware restart, such
      as an apple,t8140-display-power node.

  apple,bw-scratch:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: Phandle of the PMGR bandwidth register provider.
          - description: Index into the provider's reg property.
          - description: Index in the firmware display register table.
          - description: Byte offset of the scratch register within the resource.
    description: |
      PMGR bandwidth scratch resource, display index and offset. On the T8132
      external DCPs it is the pipe's 8-byte realtime bandwidth request slot,
      which lies inside the display register window the index names (disp-4).

  apple,bw-doorbell:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: Phandle of the PMGR bandwidth register provider.
          - description: Index into the provider's reg property.
          - description: Index in the firmware display register table.
    description: Optional PMGR bandwidth doorbell resource and display index.

  apple,iomfb-surfaces:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 4
    items:
      enum: [0, 1]
    description: |
      Per-slot enable flags, in slot order. The legacy J700 bootloader
      supplies a single zero to select surface zero instead.

  apple,power-lut-data-x:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 4
    maxItems: 4
    description: |
      First dimension of the display firmware power lookup table. The
      bootloader copies the disp0 ADT property verbatim, as a little-endian
      32-bit word, for transfer to the display firmware.

  apple,power-lut-data-y:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 4
    maxItems: 4
    description: |
      Second dimension of the display firmware power lookup table, copied
      verbatim from disp0 in the ADT as a little-endian 32-bit word.

  apple,power-lut-data-xindex:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 52
    maxItems: 52
    description: |
      First-axis indices of the display firmware power lookup table, copied
      verbatim from disp0 in the ADT as thirteen little-endian 32-bit words.
      These are firmware table inputs, not a Linux backlight range.

  apple,power-lut-data-yindex:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 4
    maxItems: 4
    description: |
      Second-axis index of the display firmware power lookup table, copied
      verbatim from disp0 in the ADT as a little-endian 32-bit word.

  apple,power-lut-data-lut:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 52
    maxItems: 52
    description: |
      Display firmware power lookup table, copied verbatim from disp0 in
      the ADT as thirteen little-endian 32-bit words. Linux passes these
      values to the firmware without interpreting or changing them.

  apple,firmware-uuid:
    $ref: /schemas/types.yaml#/definitions/string
    description: UUID of the inherited display firmware image.

  apple,j713-native-piodma:
    type: boolean
    description: Request loader validation of the inherited J713 PIODMA stream.

  apple,j713-native-scanout:
    type: boolean
    description: Request loader validation of the inherited J713 scanout stream.

  apple,panel-width-mm:
    maxItems: 1
    description: Physical width of the inherited internal panel.

  apple,panel-height-mm:
    maxItems: 1
    description: Physical height of the inherited internal panel.

  apple,firmware-version:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 3
    maxItems: 5
    description: Version reported by the loaded display firmware.

  apple,firmware-compat:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 3
    maxItems: 5
    description: Loader-provided firmware ABI version used for IOMFB selection.

  apple,t8132-dcpext-firmware-ready:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    description:
      Set to 1 by the boot loader once it has handed a T8132 external display
      coprocessor over running, with its firmware memory reserved. Without
      it the coprocessor is left alone.

  apple,connector-type:
    enum: [HDMI-A, DP, USB-C]

  apple,dcp-index:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Display coprocessor index on multi-DCP systems.

  apple,typec-hybrid-first:
    type: boolean
    description:
      A hybrid pipeline (a fixed output plus Type-C routes) is planned for a
      Type-C port before the other pipelines, while its fixed output has no
      sink, instead of being kept back for that output. Set where this
      pipeline is the only one that can be the primary of a display wider than
      one pipe.

  apple,dcp-endpoint:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      The display endpoint this coprocessor is to its firmware (its display
      index), by which two external pipes name each other when a display
      wider than one pipe is driven by two of them. 0 is the internal
      display.

  apple,dptx-phy:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: DisplayPort transmitter PHY selector.

  apple,dptx-die:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Die containing the DisplayPort transmitter.

  apple,notch-height:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Height in pixels reserved for the display notch.

  apple,pmc-interface:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      The PMC interface enables of this coprocessor's display pipe, an
      apple,consumer-switched interface node. The coprocessor clears them
      before it powers its display domains down while the display is off,
      and restores them after it powers them up again.

  apple,pmp-report:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      PMP report entry for this coprocessor's display request. The display
      firmware runs only once the PMP has acknowledged it.

  apple,typec-mux-indices:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 4
    description: Crossbar state for each Type-C display route.

  apple,typec-dptx-phys:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 4
    description: DisplayPort PHY index for each Type-C display route.

  mux-controls:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    minItems: 1
    maxItems: 21
    description: |
      T6030 and T8132 external DCPs may also name the two DP IN tunnel states
      of each Type-C crossbar, in addition to the fixed output and Type-C
      routes. T6050 has four DP IN states per crossbar and up to four
      Type-C routes, plus a fixed output.

  mux-control-names:
    minItems: 1
    maxItems: 21
    items:
      pattern: '^(dp-xbar|typec[0-9]+(-dpin[0-3])?)$'

  mux-index:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Crossbar state for a fixed output.

  hdmi-hpd-gpios:
    maxItems: 1

  hdmi-pwren-gpios:
    maxItems: 1

  dp2hdmi-pwren-gpios:
    maxItems: 1

  '#address-cells':
    const: 2

  '#size-cells':
    const: 2

  piodma:
    type: object
    properties:
      iommus:
        maxItems: 1
      dma-noncoherent: true
      memory-region:
        minItems: 1
        maxItems: 64
      apple,j713-inherited-mappings:
        type: boolean
        description: The loader validated the inherited J713 SID16 PIODMA mapping.
    required:
      - iommus
    additionalProperties: false

  panel:
    type: object
    properties:
      compatible:
        oneOf:
          - enum:
              - apple,panel
              - apple,panel-mini-led
          - items:
              - pattern: '^apple,panel-[jk][0-9]+$'
              - const: apple,panel
          - items:
              - pattern: '^apple,panel-[jk][0-9]+$'
              - const: apple,panel-mini-led
              - const: apple,panel
      width-mm:
        description: Physical panel width.
      height-mm:
        description: Physical panel height.
      adj-height-mm:
        description: Visible height below the notch.
      apple,max-brightness:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: Maximum firmware backlight level.
    required:
      - compatible
    additionalProperties: false

  typec-routes:
    type: object
    properties:
      '#address-cells':
        const: 1
      '#size-cells':
        const: 0
    patternProperties:
      '^route@[0-3]$':
        type: object
        properties:
          reg:
            maxItems: 1
          mode-switch:
            type: boolean
          port:
            $ref: /schemas/graph.yaml#/properties/port
        required:
          - reg
          - mode-switch
          - port
        additionalProperties: false
    required:
      - '#address-cells'
      - '#size-cells'
    additionalProperties: false

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

required:
  - compatible
  - reg
  - reg-names
  - mboxes
  - iommus

allOf:
  - if:
      not:
        properties:
          compatible:
            contains:
              enum: ['apple,t6050-dcp', 'apple,t6050-dcpext']
        required:
          - compatible
    then:
      properties:
        mux-controls:
          maxItems: 10
        mux-control-names:
          maxItems: 10
          items:
            pattern: '^(dp-xbar|typec[0-9]+(-dpin[01])?)$'
  - if:
      not:
        properties:
          compatible:
            contains:
              enum: ['apple,t6030-dcpext', 'apple,t8132-dcpext',
                     'apple,t6050-dcp', 'apple,t6050-dcpext']
        required:
          - compatible
    then:
      properties:
        mux-controls:
          maxItems: 8
        mux-control-names:
          maxItems: 8
          items:
            pattern: '^(dp-xbar|typec[0-9]+)$'
  - if:
      allOf:
        - not:
            properties:
              compatible:
                contains:
                  enum: ['apple,t6031-dcp', 'apple,t8132-dcp', 'apple,t8132-dcpext']
        - not:
            properties:
              status:
                const: disabled
            required:
              - status
    then:
      required:
        - apple,bw-scratch
  - if:
      properties:
        compatible:
          contains:
            enum: ['apple,t6050-dcp', 'apple,t6050-dcpext']
    then:
      required:
        - apple,clock-ids
        - apple,firmware-compat
      dependencies:
        memory-region: [memory-region-names]
        memory-region-names: [memory-region]
      allOf:
        - if:
            properties:
              compatible:
                contains:
                  const: apple,t6050-dcp
          then:
            required:
              - memory-region
              - memory-region-names
      properties:
        apple,firmware-compat:
          items:
            - const: 27
            - const: 0
            - const: 0
  - if:
      not:
        properties:
          compatible:
            contains:
              enum: ['apple,t6050-dcp', 'apple,t6050-dcpext', 'apple,t8142-dcp']
    then:
      properties:
        clocks:
          maxItems: 2
        clock-names:
          items:
            - const: clock-154
            - const: clock-194
        apple,clock-ids: false
        apple,firmware-physical-regs: false
  # T8142 runs both 26.x and 27.0 DCP firmware. The 26.x paths use the first
  # clock; firmware 27 asks for the provider clocks of apple,clock-ids by
  # index, as firmware-0 and firmware-1.
  - if:
      properties:
        compatible:
          contains:
            const: apple,t8142-dcp
    then:
      properties:
        clocks:
          minItems: 1
          maxItems: 3
        clock-names:
          minItems: 1
          items:
            - const: clock-154
            - const: firmware-0
            - const: firmware-1
        apple,firmware-physical-regs: false
  - if:
      not:
        properties:
          compatible:
            contains:
              enum: ['apple,t8140-dcp', 'apple,t8140-dcpext', 'apple,t6050-dcp', 'apple,t6050-dcpext']
    then:
      properties:
        apple,power-lut-data-x: false
        apple,power-lut-data-y: false
        apple,power-lut-data-xindex: false
        apple,power-lut-data-yindex: false
        apple,power-lut-data-lut: false
  - if:
      properties:
        compatible:
          contains:
            enum: ['apple,t8140-dcp', 'apple,t8140-dcpext',
                   'apple,t6050-dcp', 'apple,t6050-dcpext']
    then:
      properties:
        resets: false

unevaluatedProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        dcp@231c00000 {
            compatible = "apple,t8103-dcp", "apple,dcp";
            reg = <0x2 0x31c00000 0x0 0x4000>,
                  <0x2 0x30000000 0x0 0x3e8000>,
                  <0x2 0x31320000 0x0 0x4000>,
                  <0x2 0x31344000 0x0 0x4000>,
                  <0x2 0x31800000 0x0 0x800000>,
                  <0x2 0x3b3d0000 0x0 0x4000>;
            reg-names = "coproc", "disp-0", "disp-1", "disp-2",
                        "disp-3", "disp-4";
            mboxes = <&dcp_mbox>;
            mbox-names = "mbox";
            iommus = <&dcp_dart 0>;
            apple,bw-scratch = <&pmgr_dcp 0 5 0x14>;
            apple,bw-doorbell = <&pmgr_dcp 1 6>;

            piodma {
                iommus = <&disp_dart 0>;
            };
        };
    };
...
