%YAML 1.2
---
$id: http://devicetree.org/schemas/display/apple,dcp-expert.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple display expert control registers

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Display control and timing register apertures associated with a display
  coprocessor. These registers can be shared with firmware-owned display
  blocks and must not be accessed without an ownership handoff.

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - apple,t6041-dcp-expert
              - apple,t8132-dcp-expert
              - apple,t8140-dcp-expert
      required:
        - compatible
    -
      properties:
        compatible:
          items:
            -
              const: apple,t6050-dcp-expert
            -
              const: apple,dcp-expert
      required:
        - compatible

properties:
  compatible: true
  reg: true
  interrupts: true
  iommus: true
  power-domains: true
  clocks: true
  resets: true
  status: true

additionalProperties: true

allOf:
  - if:
      anyOf:
        -
          properties:
            compatible:
              items:
                -
                  const: apple,t6050-dcp-expert
                -
                  const: apple,dcp-expert
            status:
              const: disabled
          required:
            - compatible
            - status
    then:
      oneOf:
        -
          description: |
            T6050 native resource description. Firmware ownership, backend support and enables require
            separate qualification. This variant remains disabled and contains no programming sequences or
            firmware data.
          properties:
            compatible:
              items:
                -
                  const: apple,t6050-dcp-expert
                -
                  const: apple,dcp-expert
            status:
              const: disabled
            reg:
              minItems: 3
              maxItems: 13
              description: |
                Native register apertures in hardware-interface order, including shared auxiliary views.
            interrupts:
              maxItems: 1
          required:
            - compatible
            - reg
            - status
            - interrupts
          additionalProperties: false
    else:
      properties:
        compatible: true
      allOf:
        - if:
            properties:
              compatible:
                contains:
                  enum:
                    - apple,t8132-dcp-expert
            required:
              - compatible
          then:
            properties:
              compatible:
                items:
                  - enum:
                      - apple,t8132-dcp-expert
                  - const: apple,dcp-expert

              reg:
                minItems: 2
                maxItems: 2

            required:
              - compatible
              - reg

          else:
            properties:
              compatible:
                oneOf:
                  - items:
                      - const: apple,t6041-dcp-expert
                      - const: apple,dcp-expert
                  - items:
                      - const: apple,t8140-dcp-expert
                      - const: apple,dcp-expert

              reg:
                minItems: 3
                maxItems: 17
                description: Register apertures in hardware-description order.

              interrupts:
                maxItems: 1

            required:
              - compatible
              - reg
              - interrupts
      unevaluatedProperties: false
