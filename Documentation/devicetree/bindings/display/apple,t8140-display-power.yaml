%YAML 1.2
---
$id: http://devicetree.org/schemas/display/apple,t8140-display-power.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8140, T8142, T6040 and T6041 display power words

maintainers:
  - Diljit Singh <hey@djdev.me>

description:
  The words a display coprocessor's driver writes to power its domains off
  and on around a restart of its firmware, as macOS does. A display
  coprocessor names this node in its apple,display-power property. The words
  belong to the power manager and the display block, so no driver binds it.

properties:
  compatible:
    enum:
      - apple,t6040-display-power
      - apple,t6041-display-power
      - apple,t8140-display-power
      - apple,t8142-display-power

  reg:
    minItems: 2
    maxItems: 7

  reg-names:
    minItems: 2
    maxItems: 7

required:
  - compatible
  - reg
  - reg-names

allOf:
  - if:
      properties:
        compatible:
          const: apple,t8140-display-power
    then:
      properties:
        reg:
          items:
            - description: the display PMC word that counts the powered coprocessors
            - description: the power manager's power state words
            - description: the power manager's power gate words
        reg-names:
          items:
            - const: pmc-dcp
            - const: ps
            - const: pwrgate
  - if:
      properties:
        compatible:
          const: apple,t8142-display-power
    then:
      # T8142's PMC keeps no count of the powered coprocessors: no pmc-dcp word.
      properties:
        reg:
          items:
            - description: the power manager's power gate words
            - description: the power manager's power state words
        reg-names:
          items:
            - const: pwrgate
            - const: ps
  - if:
      properties:
        compatible:
          enum:
            - apple,t6040-display-power
            - apple,t6041-display-power
    then:
      # The external pipes' words are in a second power manager block, and the
      # driver opens each DCP DART's fabric filter and clears bridge 4 itself.
      # T6040 has two external pipes in the complex, T6041 four.
      properties:
        reg:
          items:
            - description: the display PMC word that counts the powered coprocessors
            - description: the power manager's power state words of the internal pipe
            - description: the power manager's power gate words of the internal pipe
            - description: the power manager's power state words of the external pipes
            - description: the power manager's power gate words of the external pipes
            - description: the fabric filter protection words of the DCP DARTs
            - description: the internal display block's bridge 4 words
        reg-names:
          items:
            - const: pmc-dcp
            - const: ps
            - const: pwrgate
            - const: ps-aux
            - const: pwrgate-aux
            - const: gapf
            - const: bridge

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        display-power@3028a9c14 {
            compatible = "apple,t8140-display-power";
            reg = <0x3 0x028a9c14 0x0 0x4>,
                  <0x3 0x00700000 0x0 0x14000>,
                  <0x3 0x00724000 0x0 0x1000>;
            reg-names = "pmc-dcp", "ps", "pwrgate";
        };
    };

  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        display-power@380724000 {
            compatible = "apple,t8142-display-power";
            reg = <0x3 0x80724000 0x0 0x2000>,
                  <0x3 0x80700000 0x0 0x14000>;
            reg-names = "pwrgate", "ps";
        };
    };

  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        display-power@5048a9c14 {
            compatible = "apple,t6041-display-power";
            reg = <0x5 0x048a9c14 0x0 0x4>,
                  <0x5 0x02280000 0x0 0x14000>,
                  <0x5 0x022a1000 0x0 0x100>,
                  <0x5 0x02800000 0x0 0x1000>,
                  <0x5 0x0282d000 0x0 0x1000>,
                  <0x5 0x00578000 0x0 0x1000>,
                  <0x4 0x03000100 0x0 0x10>;
            reg-names = "pmc-dcp", "ps", "pwrgate", "ps-aux", "pwrgate-aux",
                        "gapf", "bridge";
        };
    };
