%YAML 1.2
---
$id: http://devicetree.org/schemas/display/apple,m2-display-coprocessor.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M2 generation display coprocessor

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Display coprocessor resources on M2 generation SoCs. The register apertures
  follow hardware resource order. Firmware configuration and tuning are
  supplied by the bootloader and are not part of this binding. Unqualified
  instances must remain disabled.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6021-display-coprocessor
          - apple,t6022-display-coprocessor
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t6021-display-coprocessor
          - apple,t6022-display-coprocessor
      - const: apple,display-coprocessor

  reg:
    maxItems: 2

  interrupts:
    maxItems: 4

  iommus:
    maxItems: 1

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - iommus
  - power-domains

additionalProperties: false
