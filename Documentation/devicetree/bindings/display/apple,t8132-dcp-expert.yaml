%YAML 1.2
---
$id: http://devicetree.org/schemas/display/apple,t8132-dcp-expert.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M4 base SoC display power sideband

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the M4 base SoC display power sideband.
  The interface is described for discovery and must remain disabled until
  its ownership, initialization and shutdown are supported. Register windows
  are listed in hardware resource order; firmware configuration and tuning
  data are supplied by the boot firmware rather than this binding.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t8132-dcp-expert
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t8132-dcp-expert
      - const: apple,dcp-expert

  reg:
    minItems: 2
    maxItems: 2

required:
  - compatible
  - reg

additionalProperties: false
