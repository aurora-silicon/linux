%YAML 1.2
---
$id: http://devicetree.org/schemas/display/apple,sac-controller.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple display SAC controller

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Display SAC firmware controller associated with the SAC manager.

properties:
  compatible:
    oneOf:
      - items:
          - const: apple,t6041-sac-controller
          - const: apple,sac-controller
      - items:
          - const: apple,t8140-sac-controller
          - const: apple,sac-controller

  apple,manager:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Firmware SAC manager.

required:
  - compatible
  - apple,manager

additionalProperties: false
