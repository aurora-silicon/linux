%YAML 1.2
---
$id: http://devicetree.org/schemas/display/apple,dp-in.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple DisplayPort input adapter

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the Apple Silicon DisplayPort input adapter.
  The interface is described for discovery and must remain disabled until
  its ownership, initialization and shutdown are supported. Register windows
  are listed in hardware resource order; firmware configuration and tuning
  data are supplied by the boot firmware rather than this binding.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t8122-dp-in
          - apple,t6030-dp-in
          - apple,t6031-dp-in
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t8122-dp-in
          - apple,t6030-dp-in
          - apple,t6031-dp-in
      - const: apple,dp-in

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false
