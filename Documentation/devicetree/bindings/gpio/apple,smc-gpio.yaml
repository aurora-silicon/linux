%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/apple,smc-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Mac System Management Controller GPIO

maintainers:
  - Sven Peter <sven@kernel.org>

description:
  Apple Mac System Management Controller GPIO block.

properties:
  compatible:
    enum:
      - apple,smc-gpio
      - apple,smc-low-gpio

  gpio-controller: true

  '#gpio-cells':
    const: 2

  apple,output-templates:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 2
    maxItems: 128
    description: Pairs of GPIO number and native four-byte output template.

  apple,pcio-templates:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 3
    maxItems: 192
    description: Triples of GPIO number and native pcIO low/high word templates.

required:
  - compatible
  - gpio-controller
  - '#gpio-cells'

additionalProperties: false
