%YAML 1.2
---
$id: http://devicetree.org/schemas/npu/apple,m2-ane-cluster.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M2 generation neural engine cluster

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Neural engine cluster resources on M2 generation SoCs. The register apertures
  follow hardware resource order. Firmware configuration and tuning are
  supplied by the bootloader and are not part of this binding. Unqualified
  instances must remain disabled.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6022-ane-cluster
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t6022-ane-cluster
      - const: apple,ane-cluster

  reg:
    maxItems: 3

  interrupts:
    maxItems: 1

  iommus:
    maxItems: 4

  power-domains:
    maxItems: 2

required:
  - compatible
  - reg
  - interrupts
  - iommus
  - power-domains

additionalProperties: false
