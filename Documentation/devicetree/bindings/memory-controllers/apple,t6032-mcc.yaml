%YAML 1.2
---
$id: http://devicetree.org/schemas/memory-controllers/apple,t6032-mcc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T6032 memory controller

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the T6032 memory controller. The package contains two
  peripheral dies. Register banks follow hardware resource order. The block
  remains disabled until its ownership and lifecycle are supported; firmware
  data and tuning are supplied separately by the boot firmware.

select:
  properties:
    compatible:
      contains:
        const: apple,t6032-mcc
  required:
    - compatible

properties:
  compatible:
    items:
      - const: apple,t6032-mcc
      - const: apple,mcc

  reg:
    minItems: 20
    maxItems: 20

required:
  - compatible
  - reg

additionalProperties: false
