%YAML 1.2
---
$id: http://devicetree.org/schemas/memory-controllers/apple,m3-mcc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M3 family memory controller

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the M3 family memory controller.
  The interface is described for discovery and must remain disabled until
  its ownership, initialization and shutdown are supported. Register windows
  are listed in hardware resource order; firmware configuration and tuning
  data are supplied by the boot firmware rather than this binding.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t8122-mcc
          - apple,t6030-mcc
          - apple,t6031-mcc
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t8122-mcc
          - apple,t6030-mcc
          - apple,t6031-mcc
      - const: apple,mcc

  reg:
    minItems: 5
    maxItems: 11

required:
  - compatible
  - reg

additionalProperties: false
