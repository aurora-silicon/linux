%YAML 1.2
---
$id: http://devicetree.org/schemas/gpu/apple,agx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SoC GPU

maintainers:
  - Sasha Finkelstein <k@chaosmail.tech>

properties:
  compatible:
    oneOf:
      - enum:
          - apple,agx-g13g
          - apple,agx-g13s
          - apple,agx-g14g
          - apple,agx-g14s
          - apple,agx-t6040
          - apple,agx-t8132
          - apple,agx-t8140
      - items:
          - enum:
              - apple,agx-g13c
              - apple,agx-g13d
          - const: apple,agx-g13s
      - items:
          - enum:
              - apple,agx-g14c
              - apple,agx-g14d
          - const: apple,agx-g14s

  reg:
    maxItems: 2

  reg-names:
    maxItems: 2

  power-domains:
    maxItems: 1

  mboxes:
    minItems: 1
    maxItems: 2

  memory-region:
    minItems: 3
    items:
      - description: Region containing GPU MMU TTBs
      - description: Region containing GPU MMU page tables
      - description:
          Region containing a shared handoff structure for VM
          management coordination
      - description:
          Power calibration blob, firmware shared-L2 page or firmware data
          segment
      - description:
          GPU calibration blob, preserved firmware text or firmware
          kernel-window page tables
      - description:
          Shared global variables, preserved firmware data or text segment of
          the loaded GPU firmware

  memory-region-names:
    minItems: 3
    items:
      - const: ttbs
      - const: pagetables
      - const: handoff
      - enum: [hw-cal-a, shared-l2, fw-data]
      - enum: [hw-cal-b, fw-text, l2-pagetables]
      - enum: [globals, fw-data, fw-text]

  apple,pmp:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: PMP firmware provider owning the GPU power vote and telemetry

  operating-points-v2: true

  apple,firmware-version:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 3
    maxItems: 3
    description:
      macOS version (major, minor, patch) whose boot firmware loaded the GPU
      firmware, which identifies the firmware build. Filled in by the boot
      loader.

  apple,cs-opp:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Operating-point table of the GPU's CS clock domain, one voltage cell per
      state.

  apple,afr-opp:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Operating-point table of the GPU's AFR clock domain, one voltage cell
      per state.

  apple,firmware-abi:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 3
    description:
      macOS version the current firmware is paired with, used to pick
      the version of firmware ABI to be used.
      Bootloader will overwrite this

required:
  - compatible
  - reg
  - mboxes
  - memory-region

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: apple,agx-t8132
    then:
      properties:
        reg:
          items:
            - description: GPU coprocessor control registers
            - description: GPU block MMIO registers
        mboxes:
          maxItems: 1
        reg-names:
          items:
            - const: asc
            - const: sgx
        memory-region:
          minItems: 6
        memory-region-names:
          items:
            - const: ttbs
            - const: pagetables
            - const: handoff
            - const: shared-l2
            - const: fw-text
            - const: fw-data
      required:
        - apple,pmp
        - power-domains
        - reg-names
        - memory-region-names
    else:
      properties:
        apple,pmp: false
  - if:
      properties:
        compatible:
          contains:
            const: apple,agx-t8140
    then:
      properties:
        reg:
          items:
            - description: GFX coprocessor control registers
            - description: GPU block MMIO registers
        reg-names:
          items:
            - const: asc
            - const: sgx
        mboxes:
          items:
            - description: GFX coprocessor mailbox
            - description: GFX1 coprocessor mailbox
        memory-region:
          items:
            - description: Region containing GPU MMU TTBs
            - description: Region containing GPU MMU page tables
            - description:
                Region containing a shared handoff structure for VM
                management coordination
        memory-region-names:
          items:
            - const: ttbs
            - const: pagetables
            - const: handoff
      required:
        - power-domains
        - operating-points-v2
  - if:
      properties:
        compatible:
          contains:
            const: apple,agx-t6040
    then:
      properties:
        reg:
          items:
            - description: GFX coprocessor control registers
            - description: GPU block MMIO registers
        reg-names:
          items:
            - const: asc
            - const: sgx
        mboxes:
          items:
            - description: GFX coprocessor mailbox
        memory-region:
          items:
            - description: Region containing GPU MMU TTBs
            - description: Region containing GPU MMU page tables
            - description:
                Region containing a shared handoff structure for VM
                management coordination
            - description:
                Data segment of the loaded GPU firmware, where the firmware
                places its crash log
            - description:
                Region in which the GPU firmware builds the page tables of
                its kernel window
            - description:
                Text segment of the loaded GPU firmware, which identifies the
                firmware build
        memory-region-names:
          items:
            - const: ttbs
            - const: pagetables
            - const: handoff
            - const: fw-data
            - const: l2-pagetables
            - const: fw-text
      required:
        - power-domains
        - operating-points-v2
        - apple,cs-opp
        - apple,afr-opp
  - if:
      not:
        properties:
          compatible:
            contains:
              enum:
                - apple,agx-t6040
                - apple,agx-t8132
                - apple,agx-t8140
    then:
      properties:
        reg:
          items:
            - description: GPU coprocessor control registers
            - description: GPU block MMIO registers
        reg-names:
          items:
            - const: asc
            - const: sgx
        mboxes:
          maxItems: 1
        memory-region:
          minItems: 6
        memory-region-names:
          items:
            - const: ttbs
            - const: pagetables
            - const: handoff
            - const: hw-cal-a
            - const: hw-cal-b
            - const: globals
      required:
        - apple,firmware-abi

additionalProperties: false

examples:
  - |
    gpu@6400000 {
        compatible = "apple,agx-g13g";
        reg = <0x6400000 0x40000>,
              <0x4000000 0x1000000>;
        reg-names = "asc", "sgx";
        mboxes = <&agx_mbox>;
        power-domains = <&ps_gfx>;
        memory-region = <&uat_ttbs>, <&uat_pagetables>, <&uat_handoff>,
                        <&gpu_hw_cal_a>, <&gpu_hw_cal_b>, <&gpu_globals>;
        memory-region-names = "ttbs", "pagetables", "handoff",
                              "hw-cal-a", "hw-cal-b", "globals";

        apple,firmware-abi = <0 0 0>;
    };
...
