%YAML 1.2
---
$id: http://devicetree.org/schemas/firmware/apple,j714s-atc0-handoff.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple J714s ATC0 boot ownership handoff interface

maintainers:
  - Dj <hey@djdev.me>

description: |
  The J714s left-back USB-C port is also the boot producer's debug port.
  Its devices start disabled. This firmware interface identifies the group
  the producer may enable after relinquishing USB/debug ownership, proving
  no DMA was retained, and supplying the current machine's PHY tunables.
  Shared providers are excluded. Older producers leave the group disabled;
  Linux does not activate it.

properties:
  compatible:
    const: apple,j714s-atc0-handoff

  apple,devices:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    minItems: 1
    maxItems: 32
    items:
      maxItems: 1
    description: |
      ATC0-only power domains, PHY and mailbox, USB DARTs and DRD, port
      controller, router and mailbox/NHI/DART, PCIe tunnel parent/DART/root
      controller, and display crossbar. Every member must be disabled until
      handoff. Do not include the shared AOP GPIO, AUSS or CIO reset providers.

required:
  - compatible
  - apple,devices

additionalProperties: false
