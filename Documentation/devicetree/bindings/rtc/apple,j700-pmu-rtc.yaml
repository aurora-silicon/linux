%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/apple,j700-pmu-rtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Baku and Abbey PMU real-time clocks

maintainers:
  - Ryan Murray <ryan@aurorasilicon.org>

description: |
  The PMU exposes a 65536 Hz counter and an alarm comparator over SPMI.
  The clock's offset is shared with the SMC RTC through a little-endian
  NVMEM cell: eight bytes of whole seconds on Baku, or six bytes of signed
  33.15 fixed-point seconds on Abbey. This function is a child of the
  PMIC NVMEM provider and uses that provider's SPMI register map.

allOf:
  - $ref: rtc.yaml#

properties:
  compatible:
    enum:
      - apple,j700-pmu-rtc
      - apple,t6041-pmu-rtc

  interrupts:
    maxItems: 1

  nvmem-cells:
    maxItems: 1
    description: The shared RTC offset, in the format described above.

  nvmem-cell-names:
    items:
      - const: rtc_offset

  wakeup-source: true

required:
  - compatible
  - interrupts
  - nvmem-cells
  - nvmem-cell-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/spmi/spmi.h>

    pmic@e {
        compatible = "apple,baku-pmic", "apple,spmi-nvmem";
        reg = <0xe SPMI_USID>;

        rtc {
            compatible = "apple,j700-pmu-rtc";
            interrupt-parent = <&spmi>;
            interrupts = <2 IRQ_TYPE_EDGE_RISING>;
            nvmem-cells = <&rtc_offset>;
            nvmem-cell-names = "rtc_offset";
            wakeup-source;
        };
    };
