%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/apple,abbey-pmu-rtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Abbey SPMI PMU real-time clock

maintainers:
  - Dj <hey@djdev.me>

description: |
  The Abbey PMU exposes a 48-bit 65536 Hz counter and a signed 48-bit
  wall-clock offset in units of 1/32768 second. Its alarm comparator uses
  32-bit counter seconds. NVMEM cells use little-endian byte order.
  The one-byte alarm control has event bit 1, monitor bit 0 and enable
  bit 6. The one-byte interrupt mask has the alarm mask in bit 0.
  This layout is distinct from the Baku PMU RTC.

allOf:
  - $ref: rtc.yaml#

properties:
  compatible:
    const: apple,abbey-pmu-rtc

  interrupts:
    maxItems: 1
    description: Alarm event interrupt from the SPMI controller

  nvmem-cells:
    minItems: 5
    maxItems: 5
    description: Counter (6), offset (6), alarm (4), control (1), mask (1) bytes

  nvmem-cell-names:
    items:
      - const: counter
      - const: rtc_offset
      - const: alarm
      - const: alarm_ctrl
      - const: irq_mask

  wakeup-source: true

required:
  - compatible
  - nvmem-cells
  - nvmem-cell-names

unevaluatedProperties: false
