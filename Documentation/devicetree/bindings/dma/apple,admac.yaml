%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/apple,admac.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Audio DMA Controller (ADMAC)

maintainers:
  - Martin Povišer <povik+lin@cutebit.org>

description: |
  Apple's Audio DMA Controller (ADMAC) is used to fetch and store audio samples
  on SoCs from the "Apple Silicon" family.

  The controller has been seen with up to 32 channels. Even-numbered channels
  are TX-only, odd-numbered are RX-only. Individual channels are coupled to
  fixed device endpoints.

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - apple,admac
              - apple,t6000-admac
              - apple,t6020-admac
              - apple,t6030-admac
              - apple,t6031-admac
              - apple,t6041-admac
              - apple,t8103-admac
              - apple,t8112-admac
              - apple,t8122-admac
              - apple,t8132-admac
              - apple,t8140-admac
      required:
        - compatible
    -
      properties:
        compatible:
          allOf:
            -
              contains:
                enum:
                  - apple,t8142-admac
                  - apple,t8152-admac
                  - apple,t6050-admac
            -
              contains:
                const: apple,admac
      required:
        - compatible
allOf:
  -
    if:
      anyOf:
        -
          properties:
            compatible:
              allOf:
                -
                  contains:
                    enum:
                      - apple,t8142-admac
                      - apple,t8152-admac
                      - apple,t6050-admac
                -
                  contains:
                    const: apple,admac
            status:
              const: disabled
          required:
            - compatible
            - status
          not:
            required:
              - mboxes
    then:
      oneOf:
        -
          type: object
          description: |
            Apple audio dma controller complex. Initial resource description for an unsupported
            firmware/backend layout. Register, IRQ and DMA topology can be recorded before a driver
            exists. This form must stay disabled; it does not substitute for the enabled driver contract
            or supply firmware, calibration, programming sequences or unresolved providers.
          properties:
            compatible:
              items:
                -
                  enum:
                    - apple,t8142-admac
                    - apple,t8152-admac
                    - apple,t6050-admac
                -
                  const: apple,admac
            status:
              const: disabled
            reg:
              description: |
                Register apertures of the complete hardware complex, in hardware interface order.
              minItems: 2
              maxItems: 2
            interrupts:
              description: Interrupt lines wired to the system interrupt controller.
              maxItems: 1
            iommus:
              description: DMA translation streams emitted by this hardware.
              maxItems: 1
            "#dma-cells":
              const: 1
          required:
            - compatible
            - reg
            - status
            - "#dma-cells"
          additionalProperties: false
    else:
      $ref: "#/$defs/legacy-driver"

unevaluatedProperties: false

$defs:
  legacy-driver:
    type: object
    allOf:
      - $ref: dma-controller.yaml#
    properties:
      compatible:
        oneOf:
          - items:
              - const: apple,t6020-admac
              - const: apple,t8103-admac
          - items:
              - enum:
                  # Do not add additional SoC to this list.
                  - apple,t6000-admac
                  - apple,t8103-admac
                  - apple,t8112-admac
              - const: apple,admac
          - items:
              - enum:
                  - apple,t6030-admac
                  - apple,t6031-admac
              - const: apple,t8122-admac
          - const: apple,t8122-admac
          - const: apple,t8140-admac
          - const: apple,t8132-admac
          - items:
              - const: apple,t6041-admac
              - const: apple,t8132-admac

      reg:
        maxItems: 1

      '#dma-cells':
        const: 1
        description:
          Clients specify a single cell with channel number. Logical IDs alternate
          TX and RX, including T8132 controllers with separate register banks.

      dma-channels:
        maximum: 32

      interrupts:
        minItems: 4
        maxItems: 4
        description:
          Interrupts that correspond to the 4 IRQ outputs of the controller. Usually
          only one of the controller outputs will be connected as an usable interrupt
          source. The remaining interrupts will be left without a valid value, e.g.
          in an interrupts-extended list the disconnected positions will contain
          an empty phandle reference <0>.

      iommus:
        minItems: 1
        maxItems: 2

      apple,dma-range:
        $ref: /schemas/types.yaml#/definitions/uint64-array
        minItems: 2
        maxItems: 2
        description:
          Host DMA allocation window as a base and nonzero size. T8140 ADMAC
          instances share firmware-owned AOP DART roots and use windows assigned
          to their own streams. If absent, the DART allocation aperture applies.

      nonposted-mmio: true

      power-domains:
        maxItems: 1

      resets:
        maxItems: 1
    required:
      - compatible
      - reg
      - '#dma-cells'
      - dma-channels
      - interrupts
    additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    aic: interrupt-controller {
      interrupt-controller;
      #interrupt-cells = <3>;
    };

    admac: dma-controller@238200000 {
      compatible = "apple,t8103-admac", "apple,admac";
      reg = <0x38200000 0x34000>;
      dma-channels = <24>;
      interrupts-extended = <0>,
                            <&aic AIC_IRQ 626 IRQ_TYPE_LEVEL_HIGH>,
                            <0>,
                            <0>;
      #dma-cells = <1>;
    };
