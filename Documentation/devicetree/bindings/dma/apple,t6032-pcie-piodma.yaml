%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/apple,t6032-pcie-piodma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T6032 PCIe programmed I/O DMA engine

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the T6032 PCIe programmed I/O DMA engine. The package contains two
  peripheral dies. Register banks follow hardware resource order. The block
  remains disabled until its ownership and lifecycle are supported; firmware
  data and tuning are supplied separately by the boot firmware.

select:
  properties:
    compatible:
      contains:
        const: apple,t6032-pcie-piodma
  required:
    - compatible

properties:
  compatible:
    items:
      - const: apple,t6032-pcie-piodma
      - const: apple,pcie-piodma

  reg:
    minItems: 3
    maxItems: 4

  interrupts:
    minItems: 1
    maxItems: 1

  iommus:
    minItems: 1
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false
