%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/apple,m3-pcie-piodma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M3 family PCIe programmed I/O DMA engine

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  Hardware resources of the M3 family PCIe programmed I/O DMA engine.
  The interface is described for discovery and must remain disabled until
  its ownership, initialization and shutdown are supported. Register windows
  are listed in hardware resource order; firmware configuration and tuning
  data are supplied by the boot firmware rather than this binding.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t8122-pcie-piodma
          - apple,t6030-pcie-piodma
          - apple,t6031-pcie-piodma
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t8122-pcie-piodma
          - apple,t6030-pcie-piodma
          - apple,t6031-pcie-piodma
      - const: apple,pcie-piodma

  reg:
    minItems: 3
    maxItems: 4

  interrupts:
    minItems: 1
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false
