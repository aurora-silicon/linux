%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/apple,m2-pcie-piodma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple M2 generation PCIe programmed I/O DMA

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  PCIe programmed I/O DMA resources on M2 generation SoCs. The register apertures
  follow hardware resource order. Firmware configuration and tuning are
  supplied by the bootloader and are not part of this binding. Unqualified
  instances must remain disabled.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6020-pcie-piodma
          - apple,t6021-pcie-piodma
          - apple,t6022-pcie-piodma
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - apple,t6020-pcie-piodma
          - apple,t6021-pcie-piodma
          - apple,t6022-pcie-piodma
      - const: apple,pcie-piodma

  reg:
    maxItems: 3

  interrupts:
    maxItems: 1

  iommus:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - iommus

additionalProperties: false
