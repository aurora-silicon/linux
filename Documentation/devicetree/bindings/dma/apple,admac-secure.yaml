%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/apple,admac-secure.yaml#

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple secure audio DMA controller

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  The secure LEAP audio DMA controller's direct hardware aperture. It is
  distinct from the AP-accessible channel proxy. Its register aperture is
  not safe for the AP to access until firmware transfers ownership. The
  node remains disabled and must not select the ordinary ADMAC driver.
  Linux logical channel IDs alternate TX and RX; the ADT slot count is
  per direction.

select:
  anyOf:
    -
      properties:
        compatible:
          contains:
            enum:
              - apple,admac-secure
              - apple,t8140-admac-secure
      required:
        - compatible
    -
      properties:
        compatible:
          items:
            -
              const: apple,t6050-admac-secure
            -
              const: apple,admac-secure
      required:
        - compatible

properties:
  compatible: true
  reg: true
  "#dma-cells": true
  dma-channels:
    const: 18
  interrupts: true
  iommus: true
  power-domains: true
  clocks: true
  resets: true
  status: true

additionalProperties: true

allOf:
  - if:
      anyOf:
        -
          properties:
            compatible:
              items:
                -
                  const: apple,t6050-admac-secure
                -
                  const: apple,admac-secure
            status:
              const: disabled
          required:
            - compatible
            - status
    then:
      oneOf:
        -
          description: |
            T6050 native resource description. Firmware ownership, backend support and enables require
            separate qualification. This variant remains disabled and contains no programming sequences or
            firmware data.
          properties:
            compatible:
              items:
                -
                  const: apple,t6050-admac-secure
                -
                  const: apple,admac-secure
            status:
              const: disabled
            reg:
              maxItems: 1
              description: |
                Native register apertures in hardware-interface order, including shared auxiliary views.
            "#dma-cells":
              const: 1
          required:
            - compatible
            - reg
            - status
            - "#dma-cells"
          additionalProperties: false
    else:
      allOf:
        - $ref: dma-controller.yaml#
      properties:
        compatible:
          items:
            - const: apple,t8140-admac-secure
            - const: apple,admac-secure

        reg:
          maxItems: 1

        '#dma-cells':
          const: 1

        dma-channels:
          const: 18

        interrupts:
          maxItems: 1

        iommus:
          maxItems: 1

        power-domains:
          maxItems: 1
      required:
        - compatible
        - reg
        - '#dma-cells'
        - dma-channels
        - interrupts
        - iommus
        - power-domains
      additionalProperties: false
