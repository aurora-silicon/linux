%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/apple,t8140-pcie-bootstrap.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8140 PCIe bootstrap engine

maintainers:
  - Ace <Acelogic@users.noreply.github.com>

description: |
  This engine performs a single retained config read before native downstream
  ECAM access is enabled for the T8140 radio PCIe host. It does not expose
  generic DMA channels or establish an engine reset or memory reuse contract.
  The host selects this engine with apple,piodma; apple,pcie-host must point
  back to that host. The legacy compatible is supported for existing Stage 2
  device trees.

properties:
  compatible:
    oneOf:
      - const: apple,t8140-pcie-bootstrap
      - const: apple,t8140-piodma-diagnostic
        deprecated: true
      - items:
          - const: apple,t8140-pcie-bootstrap
          - const: apple,t8140-piodma-diagnostic

  reg:
    items:
      - description: Request engine
      - description: Interrupt aggregator
      - description: PCIe fabric interface

  reg-names:
    items:
      - const: engine
      - const: irq-aggregator
      - const: fabric

  interrupts:
    maxItems: 1

  power-domains:
    maxItems: 1

  iommus:
    maxItems: 1

  apple,pcie-host:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: PCIe host controller whose ECAM access this engine primes.

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - power-domains
  - iommus
  - apple,pcie-host

additionalProperties: false
