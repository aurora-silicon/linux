%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/apple,pcie-piodma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple PCIe PIODMA engine

maintainers:
  - Ryan Murray <81541646+RyanTheTide@users.noreply.github.com>

description: |
  PCIe auxiliary DMA register banks and completion interrupt. The stream
  is distinct from the PCIe endpoint streams in the same DART.

select:
  properties:
    compatible:
      contains:
        enum:
          - apple,t6041-pcie-piodma
          - apple,t8132-pcie-piodma
  required:
    - compatible

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - apple,t8132-pcie-piodma
      required:
        - compatible
    then:
      properties:
        compatible:
          items:
            - enum:
                - apple,t8132-pcie-piodma
            - const: apple,pcie-piodma

        reg:
          minItems: 3
          maxItems: 3

        interrupts:
          minItems: 1
          maxItems: 1

        iommus:
          maxItems: 1

      required:
        - compatible
        - reg
        - interrupts
        - iommus

      additionalProperties: false
    else:
      properties:
        compatible:
          oneOf:
            - items:
                - const: apple,t6041-pcie-piodma
                - const: apple,pcie-piodma

        reg:
          minItems: 3
          maxItems: 3
          description: Register apertures in hardware-description order.

        interrupts:
          minItems: 1
          maxItems: 1

        iommus:
          minItems: 1
          maxItems: 1

      required:
        - compatible
        - reg
        - interrupts
        - iommus

      additionalProperties: false
