name: Apple DRM KUnit

# The Apple display driver's KUnit suites behind
# CONFIG_DRM_APPLE_DISPLAY_KUNIT_TEST (mode probing, external audio, boot
# loader handoff, ...) on arm64 QEMU. They use fake coprocessors and nodes,
# so they run without a display controller.

on:
  pull_request:
    branches: [main]
    paths:
      - 'drivers/gpu/drm/apple/**'
      - '.github/workflows/apple-drm-kunit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-drm-kunit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kunit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install kernel build and QEMU dependencies
        run: |
          # As sep-source.yml: avoid the hosted runner's Azure mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' 'https://security.ubuntu.com/ubuntu/' | \
              sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get update -o APT::Update::Error-Mode=any
          sudo apt-get install -y clang lld llvm libelf-dev libssl-dev \
            flex bison bc pkg-config make perl qemu-system-arm
      - name: Run the Apple display KUnit suites on arm64 QEMU
        run: |
          ./tools/testing/kunit/kunit.py run --arch=arm64 \
            --make_options LLVM=1 \
            --kunitconfig=drivers/gpu/drm/apple/tests/display.kunitconfig \
            --jobs="$(nproc)" --timeout=900
