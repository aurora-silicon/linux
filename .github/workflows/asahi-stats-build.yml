name: Asahi statistics kernel build

on:
  pull_request:
    branches: [aurora-wip]
    paths:
      - drivers/gpu/drm/asahi/**
      - drivers/pmdomain/apple/**
      - .github/workflows/asahi-stats-build.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: asahi-stats-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ARCH: arm64
      LLVM: 1
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - name: Fetch the exact public source snapshot
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/asahi-stats-source.tar.gz"
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" > "$archive"
          sha256sum "$archive" > "$RUNNER_TEMP/asahi-stats-source.sha256"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/asahi-stats-source.commit"
          tar -xzf "$archive" --strip-components=1 -C "$GITHUB_WORKSPACE"
      - name: Install build tools
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-key.asc"
          sudo install -m 644 "$RUNNER_TEMP/llvm-key.asc" /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update -q
          sudo apt-get install -y -q clang-22 lld-22 llvm-22 libclang-22-dev flex bison bc libelf-dev libssl-dev
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src --component rustfmt --no-self-update
          cargo install bindgen-cli --version 0.73.2 --locked
          bin="$RUNNER_TEMP/llvm"
          mkdir -p "$bin"
          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            ln -s "$(command -v "$tool-22")" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=/usr/lib/llvm-22/lib" >> "$GITHUB_ENV"
      - name: Configure the Asahi drivers as built-ins
        run: |
          make O=out defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/asahi.config
          # Distribution configs enable SCHEDSTATS. Keep its aligned structure
          # nonempty: bindgen cannot model the empty aligned form faithfully.
          scripts/config --file out/.config -e RUST -e DRM_ASAHI -e APPLE_PMP_REPORT -e SCHEDSTATS
          make O=out olddefconfig
          grep -qx CONFIG_RUST=y out/.config
          grep -qx CONFIG_DRM_ASAHI=y out/.config
          grep -qx CONFIG_APPLE_PMP_REPORT=y out/.config
          grep -qx CONFIG_SCHEDSTATS=y out/.config
          cp out/.config "$RUNNER_TEMP/asahi-stats.config"
          make O=out rustavailable
          clang --version
          rustc --version
          bindgen --version
      - name: Build and link the ARM64 kernel
        run: |
          set -o pipefail
          make O=out -j"$(nproc)" Image 2>&1 | tee "$RUNNER_TEMP/asahi-stats-build.log"
          test -s out/drivers/gpu/drm/asahi/asahi_core.o
          test -s out/drivers/pmdomain/apple/pmp-report.o
          test -s out/arch/arm64/boot/Image
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asahi-stats-build-evidence
          path: |
            ${{ runner.temp }}/asahi-stats.config
            ${{ runner.temp }}/asahi-stats-build.log
            ${{ runner.temp }}/asahi-stats-source.sha256
            ${{ runner.temp }}/asahi-stats-source.commit
          retention-days: 14
  dram-parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install UML tools
        run: sudo apt-get update -q && sudo apt-get install -y -q flex bison bc libelf-dev libssl-dev
      - name: Exercise the firmware-property parser under UML
        run: |
          cat > "$RUNNER_TEMP/dram.kunitconfig" <<'EOF'
          CONFIG_KUNIT=y
          CONFIG_PM=y
          CONFIG_APPLE_PMP_DRAM_KUNIT_TEST=y
          EOF
          TMPDIR="$RUNNER_TEMP" python3 tools/testing/kunit/kunit.py run --timeout=120 --kunitconfig="$RUNNER_TEMP/dram.kunitconfig" --build_dir="$RUNNER_TEMP/kunit-dram" --jobs=2
